# 신규 설치용 기본 설정입니다. 업데이트 시 기존 GCMod.cfg를 보존하세요.
# GCMod 전용 단축키는 없습니다. 대화창·가독성·프레임 제한은 게임 옵션에서 조절합니다.
# 옵션에서는 미리보기 후 설정 저장을 눌러 확정합니다. 닫으면 미저장 변경을 폐기합니다.
# cfg나 번역 파일을 직접 수정한 경우 게임을 재시작하세요.
[General]
# 게임 옵션에서 30/60 FPS 선택. 0 이하는 게임 기본값을 따르는 고급 설정입니다.
FrameRate = 60

[Message.Window]
# 불투명도: 0=투명, 1=불투명. 일반창과 CG창은 독립적으로 저장됩니다.
NormalAlpha = 0
CgModeAlpha = 0

[Message.Text]
# 가독성 보정 켜기/끄기는 게임 옵션에서 조절합니다.
Modified = true
# 아래 값은 고급 설정입니다. 본문·화자명 색상의 알파는 게임의 표시/페이드 동작을 따릅니다.
NameColor = FFFFFFFF
MessageColor = FFFFFFFF
FaceDilate = 0.3
OutlineColor = 3A3A3AFF
OutlineWidth = 0.3
OutlineSoftness = 0.01
CharacterSpacing = 0

[Translation]
# 대사·Master·UI·이미지 번역 적용을 제어합니다. 기존 표시와 폰트까지 원상 복구하는 전환은 아닙니다.
Enabled = true
Language = ko
# offline이면 번역 데이터 네트워크 갱신을 사용하지 않습니다. DLL/폰트는 별도 업데이트합니다.
CDN = https://raw.githubusercontent.com/kekwkekw/gctrans/main
# 번역 준비 대기 방식을 바꾸는 고급 설정입니다. 일반 성능 옵션이 아닙니다.
AsyncMode = false
# 비워 두면 기본 번역 폴더를 사용합니다. 지정할 때는 절대 경로를 사용하세요.
CustomPath =

[Translation.MasterData]
# *는 전체 테이블. 테이블명을 쉼표로 구분하거나 빈 값으로 전체 비활성화할 수 있습니다.
EnabledTables = *

[Translation.Font]
# BepInEx/plugins 기준 상대 경로 또는 절대 경로.
AssetBundlePath = GCMod/fonts/RHR_Medium_GFSAFE_ADH.bundle
