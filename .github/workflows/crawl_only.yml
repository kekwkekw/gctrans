name: One-shot WebGL Metadata Snapshot - No Persistent CI History

on:
  workflow_dispatch:
    inputs:
      source_ids:
        description: "Optional existing Novel IDs for an explicit metadata plan (comma/space separated); no raw acquisition."
        required: false
        default: ""
        type: string
      max_candidates:
        description: "Validated metadata-plan candidate limit. 0 preserves the explicit unlimited setting."
        required: true
        default: "200"
        type: string

permissions:
  contents: read

concurrency:
  group: metadata-snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snapshot:
    name: Observe one known WebGL metadata inventory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the metadata HTTP dependency
        run: python -m pip install httpx==0.27.2

      - name: Create a fresh metadata-only snapshot
        env:
          CRAWL_SOURCE_IDS: ${{ inputs.source_ids }}
          CRAWL_MAX_CANDIDATES: ${{ inputs.max_candidates }}
        # Fresh runner custody has no prior comparison history. No --acquire.
        run: python scripts/crawl_only.py --state-root crawl_out/state --raw-root crawl_out/raw --output crawl_out/scan.json

      - name: Verify tracked repository files are unchanged
        if: always()
        run: |
          git diff --exit-code
          git diff --cached --exit-code

      - name: Summarize the actual scan report with public-safe fields
        if: always()
        run: python tools/update/snapshot_summary.py --scan crawl_out/scan.json --summary crawl_out/public-summary.md --report crawl_out/public-summary.json --one-shot

      - name: Publish metadata snapshot summary
        if: always()
        run: |
          if [ -f crawl_out/public-summary.md ]; then
            cat crawl_out/public-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload only the public metadata summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gctrans-metadata-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            crawl_out/public-summary.json
            crawl_out/public-summary.md
          if-no-files-found: error
          retention-days: 7
