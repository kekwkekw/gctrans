name: Apply reviewed scenarios 20003702-20003706

on:
  push:
    branches:
      - translation/new-scenario-20003702-20003706-20261023

permissions:
  contents: write

concurrency:
  group: apply-reviewed-scenarios-20003702-20003706
  cancel-in-progress: false

jobs:
  apply-reviewed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Verify base and reviewed payloads
        shell: bash
        run: |
          set -euo pipefail
          expected_base='8cebfe3e51cd0659bdd8417f55796f9d9968484d'
          git merge-base --is-ancestor "$expected_base" HEAD
          test "$(git rev-list --count "$expected_base"..HEAD)" -le 2
          cat > "$RUNNER_TEMP/payload.sha256" <<'EOF'
          754d5d85ffcaa9ee901e20589ba0b5fc78f7bb7db5b0c8e1eff65c417e9c14ca  .github/review-payloads/20003702.json
          81f18c13d4296adeea5c03b3c6c536cc44c8c470e84ae3f0e9a7ce387994ebcf  .github/review-payloads/20003703.json
          9f76b6718061d70e23a3ec2cecedf7f992411c095ad4bc4e30ea28f430b3e133  .github/review-payloads/20003704.json
          1a52c2216c56326fbb553183a852f04bdefdf484c6e65b01530fcdab4590f168  .github/review-payloads/20003705.json
          128dd30d38537fba9adaed0fac96a8ccb6dd12882d0406688c8759942b578314  .github/review-payloads/20003706.json
          EOF
          sha256sum --check "$RUNNER_TEMP/payload.sha256"
          for id in 20003702 20003703 20003704 20003705 20003706; do
            test ! -e "translations/ko/novels/$id.json"
          done

      - name: Apply Novel payloads and rebuild official manifests
        shell: bash
        run: |
          set -euo pipefail
          for id in 20003702 20003703 20003704 20003705 20003706; do
            cp ".github/review-payloads/$id.json" "translations/ko/novels/$id.json"
          done
          python -X utf8 tools/build_manifests.py translations/ko \
            --add novels/20003702.json \
            --add novels/20003703.json \
            --add novels/20003704.json \
            --add novels/20003705.json \
            --add novels/20003706.json \
            --register 20003702 \
            --register 20003703 \
            --register 20003704 \
            --register 20003705 \
            --register 20003706

      - name: Verify exact reviewed production bytes
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/production.sha256" <<'EOF'
          2769f487af51dd53b9150512c89c6dcd7939aefd906be222029e3d0b7e68ff23  translations/ko/legacy-components.json
          d1c439e93f1dcdcdae54357c0db47db812280e2e515ab0a0285614ebfdc73bfe  translations/ko/manifest.json
          754d5d85ffcaa9ee901e20589ba0b5fc78f7bb7db5b0c8e1eff65c417e9c14ca  translations/ko/novels/20003702.json
          81f18c13d4296adeea5c03b3c6c536cc44c8c470e84ae3f0e9a7ce387994ebcf  translations/ko/novels/20003703.json
          9f76b6718061d70e23a3ec2cecedf7f992411c095ad4bc4e30ea28f430b3e133  translations/ko/novels/20003704.json
          1a52c2216c56326fbb553183a852f04bdefdf484c6e65b01530fcdab4590f168  translations/ko/novels/20003705.json
          128dd30d38537fba9adaed0fac96a8ccb6dd12882d0406688c8759942b578314  translations/ko/novels/20003706.json
          aba500bf48bbcc8ce96f1ad8a028133550aade3c8c78cd45c1a19476ee185f78  translations/ko/release-manifest.json
          1612b5c2a61f4cffc903cd67ef7c867c8f0868486fc5bf045d3b931d7aa061c4  translations/ko/ui/manifest.json
          EOF
          sha256sum --check "$RUNNER_TEMP/production.sha256"

          expected="$RUNNER_TEMP/expected-paths.txt"
          actual="$RUNNER_TEMP/actual-paths.txt"
          cat > "$expected" <<'EOF'
          translations/ko/legacy-components.json
          translations/ko/manifest.json
          translations/ko/novels/20003702.json
          translations/ko/novels/20003703.json
          translations/ko/novels/20003704.json
          translations/ko/novels/20003705.json
          translations/ko/novels/20003706.json
          translations/ko/release-manifest.json
          translations/ko/ui/manifest.json
          EOF
          { git diff --name-only -- translations/ko; git ls-files --others --exclude-standard -- translations/ko; } | sort -u > "$actual"
          diff -u "$expected" "$actual"

      - name: Run repository verification gates
        shell: bash
        run: |
          set -euo pipefail
          python -X utf8 tools/verify_staged_release.py translations/ko --report "$RUNNER_TEMP/STAGING.json"
          python -X utf8 tools/update/cli.py preflight --candidate-root . --report "$RUNNER_TEMP/PREFLIGHT.json"
          python -X utf8 -m unittest discover -s tests -p 'test_*.py' -v
          dotnet build tools/UpdateCli/UpdateCli.csproj -c Release -p:NuGetAudit=false
          dotnet tools/UpdateCli/bin/Release/net9.0/UpdateCli.dll prepare-local \
            --store "$RUNNER_TEMP/isolated-store" \
            --package "$GITHUB_WORKSPACE/translations/ko" \
            --based-on NONE

      - name: Commit the exact reviewed production change
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            translations/ko/legacy-components.json
            translations/ko/manifest.json
            translations/ko/novels/20003702.json
            translations/ko/novels/20003703.json
            translations/ko/novels/20003704.json
            translations/ko/novels/20003705.json
            translations/ko/novels/20003706.json
            translations/ko/release-manifest.json
            translations/ko/ui/manifest.json
          )
          git add -- "${paths[@]}"
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 9
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Translate new scenarios 20003702-20003706' \
            -m '247 rows; 74 PRO edits; HOLD 0; Names/Knowledge changes 0. Rebuild and verify package metadata.'
          git push origin "HEAD:${GITHUB_REF_NAME}"
