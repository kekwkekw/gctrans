name: Retired - Legacy Automatic Translation Writer

# Notice only. This local definition does not change the server's workflow state.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired-notice:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Explain the reviewed local operation path
        run: |
          printf '%s\n' \
            'The legacy automatic translation writer is retired.' \
            'Use docs/OPERATOR_KO.md: persistent local scan, diff, actionable intake, existing WB review, explicit apply-review.' \
            'This workflow only prints this notice. It does not collect, translate, merge, or publish files.' \
            >> "$GITHUB_STEP_SUMMARY"
