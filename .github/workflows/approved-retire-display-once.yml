name: One-shot approved retirement and display application
on:
  push:
    branches: [ops/approved-retire-display-20261017]
    paths: [.github/workflows/approved-retire-display-once.yml]
permissions:
  contents: write
concurrency:
  group: approved-retire-display-20261017
  cancel-in-progress: false
jobs:
  apply-reviewed-snapshot:
    if: github.repository == 'kekwkekw/gctrans'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact reviewed changes to a separate candidate branch
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
        shell: bash
        run: |
          python3 -B - <<'PYCODE'
          from pathlib import Path
          import base64, lzma, hashlib, json
          directory = Path('one-shot/approved-retire-display')
          encoded = ''.join((directory / ('payload.part' + str(i))).read_text().strip() for i in range(3))
          raw = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(raw).hexdigest() == '8e8b608a9b94f33dee5a9e4509c8b520ba5b94c28d80d8695f73b46ff34a742c'
          payload = json.loads(raw)
          worker = (directory / 'worker.py').read_bytes()
          assert hashlib.sha256(worker).hexdigest() == '81659c5c30cdd35dbf579e9a02984483e04fe94ad53c677ccd70f634aaac3853'
          scope = {}
          exec(compile(worker, 'reviewed-one-shot-worker.py', 'exec'), scope)
          scope['publish'](Path.cwd(), payload)
          PYCODE
