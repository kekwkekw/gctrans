name: LocalParity source and package checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: python -m pip install UnityPy==1.10.18 httpx==0.27.2
      - run: python tools/verify_local_parity.py --output work/local-parity/check.json
      - name: Verify tracked inputs remain unchanged
        run: git diff --exit-code
      # Game interop/Utility and Native testing stay on the operator's PC.
      # This workflow never uploads raw sources, builds a game-dependent DLL,
      # modifies translations, or publishes a release.
