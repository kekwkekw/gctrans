<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>걸즈 크리에이션 12장 최종 수락 번역</title>
<style>
:root {
  color-scheme: light dark;
  --bg:#f5f6f8; --panel:#ffffff; --panel2:#f0f2f5; --text:#20232a; --muted:#6c7480;
  --border:#d9dde3; --accent:#5865f2; --accent-soft:#eef0ff; --shadow:0 2px 12px rgba(0,0,0,.06);
  --jp:#5a6270;
}
html[data-theme="dark"] {
  --bg:#111318; --panel:#1a1d24; --panel2:#22262f; --text:#e9ecf1; --muted:#9ba3af;
  --border:#333944; --accent:#8c98ff; --accent-soft:#262c50; --shadow:0 2px 16px rgba(0,0,0,.24);
  --jp:#b4bac4;
}
* { box-sizing:border-box; }
body {
  margin:0; background:var(--bg); color:var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  line-height:1.65;
}
button,input,select { font:inherit; }
.app { max-width:1500px; margin:0 auto; min-height:100vh; }
header {
  position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--panel) 94%, transparent);
  backdrop-filter:blur(12px); border-bottom:1px solid var(--border);
}
.header-inner { padding:14px 18px 12px; }
h1 { margin:0; font-size:1.18rem; line-height:1.3; }
.subtitle { margin-top:4px; color:var(--muted); font-size:.82rem; }
.controls {
  display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px;
}
.control, .btn {
  border:1px solid var(--border); background:var(--panel); color:var(--text);
  border-radius:10px; min-height:38px;
}
.search { flex:1 1 260px; padding:8px 11px; min-width:160px; }
.btn { padding:7px 11px; cursor:pointer; }
.btn.active { border-color:var(--accent); background:var(--accent-soft); color:var(--accent); font-weight:650; }
.main { display:grid; grid-template-columns:250px minmax(0,1fr); gap:16px; padding:16px; }
.sidebar {
  position:sticky; top:126px; align-self:start; max-height:calc(100vh - 145px); overflow:auto;
  background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:9px; box-shadow:var(--shadow);
}
.ep-btn {
  width:100%; text-align:left; border:0; background:transparent; color:var(--text);
  padding:10px; border-radius:9px; cursor:pointer; margin:1px 0;
}
.ep-btn:hover { background:var(--panel2); }
.ep-btn.active { background:var(--accent-soft); color:var(--accent); }
.ep-id { display:block; font-size:.73rem; color:var(--muted); margin-bottom:2px; }
.ep-title { display:block; font-size:.9rem; font-weight:650; }
.content { min-width:0; }
.episode-head {
  background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:16px 18px;
  margin-bottom:12px; box-shadow:var(--shadow);
}
.episode-head h2 { margin:0; font-size:1.35rem; }
.episode-meta { color:var(--muted); font-size:.82rem; margin-top:4px; }
.row-card {
  background:var(--panel); border:1px solid var(--border); border-radius:13px;
  padding:14px 16px; margin:9px 0; box-shadow:var(--shadow);
  cursor:pointer;
  transition:border-color .15s ease, background-color .15s ease, transform .08s ease;
}
.row-card:hover {
  border-color:color-mix(in srgb, var(--accent) 35%, var(--border));
}
.row-card:focus-visible {
  outline:2px solid var(--accent);
  outline-offset:2px;
}
.row-card.open {
  border-color:color-mix(in srgb, var(--accent) 55%, var(--border));
}
.row-card.open .jp-block { display:block; }
.jp-toggle-hint {
  color:var(--muted); font-size:.72rem; margin-left:4px; user-select:none;
}
.show-jp .jp-toggle-hint { display:none; }
.row-card.title-row { border-color:color-mix(in srgb, var(--accent) 45%, var(--border)); }
.row-top { display:flex; align-items:baseline; gap:8px; margin-bottom:7px; flex-wrap:wrap; }
.speaker { font-weight:750; }
.speaker-jp { color:var(--muted); font-size:.8rem; }
.row-index, .command {
  margin-left:auto; color:var(--muted); font-size:.72rem; font-variant-numeric:tabular-nums;
}
.command { margin-left:0; border:1px solid var(--border); border-radius:99px; padding:0 6px; }
.ko { font-size:var(--reader-size, 1rem); white-space:pre-wrap; word-break:keep-all; overflow-wrap:anywhere; }
.jp-block {
  display:none; border-top:1px dashed var(--border); margin-top:10px; padding-top:9px;
  color:var(--jp); font-size:calc(var(--reader-size, 1rem) * .9); white-space:pre-wrap; overflow-wrap:anywhere;
}
.show-jp .jp-block { display:block; }
.search-hit { outline:2px solid color-mix(in srgb, var(--accent) 42%, transparent); }
.no-results {
  text-align:center; color:var(--muted); padding:48px 16px; background:var(--panel);
  border:1px solid var(--border); border-radius:14px;
}
footer { color:var(--muted); font-size:.78rem; padding:2px 18px 24px 282px; }
mark { background:#ffe17a; color:#222; border-radius:3px; padding:0 1px; }
.small-note { color:var(--muted); font-size:.78rem; margin-top:8px; }
@media (max-width: 820px) {
  .main { grid-template-columns:1fr; padding:10px; }
  .sidebar {
    position:static; display:flex; overflow-x:auto; max-height:none; padding:6px; gap:4px;
  }
  .ep-btn { min-width:145px; }
  footer { padding:5px 14px 22px; }
  .header-inner { padding:11px 10px 10px; }
}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="header-inner">
    <h1>걸즈 크리에이션 — 12장 최종 수락 번역</h1>
    <div class="subtitle">프로젝트 최종 수락본 기준 · 11개 시나리오 · 722행 · 대사 클릭 시 JP 원문</div>
    <div class="controls">
      <input id="search" class="control search" type="search" placeholder="현재 시나리오에서 화자·원문·번역 검색">
      <button id="jpBtn" class="btn" type="button"></button>
      <button id="themeBtn" class="btn" type="button"></button>
      <label class="control" style="display:flex;align-items:center;gap:7px;padding:5px 10px">
        글자
        <input id="size" type="range" min="14" max="24" step="1" value="16">
      </label>
    </div>
  </div>
</header>
<main class="main">
  <nav id="epList" class="sidebar" aria-label="시나리오 목록"></nav>
  <section id="content" class="content"></section>
</main>
<footer>
  각 대사 카드를 클릭하면 해당 행의 JP 원문만 펼쳐집니다. 상단 버튼으로 전체 JP 원문도 표시할 수 있습니다.<br>
  표시 순서는 script ID 순서입니다. 프로젝트 기록상 공식 회차 순서는 별도 검증되지 않았습니다.
  번역 본문은 12장 722행 사용자 수락 checkpoint와 동일한 최종 번역 값을 사용했습니다.
</footer>
</div>
<script>window.TRANSLATION_DATA={"episodes":[{"id":"10011201","titleKo":"소동 뒤의 짧은 평화","titleJp":"騒動の後、つかの間の平和","rows":[{"index":0,"command":"title","speakerJp":"","speakerKo":"","jp":"騒動の後、つかの間の平和","ko":"소동 뒤의 짧은 평화"},{"index":1,"command":"message","speakerJp":"","speakerKo":"","jp":"フィーニスの長であるヴィルジニアとの戦いが終わり、しばらく後の事。\\n事件の後処理や、各所への連絡、\\n損傷した美術館の補修の手続きに追われる日々を過ごしていた。","ko":"피니스의 수장인 비르지니아와의 싸움이 끝나고, 얼마쯤 지난 뒤의 일이다.<br>사건의 뒷수습과 각지에 연락하는 일,<br>파손된 미술관의 보수 절차에 쫓기며 하루하루를 보내고 있었다."},{"index":2,"command":"message","speakerJp":"","speakerKo":"","jp":"気を抜くと、つい溜め息が出てしまう。\\nそれを見たサンソヴィーノは、心配そうに俺の顔を覗き込む。","ko":"조금만 긴장을 풀어도 저절로 한숨이 나왔다.<br>그 모습을 본 산소비노가 걱정스레 내 얼굴을 들여다봤다."},{"index":3,"command":"msgvoicesync","speakerJp":"サンソヴィーノ","speakerKo":"산소비노","jp":"「館長様……そろそろお休みを取ってはいかがですか？」","ko":"「관장님…… 이제 슬슬 쉬시는 게 어떨까요?」"},{"index":4,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「いや、まだ議会に出す報告書が書けていないんだ。\\n　それにサンソヴィーノこそ、ずっと働き詰めだろう？」","ko":"「아니, 아직 의회에 낼 보고서를 다 못 썼어.<br>　그보다 산소비노야말로 계속 일만 하고 있잖아?」"},{"index":5,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「他のみんなも休んでいるんだ。\\n　俺のことは気にせず、休みを取ってくれ」","ko":"「다른 사람들도 쉬고 있어.<br>　내 걱정은 말고, 너도 좀 쉬어」"},{"index":6,"command":"message","speakerJp":"","speakerKo":"","jp":"ヴィルジニアを撃破し、フィーニスを壊滅させることに成功した。\\nだが、フィーニスの残党である死の芸術家たちは、\\n今も街のどこかに潜み、爪を研いでいることだろう。","ko":"비르지니아를 쓰러뜨리고 피니스를 괴멸시키는 데 성공했다.<br>하지만 피니스의 잔당인 죽음의 예술가들은<br>지금도 도시 어딘가에 숨어 발톱을 갈고 있을 것이다."},{"index":7,"command":"message","speakerJp":"","speakerKo":"","jp":"美術館は、今後も芸術犯罪に対応していかなければならない。\\nだからこそ、いざという時に備えて藝術家やイマージュたちには、\\n代わる代わるではあるが、休息を取ってもらっている。","ko":"미술관은 앞으로도 예술 범죄에 대응해야 한다.<br>그렇기에 만일의 사태에 대비해 예술가들과 이마쥬들에게는<br>교대로나마 휴식을 취하게 하고 있다."},{"index":8,"command":"msgvoicesync","speakerJp":"サンソヴィーノ","speakerKo":"산소비노","jp":"「館長様がお仕事をされているのに、私が休む訳にはいきません」","ko":"「관장님께서 일하고 계신데 저만 쉴 수는 없어요.」"},{"index":9,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「では、こうしよう。\\n　今日この書類が終わったら俺も休む。\\n　それで、明日はふたり一緒に休暇を取る」","ko":"「그럼 이렇게 하자.<br>　오늘 이 서류 작업을 끝내면 나도 쉴게.<br>　그리고 내일은 둘이 함께 휴가를 내는 거야.」"},{"index":10,"command":"msgvoicesync","speakerJp":"サンソヴィーノ","speakerKo":"산소비노","jp":"「それは……明日は休館ということでいいんですか？」","ko":"「그 말씀은…… 내일은 미술관을 닫는다는 뜻인가요?」"},{"index":11,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「あぁ。\\n　どのみち、今の街の状態じゃ来館する人はいないだろう」","ko":"「그래.<br>　어차피 지금 도시 상황으로는 찾아올 사람도 없겠지.」"},{"index":12,"command":"msgvoicesync","speakerJp":"サンソヴィーノ","speakerKo":"산소비노","jp":"「……わかりました。\\n　館長様がそうおっしゃるのであれば、お休みをいただきます」","ko":"「……알겠습니다.<br>　관장님께서 그렇게 말씀하시니, 저도 쉬도록 할게요.」"},{"index":13,"command":"msgvoicesync","speakerJp":"サンソヴィーノ","speakerKo":"산소비노","jp":"「ですが、今まであまりきちんと休んだことがないので、\\n　なにをしたらいいか……」","ko":"「하지만 지금까지 제대로 쉬어 본 적이 별로 없어서,<br>　뭘 해야 할지……」"},{"index":14,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「それを考えるのも楽しいと思うぞ。\\n　例えば、誰かを誘ってどこかに行ってもいいし、\\n　ひとりで街を歩くだけでも気分転換になりそうだな」","ko":"「그걸 생각하는 것도 재미있을 거야.<br>　누군가를 불러서 어디 가도 좋고,<br>　혼자 도시를 걷기만 해도 기분 전환이 되겠지.」"},{"index":15,"command":"msgvoicesync","speakerJp":"サンソヴィーノ","speakerKo":"산소비노","jp":"「それはわかりますが……考えてみると難しいですね。\\n　ほとんどの方がお休み中ですから、今から予定を伺うのも……」","ko":"「그건 알지만…… 막상 생각해 보니 어렵네요.<br>　대부분 쉬고 계시니, 이제 와서 일정을 여쭤보기도……」"},{"index":16,"command":"msgvoicesync","speakerJp":"アルテ","speakerKo":"아르테","jp":"「では、私とバカンスにでも行きますか」","ko":"「그럼 저랑 휴양 여행이라도 떠나실래요?」"},{"index":17,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「なんだ、いたのか」","ko":"「뭐야, 여기 있었어?」"},{"index":18,"command":"msgvoicesync","speakerJp":"アルテ","speakerKo":"아르테","jp":"「さっきからそこのソファで寝てましたよ。\\n　いい話が聞こえてきたので、起きましたけど」","ko":"「아까부터 저기 소파에서 자고 있었어요.<br>　솔깃한 얘기가 들려서 깼지만요.」"},{"index":19,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「お前はいつも休んでるだろう……」","ko":"「넌 항상 쉬고 있잖아……」"},{"index":20,"command":"msgvoicesync","speakerJp":"アルテ","speakerKo":"아르테","jp":"「そんなことはありません。\\n　自主的な休みと、いただける休みには大きな違いがありますので」","ko":"「그렇지 않아요.<br>　스스로 쉬는 것과 정식으로 받는 휴식은 아주 다르거든요.」"},{"index":21,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「それほど変わらないだろう。\\n　……まあ、それはそれとして、\\n　さっきのバカンスの話だが、良いんじゃないか？」","ko":"「그렇게까지 다르진 않을 텐데.<br>　……뭐, 그건 그렇고,<br>　아까 말한 휴양, 괜찮지 않을까?」"},{"index":22,"command":"msgvoicesync","speakerJp":"アルテ","speakerKo":"아르테","jp":"「そうでしょう、そうでしょう」","ko":"「그렇죠, 그렇죠.」"},{"index":23,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「ちなみに、どこに行くつもりなんだ？」","ko":"「그런데 어디로 갈 생각이야?」"},{"index":24,"command":"msgvoicesync","speakerJp":"アルテ","speakerKo":"아르테","jp":"「ちょっと海の方にでも行ってみようかなと。\\n　海辺で昼寝をするのです」","ko":"「바다 쪽으로나 가 볼까 하고요.<br>　바닷가에서 낮잠을 자는 거죠.」"},{"index":25,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「海にまで行って寝るつもりか？」","ko":"「바다까지 가서 잘 생각이야?」"},{"index":26,"command":"msgvoicesync","speakerJp":"アルテ","speakerKo":"아르테","jp":"「遠出をしての昼寝も贅沢じゃないですか。\\n　という訳で、特にやることがないなら、\\n　私と海までちょっとした小旅行に行きましょう」","ko":"「멀리 나가서 낮잠을 자는 것도 호사잖아요.<br>　그러니 딱히 할 일이 없으시면<br>　저랑 바다까지 짧은 여행을 떠나요.」"},{"index":27,"command":"msgvoicesync","speakerJp":"サンソヴィーノ","speakerKo":"산소비노","jp":"「私が一緒に行ってもいいのですか？」","ko":"「제가 함께 가도 괜찮을까요?」"},{"index":28,"command":"msgvoicesync","speakerJp":"アルテ","speakerKo":"아르테","jp":"「もちろんです。\\n　行き帰りでおしゃべりできる相手がいると、私もありがたいですし。\\n　サンソヴィーノが嫌じゃなければ、ですが」","ko":"「물론이죠.<br>　오가는 길에 말동무가 있으면 저도 좋고요.<br>　산소비노만 싫지 않다면요.」"},{"index":29,"command":"msgvoicesync","speakerJp":"サンソヴィーノ","speakerKo":"산소비노","jp":"「そんなことはありません！\\n　お誘い、とっても嬉しいです！」","ko":"「싫을 리가요!<br>　불러 주셔서 정말 기뻐요!」"},{"index":30,"command":"msgvoicesync","speakerJp":"アルテ","speakerKo":"아르테","jp":"「では、早速準備しましょう。\\n　快適なバカンスのためにも、準備は入念にしなくてはなりません！」","ko":"「그럼 바로 준비하죠.<br>　편안한 휴양을 즐기려면 준비도 꼼꼼히 해야 하니까요!」"},{"index":31,"command":"msgvoicesync","speakerJp":"サンソヴィーノ","speakerKo":"산소비노","jp":"「はい！\\n　……あっ、ですが残りの業務は……」","ko":"「네!<br>　……아, 하지만 남은 업무가……」"},{"index":32,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「もう、今日の業務はほとんどないだろう？\\n　準備の時間も必要だろうから、今日はもうあがって良いぞ」","ko":"「오늘 할 일은 이제 거의 없지?<br>　준비할 시간도 필요할 테니, 오늘은 이만 퇴근해도 돼.」"},{"index":33,"command":"msgvoicesync","speakerJp":"サンソヴィーノ","speakerKo":"산소비노","jp":"「ありがとうございます。\\n　では、そうさせていただきますね」","ko":"「감사합니다.<br>　그럼 그렇게 할게요.」"},{"index":34,"command":"msgvoicesync","speakerJp":"アルテ","speakerKo":"아르테","jp":"「館長はどうします？\\n　どうしてもというなら、一緒に連れて行ってあげなくもないですよ」","ko":"「관장은 어떻게 하실래요?<br>　정 그렇게 원하시면 같이 데려가 드릴 수도 있고요.」"},{"index":35,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「いや、今回は遠慮しておこうかな」","ko":"「아니, 이번엔 사양할까 해.」"},{"index":36,"command":"msgvoicesync","speakerJp":"サンソヴィーノ","speakerKo":"산소비노","jp":"「そうですか……」","ko":"「그러신가요……」"},{"index":37,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「残念そうにしてくれるのはありがたいが、\\n　ふたりとはいつも一緒にいるからな。\\n　バカンスの時くらいは本当に仕事を忘れてほしいんだ」","ko":"「아쉬워해 주는 건 고맙지만,<br>　너희 둘과는 늘 함께 있잖아.<br>　휴양을 떠날 때만큼은 정말로 일을 잊었으면 해.」"},{"index":38,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「俺が一緒にいると、そうもいかないだろう？」","ko":"「내가 같이 있으면 그러기 어렵겠지?」"},{"index":39,"command":"msgvoicesync","speakerJp":"アルテ","speakerKo":"아르테","jp":"「んー……。\\n　そういうことであれば、ふたりで行きますか」","ko":"「음…….<br>　그런 뜻이라면, 둘이서 갈까요?」"},{"index":40,"command":"msgvoicesync","speakerJp":"サンソヴィーノ","speakerKo":"산소비노","jp":"「そうですね。\\n　お土産買ってきます」","ko":"「그렇네요.<br>　선물 사 올게요.」"},{"index":41,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「ありがとう、楽しみにしてるよ。\\n　次の休みは、俺も一緒に連れて行ってくれ」","ko":"「고마워, 기대할게.<br>　다음 휴일에는 나도 같이 데려가 줘.」"},{"index":42,"command":"msgvoicesync","speakerJp":"サンソヴィーノ","speakerKo":"산소비노","jp":"「約束ですよ」","ko":"「약속이에요.」"},{"index":43,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「あぁ、約束だ」","ko":"「그래, 약속이야.」"},{"index":44,"command":"message","speakerJp":"","speakerKo":"","jp":"そしてふたりはバタバタと出ていった。\\nひとりになった空間で、ひっそりと息を吐く。","ko":"그렇게 두 사람은 분주하게 나갔다.<br>혼자 남은 공간에서 조용히 숨을 내쉬었다."},{"index":45,"command":"message","speakerJp":"","speakerKo":"","jp":"フィーニスという組織自体は壊滅したが、\\nこの街が抱えている問題はまだ多い。","ko":"피니스라는 조직 자체는 괴멸했지만,<br>이 도시에 남은 문제는 아직 많다."},{"index":46,"command":"message","speakerJp":"","speakerKo":"","jp":"何処かに消えたコレットに、２代目を自称するフラワーマン。\\nこの街に潜んでいる、芸術犯罪者たち。","ko":"어딘가로 사라진 콜레트와, 2대 플라워맨을 자칭하는 자.<br>이 도시에 숨어 있는 예술 범죄자들."},{"index":47,"command":"message","speakerJp":"","speakerKo":"","jp":"一般の犯罪についても、\\nアテネス市警がまだ立て直しの最中ということもあり、\\n治安の悪化はどうしても避けられない。","ko":"일반 범죄도 마찬가지다.<br>아테네스 시경이 아직 조직을 추스르는 중인 만큼,<br>치안 악화는 아무래도 피할 수 없다."},{"index":48,"command":"message","speakerJp":"","speakerKo":"","jp":"新藝術騎士団も治安維持に協力してくれているものの、\\nあちらの資本は貴族たちだ。","ko":"신예술기사단도 치안 유지에 협력하고는 있지만,<br>그들의 자금줄은 귀족들이다."},{"index":49,"command":"message","speakerJp":"","speakerKo":"","jp":"治安悪化に伴い、貴族たちの身が危険に晒されれば、\\nそちらに人手を割くのは仕方がない。","ko":"치안이 나빠져 귀족들의 신변이 위험해지면,<br>그쪽에 인력을 돌릴 수밖에 없다."},{"index":50,"command":"message","speakerJp":"","speakerKo":"","jp":"美術館も街の外にいた藝術家たちに声をかけ、\\n助力を得て体制を立て直している状態だ。\\n本当はまだまだ休んでいる暇なんてない。","ko":"미술관도 도시 밖에 있던 예술가들에게 연락해<br>도움을 받으며 체제를 재정비하고 있다.<br>사실 아직은 쉴 틈 같은 건 없다."},{"index":51,"command":"message","speakerJp":"","speakerKo":"","jp":"そして……アルテの記憶について調査していた時に遭遇した、あの少女。","ko":"그리고…… 아르테의 기억을 조사하다 마주친, 그 소녀."},{"index":52,"command":"message","speakerJp":"アルテ","speakerKo":"아르테","jp":"「私の記憶を消したのはあなたではないんですか？」","ko":"「제 기억을 지운 건 당신 아닌가요?」"},{"index":53,"command":"msgvoicesync","speakerJp":"黒服の女","speakerKo":"검은 옷을 입은 여자","jp":"「あんた……記憶が……いや、そう……そういうことね。\\n　それでアルテなんて偽名を名乗ってるんだ」","ko":"「너…… 기억이…… 아니, 그래…… 그런 거였구나.<br>　그래서 아르테 같은 가명을 쓰고 있는 거네.」"},{"index":54,"command":"message","speakerJp":"アルテ","speakerKo":"아르테","jp":"「なにをひとりで納得してるんですか。\\n　私とあなたは何者なんです？」","ko":"「뭘 혼자 납득하고 있는 거예요?<br>　저와 당신은 대체 누구죠?」"},{"index":55,"command":"message","speakerJp":"黒服の女","speakerKo":"검은 옷을 입은 여자","jp":"「まぁ、真実が知りたければ死の芸術の事件を追い続けることだね」","ko":"「뭐, 진실을 알고 싶다면 죽음의 예술 사건을 계속 쫓아 봐.」"},{"index":56,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「真実が知りたければ……か」","ko":"「진실을 알고 싶다면……이라.」"},{"index":57,"command":"message","speakerJp":"","speakerKo":"","jp":"あの出来事の後、すぐにフィーニスが襲撃して来たこともあり、\\n黒服の女の行方はわかっていない。","ko":"그 일이 있고 곧바로 피니스의 습격을 받은 탓도 있어서,<br>검은 옷을 입은 여자가 어디 있는지는 알아내지 못했다."},{"index":58,"command":"message","speakerJp":"","speakerKo":"","jp":"あの様子だと、遠からずまたアルテの前に現れるだろう。\\nアルテの記憶に関する問題は、まだなにも解決していないのだから。","ko":"그 모습으로 보아 머지않아 다시 아르테 앞에 나타날 것이다.<br>아르테의 기억에 관한 문제는 아직 아무것도 해결되지 않았으니까."},{"index":59,"command":"message","speakerJp":"","speakerKo":"","jp":"フィーニスの騒動で、アテネスもかなりの被害を受けた。\\nその事件の爪痕が少しずつ薄れると共に、\\n街も本来の活気を取り戻しつつあったが――","ko":"피니스의 소동으로 아테네스도 상당한 피해를 입었다.<br>그 사건의 상흔이 조금씩 옅어지면서<br>도시도 본래의 활기를 되찾아 가고 있었지만――"},{"index":60,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「さて、どうしたものか……」","ko":"「자, 뭘 하면 좋을까……」"},{"index":61,"command":"message","speakerJp":"","speakerKo":"","jp":"休みを取ってみたものの、サンソヴィーノと同じ状態になっていた。\\nやはり、ただ遊んで過ごすというのは抵抗がある。","ko":"휴가를 내기는 했지만, 산소비노와 같은 처지가 되어 버렸다.<br>역시 그저 놀면서 시간을 보내자니 마음이 편치 않았다."},{"index":62,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「……ゴッホとテレサの様子を見に行くのもいいな」","ko":"「……고흐와 테레사가 어떻게 지내는지 보러 가도 좋겠네.」"},{"index":63,"command":"message","speakerJp":"","speakerKo":"","jp":"ここのところ、美術館に籠りっぱなしだ。\\n他の藝術家はともかく、ゴッホには会えない日々が続いていた。","ko":"요즘은 줄곧 미술관에만 틀어박혀 있었다.<br>다른 예술가들은 몰라도, 고흐와는 한동안 만나지 못했다."},{"index":64,"command":"message","speakerJp":"","speakerKo":"","jp":"ゴッホは今、テレサの仮釈放に伴いアトリエにいるはずだ。\\n様子を見に行ってみようと足を向けると、\\n珍しい３人組を見つけたので、声をかけてみた。","ko":"테레사가 가석방됐으니, 고흐는 지금 아틀리에에 있을 것이다.<br>어떻게 지내는지 보러 발걸음을 옮기던 중,<br>좀처럼 함께 보기 힘든 세 사람을 발견하고 말을 걸었다."},{"index":65,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「やぁ、彫刻家組お揃いで」","ko":"「안녕, 조각가들이 다 모였네.」"},{"index":66,"command":"msgvoicesync","speakerJp":"ドナテッロ","speakerKo":"도나텔로","jp":"「あっ、館長くんだ！」","ko":"「아, 관장 군이다!」"},{"index":67,"command":"msgvoicesync","speakerJp":"ロダン","speakerKo":"로댕","jp":"「おそらく館長、こんにちは」","ko":"「아마 관장님, 안녕하세요.」"},{"index":68,"command":"msgvoicesync","speakerJp":"ミケランジェロ","speakerKo":"미켈란젤로","jp":"「……奇遇だな」","ko":"「……우연이군.」"},{"index":69,"command":"message","speakerJp":"","speakerKo":"","jp":"いつもの調子のロダンにドナテッロ。\\n機嫌の悪いミケランジェロは、\\n強引に連れ出されたのだろうと予想できた。","ko":"여느 때와 다름없는 로댕과 도나텔로.<br>언짢아 보이는 미켈란젤로는<br>억지로 끌려 나왔으리라는 짐작이 들었다."},{"index":70,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「休暇は楽しめているか？」","ko":"「휴가는 잘 보내고 있어?」"},{"index":71,"command":"msgvoicesync","speakerJp":"ドナテッロ","speakerKo":"도나텔로","jp":"「うん、久しぶりに羽を伸ばせてるよ！\\n　これから３人でご飯食べたり、服を見たりする予定なんだ！」","ko":"「응, 오랜만에 마음껏 쉬고 있어!<br>　이제 셋이서 밥도 먹고, 옷도 구경할 거야!」"},{"index":72,"command":"msgvoicesync","speakerJp":"ロダン","speakerKo":"로댕","jp":"「たぶん、ドナテッロから誘ってもらったはず。\\n　ミケランジェロも」","ko":"「아마 도나텔로가 같이 가자고 했을 거야.<br>　미켈란젤로한테도.」"},{"index":73,"command":"msgvoicesync","speakerJp":"ミケランジェロ","speakerKo":"미켈란젤로","jp":"「勘違いするな。\\n　フィオレンツァのやつが休めとうるさいから、\\n　ドナテッロの話に乗ってやったんだ」","ko":"「착각하지 마라.<br>　피오렌차 녀석이 쉬라고 하도 잔소리를 해서<br>　도나텔로의 제안에 응해 준 것뿐이다.」"},{"index":74,"command":"msgvoicesync","speakerJp":"ドナテッロ","speakerKo":"도나텔로","jp":"「それでも、ミケランジェロちゃんと遊べるのは嬉しいよ！」","ko":"「그래도 미켈란젤로 쨩이랑 같이 놀 수 있어서 기뻐!」"},{"index":75,"command":"msgvoicesync","speakerJp":"ミケランジェロ","speakerKo":"미켈란젤로","jp":"「くっ、くっつくな！」","ko":"「붙, 붙지 마!」"},{"index":76,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「仲が良さそうでなによりだ」","ko":"「사이좋아 보여서 다행이네.」"},{"index":77,"command":"msgvoicesync","speakerJp":"ミケランジェロ","speakerKo":"미켈란젤로","jp":"「その目は飾りか！？」","ko":"「그 눈은 장식이냐!?」"},{"index":78,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「まぁまぁ。\\n　休める時に休んでおくのも、仕事のうちだ。\\n　休みたくても休めない時があるからな」","ko":"「진정해, 진정해.<br>　쉴 수 있을 때 쉬어 두는 것도 일의 일부야.<br>　쉬고 싶어도 쉴 수 없는 때가 있으니까.」"},{"index":79,"command":"msgvoicesync","speakerJp":"ロダン","speakerKo":"로댕","jp":"「休めないかもといえば、\\n　アングルのことも心配してたりしてなかったり」","ko":"「쉬지 못할지도 모른다는 말이 나와서 말인데,<br>　앵글이 걱정되기도 하고, 안 되기도 하고.」"},{"index":80,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「アングルか……。フィーニスが壊滅して一段落ついたとはいえ、\\n　あれからずっと事後処理に追われていたな。\\n　議長が抜けた穴もあるから仕方ないのか……」","ko":"「앵글이라…… 피니스가 괴멸해서 한숨 돌리긴 했지만,<br>　그 뒤로 계속 뒷수습에 쫓기고 있었지.<br>　의장이 빠진 공백도 있으니 어쩔 수 없는 건가……」"},{"index":81,"command":"msgvoicesync","speakerJp":"ロダン","speakerKo":"로댕","jp":"「休日返上で頑張ってる感じらしいよ。\\n　心配だけど、こればっかりはどうしようもなさそう……」","ko":"「휴일도 반납하고 애쓰는 것 같대.<br>　걱정은 되지만, 이건 어떻게 해 줄 수도 없을 것 같고……」"},{"index":82,"command":"msgvoicesync","speakerJp":"ミケランジェロ","speakerKo":"미켈란젤로","jp":"「ふん……あいつは自分で背負いすぎだ。\\n　自分がやる方が早いという気持ちもわからなくはないが、\\n　後進を育てることを疎かにすると、後が怖いぞ」","ko":"「흥…… 그 녀석은 혼자 너무 많이 짊어진다.<br>　자기가 하는 게 더 빠르다는 마음도 이해는 간다만,<br>　후배를 키우는 데 소홀하면 나중이 무서운 법이지.」"},{"index":83,"command":"msgvoicesync","speakerJp":"ロダン","speakerKo":"로댕","jp":"「つまり、アングルが倒れないように心配してる……」","ko":"「그러니까, 앵글이 쓰러질까 봐 걱정하는 거네……」"},{"index":84,"command":"msgvoicesync","speakerJp":"ミケランジェロ","speakerKo":"미켈란젤로","jp":"「こういう時だけ断定してくるな……！」","ko":"「이럴 때만 단정 짓지 마……!」"},{"index":85,"command":"msgvoicesync","speakerJp":"ミケランジェロ","speakerKo":"미켈란젤로","jp":"「変なやつが権力を持って、美術館の活動に横槍を入れられたら、\\n　たまったもんじゃないだろ」","ko":"「이상한 놈이 권력을 잡고 미술관 활동에 훼방을 놓으면,<br>　견딜 수 없을 것 아니냐.」"},{"index":86,"command":"msgvoicesync","speakerJp":"ドナテッロ","speakerKo":"도나텔로","jp":"「その分、あたしたちが頑張ればいいんだよ。\\n　議員や画家としてのお仕事は代わってあげられないけど、\\n　美術館のお仕事は分担できるし」","ko":"「그만큼 우리가 힘내면 되지.<br>　의원이나 화가로서 하는 일을 대신해 줄 순 없어도,<br>　미술관 일은 나눠서 할 수 있으니까.」"},{"index":87,"command":"msgvoicesync","speakerJp":"ミケランジェロ","speakerKo":"미켈란젤로","jp":"「勝手にミケを入れるな！」","ko":"「멋대로 미케까지 끼워 넣지 마!」"},{"index":88,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「だが、手伝ってはくれるんだろう？」","ko":"「그래도 도와주긴 할 거지?」"},{"index":89,"command":"msgvoicesync","speakerJp":"ミケランジェロ","speakerKo":"미켈란젤로","jp":"「……ふんっ。\\n　アングルについてもだが、館長も人のこと言えないだろう。\\n　ミケたちに構ってないで、休みを満喫するといい」","ko":"「……흥.<br>　앵글도 그렇지만, 관장도 남 말 할 처지는 아니지 않나.<br>　미케네는 신경 쓰지 말고 휴일이나 만끽해.」"},{"index":90,"command":"msgvoicesync","speakerJp":"ドナテッロ","speakerKo":"도나텔로","jp":"「なら、あたしたちはそろそろ行くよ。\\n　館長くん、今日はゆっくり羽を伸ばしてねー！」","ko":"「그럼 우린 슬슬 갈게.<br>　관장 군, 오늘은 푹 쉬어!」"},{"index":91,"command":"msgvoicesync","speakerJp":"ロダン","speakerKo":"로댕","jp":"「館長、おそらくまたそのうちに……」","ko":"「관장님, 아마 또 조만간에……」"},{"index":92,"command":"message","speakerJp":"","speakerKo":"","jp":"ミケランジェロはスタスタと歩き出し、\\nドナテッロは大きく手を振り、ロダンは小さく会釈して歩いていった。","ko":"미켈란젤로는 빠르게 걷기 시작했고,<br>도나텔로는 크게 손을 흔들었다. 로댕은 가볍게 목례하며 걸어갔다."},{"index":93,"command":"message","speakerJp":"","speakerKo":"","jp":"そうして仲が良くてなによりだと３人を見送り、\\n当初の目的地へと足を向けた。","ko":"그렇게 사이가 좋아서 다행이라 생각하며 세 사람을 배웅하고,<br>처음 향하려던 곳으로 발길을 돌렸다."}]},{"id":"10011202","titleKo":"각자의 휴일","titleJp":"それぞれの休日","rows":[{"index":0,"command":"title","speakerJp":"","speakerKo":"","jp":"それぞれの休日","ko":"각자의 휴일"},{"index":1,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「すみませ……」","ko":"「실례합니……」"},{"index":2,"command":"msgvoicesync","speakerJp":"エリオント","speakerKo":"엘리온트","jp":"「いらっしゃい！\\n　待ってたんだよー！」","ko":"「어서 와!<br>　기다리고 있었어!」"},{"index":3,"command":"message","speakerJp":"","speakerKo":"","jp":"ギャラリーに入るなり、元気な声と共に、\\nこちらの腹を目がけてエリオントが抱きついてきた。","ko":"갤러리에 들어서자마자, 엘리온트가 활기찬 목소리와 함께<br>내 배를 향해 달려들어 안겼다."},{"index":4,"command":"msgvoicesync","speakerJp":"ネイト","speakerKo":"네이트","jp":"「あ、エリオントさん……！\\n　いきなり突撃したら館長が倒れてしまいます……！」","ko":"「아, 엘리온트 씨……!<br>　갑자기 달려들면 관장님이 넘어지세요……!」"},{"index":5,"command":"msgvoicesync","speakerJp":"エリオント","speakerKo":"엘리온트","jp":"「ご、ごめん！\\n　痛くなかった？」","ko":"「미, 미안!<br>　아프지 않았어?」"},{"index":6,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「大丈夫だ……。\\n　エリオントは今日も元気だな」","ko":"「괜찮아…….<br>　엘리온트는 오늘도 기운이 넘치네」"},{"index":7,"command":"message","speakerJp":"","speakerKo":"","jp":"いつも明るく元気で、陽光に咲くひまわりを思わせるエリオント。\\nフィーニスの騒動の後、ゴッホの絵画から顕現したイマージュだ。","ko":"언제나 밝고 활기차서, 햇살 아래 핀 해바라기를 떠올리게 하는 엘리온트.<br>피니스 소동이 끝난 뒤, 고흐의 그림에서 현현한 이마쥬다."},{"index":8,"command":"message","speakerJp":"","speakerKo":"","jp":"今は仮釈放状態のテレサに寄り添い、\\nギャラリーの店番も担っていると聞いていた。\\n元気なようでなによりだが、元気すぎるのが玉に瑕かもしれない。","ko":"지금은 가석방된 테레사의 곁을 지키며<br>갤러리를 지키는 일도 맡고 있다고 들었다.<br>잘 지내는 것 같아 다행이지만, 기운이 넘쳐도 너무 넘치는 게 옥에 티일지도 모르겠다."},{"index":9,"command":"msgvoicesync","speakerJp":"ゴッホ","speakerKo":"고흐","jp":"「館長が来たの……？」","ko":"「관장이 왔어……?」"},{"index":10,"command":"msgvoicesync","speakerJp":"テレサ","speakerKo":"테레사","jp":"「なになに？\\n　あ！　館長さん、こんにちは！」","ko":"「뭐야, 뭐야?<br>　아! 관장님, 안녕하세요!」"},{"index":11,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「やぁ、こんにちは。\\n　最近あまり顔を出せなくて悪いな」","ko":"「안녕.<br>　요즘 자주 못 와서 미안해」"},{"index":12,"command":"msgvoicesync","speakerJp":"ゴッホ","speakerKo":"고흐","jp":"「ううん、様子を見に来てくれただけで嬉しい……」","ko":"「아니야. 어떻게 지내는지 보러 와 준 것만으로도 기뻐……」"},{"index":13,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「テレサも調子はどうだ？」","ko":"「테레사도 잘 지내고 있어?」"},{"index":14,"command":"msgvoicesync","speakerJp":"テレサ","speakerKo":"테레사","jp":"「はい、おかげさまで元気です。\\n　まだ仕事ができる状態ではないんですけど……」","ko":"「네, 덕분에 잘 지내고 있어요.<br>　아직 일을 할 수 있는 처지는 아니지만요……」"},{"index":15,"command":"message","speakerJp":"","speakerKo":"","jp":"犯罪組織に与し、一度死の芸術と化してしまった彼女の事情は複雑だ。","ko":"범죄 조직에 가담했다가 한때 죽음의 예술로 변했던 그녀의 사정은 복잡하다."},{"index":16,"command":"message","speakerJp":"","speakerKo":"","jp":"他の芸術犯罪者と異なり、普通の牢屋に収容は不可能。\\nよって、藝術家やイマージュが常に見張ることを条件に、\\n超法規的措置として仮釈放されている。","ko":"다른 예술 범죄자와 달리, 평범한 감옥에는 가둘 수 없다.<br>그래서 예술가나 이마쥬가 늘 감시한다는 조건으로<br>초법적 조치에 따라 가석방된 상태다."},{"index":17,"command":"message","speakerJp":"","speakerKo":"","jp":"とはいえ、世間の風当たりは強い。\\nゴッホや美術館の後ろ盾があるとしても、\\n普通に暮らすことはまだまだ難しい状況だ。","ko":"그렇다고 해도 세상의 시선은 싸늘하다.<br>고흐와 미술관이 뒷받침해 준다 해도<br>평범하게 살아가기에는 아직 어려움이 많다."},{"index":18,"command":"msgvoicesync","speakerJp":"エリオント","speakerKo":"엘리온트","jp":"「大丈夫！\\n　テレサちゃんには私もついてるもん！\\n　きっと街の人達もわかってくれるよ！」","ko":"「괜찮아!<br>　테레사 쨩한테는 나도 있잖아!<br>　분명 도시 사람들도 알아줄 거야!」"},{"index":19,"command":"message","speakerJp":"","speakerKo":"","jp":"重くなった空気に、エリオントが明るく声を上げてテレサに抱きつく。\\nギャラリーの末っ子として、姉を励まそうとする笑顔は眩しいくらいだ。","ko":"분위기가 무거워지자, 엘리온트가 밝게 외치며 테레사를 껴안았다.<br>갤러리의 막내로서 언니를 격려하려는 그 미소는 눈부실 정도였다."},{"index":20,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「エリオントだけじゃない。\\n　俺も美術館の仲間たちも、みんな君たちの味方だ。\\n　なにかあったら、すぐに相談に来るといい」","ko":"「엘리온트만 있는 게 아니야.<br>　나도 미술관 동료들도 모두 너희 편이야.<br>　무슨 일이 생기면 바로 와서 얘기해」"},{"index":21,"command":"msgvoicesync","speakerJp":"テレサ","speakerKo":"테레사","jp":"「ありがとうございます。\\n　私なりにがんばってみますね」","ko":"「감사합니다.<br>　저 나름대로 힘내 볼게요」"},{"index":22,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「あぁ、溜め込まない程度に。\\n　もちろん、ゴッホたちもだ。\\n　俺が忙しいからって、気を遣わなくていい」","ko":"「그래. 혼자 걱정을 너무 쌓아 두지는 말고.<br>　물론 고흐 너희도 마찬가지야.<br>　내가 바쁘다고 눈치 보지 않아도 돼」"},{"index":23,"command":"msgvoicesync","speakerJp":"ゴッホ","speakerKo":"고흐","jp":"「うん……ありがとう、館長。\\n　なにかあったらすぐに知らせるね」","ko":"「응…… 고마워, 관장.<br>　무슨 일이 생기면 바로 알릴게」"},{"index":24,"command":"msgvoicesync","speakerJp":"ネイト","speakerKo":"네이트","jp":"「わたしも、注意しておきますね」","ko":"「저도 잘 살펴볼게요」"},{"index":25,"command":"msgvoicesync","speakerJp":"テレサ","speakerKo":"테레사","jp":"「……それにしても、お姉ちゃんは幸せ者だなぁ。\\n　こんなに優しい館長さんがいる、美術館に所属できて」","ko":"「……그나저나 언니는 참 복도 많아.<br>　이렇게 다정한 관장님이 계신 미술관에 소속될 수 있어서」"},{"index":26,"command":"msgvoicesync","speakerJp":"ゴッホ","speakerKo":"고흐","jp":"「うん、本当に」","ko":"「응, 정말 그래」"},{"index":27,"command":"message","speakerJp":"","speakerKo":"","jp":"微笑み合う姉妹を見て、本当にわだかまりが解けたのだと安心する。\\nゴッホも以前とは違い、心身共に大きく成長した。\\n俺が必要以上に心配することもないだろう。","ko":"서로 미소 짓는 자매를 보니, 응어리가 정말 풀린 것 같아 안심이 됐다.<br>고흐도 예전과 달리 몸과 마음이 크게 성장했다.<br>내가 지나치게 걱정할 필요는 없을 것이다."},{"index":28,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「さて、俺はそろそろお暇……」","ko":"「그럼, 난 슬슬 가 봐야……」"},{"index":29,"command":"message","speakerJp":"","speakerKo":"","jp":"そろそろ出ようかと口を開くと、エリオントが腕を引く。","ko":"슬슬 나가 볼까 싶어 입을 열자, 엘리온트가 내 팔을 잡아당겼다."},{"index":30,"command":"msgvoicesync","speakerJp":"エリオント","speakerKo":"엘리온트","jp":"「え、館長はまだここにいるよね？」","ko":"「어? 관장, 아직 여기 있을 거지?」"},{"index":31,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「ん？」","ko":"「응?」"},{"index":32,"command":"msgvoicesync","speakerJp":"エリオント","speakerKo":"엘리온트","jp":"「だって、今日はお休みだって聞いたよ？」","ko":"「오늘은 쉬는 날이라고 들었는데?」"},{"index":33,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「まぁ、確かに休みではあるが……」","ko":"「뭐, 쉬는 날이기는 한데……」"},{"index":34,"command":"msgvoicesync","speakerJp":"エリオント","speakerKo":"엘리온트","jp":"「なら、今日はずっとここにいようよ。\\n　ね？」","ko":"「그럼 오늘은 계속 여기 있자.<br>　응?」"},{"index":35,"command":"msgvoicesync","speakerJp":"ネイト","speakerKo":"네이트","jp":"「エリオントさん……館長を困らせたらだめですよ」","ko":"「엘리온트 씨…… 관장님을 곤란하게 하시면 안 돼요」"},{"index":36,"command":"msgvoicesync","speakerJp":"ゴッホ","speakerKo":"고흐","jp":"「わたしも、もう少しここにいてほしいかな」","ko":"「나도 조금만 더 여기 있어 줬으면 좋겠어」"},{"index":37,"command":"msgvoicesync","speakerJp":"テレサ","speakerKo":"테레사","jp":"「お、お姉ちゃん？」","ko":"「어, 언니?」"},{"index":38,"command":"msgvoicesync","speakerJp":"ゴッホ","speakerKo":"고흐","jp":"「それとも館長、他の子に会う予定があったりする？」","ko":"「아니면 관장, 다른 애를 만날 약속이라도 있어?」"},{"index":39,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「いや、今のところないが……」","ko":"「아니, 지금은 없는데……」"},{"index":40,"command":"message","speakerJp":"","speakerKo":"","jp":"久々に会ったせいだろうか。\\nゴッホやエリオントの圧が強い。","ko":"오랜만에 만나서 그런 걸까.<br>고흐와 엘리온트의 기세가 만만치 않았다."},{"index":41,"command":"msgvoicesync","speakerJp":"エリオント","speakerKo":"엘리온트","jp":"「ならいいよね！」","ko":"「그럼 괜찮지!」"},{"index":42,"command":"message","speakerJp":"","speakerKo":"","jp":"強引に押し切られるように滞在が延長されてしまう。\\nテレサやネイトが申し訳なさそうに頭を下げてきて、苦笑してしまった。","ko":"그 기세에 떠밀리듯, 머무는 시간이 늘어나 버렸다.<br>테레사와 네이트가 미안한 듯 고개를 숙여 와서 나도 쓴웃음을 지었다."},{"index":43,"command":"message","speakerJp":"","speakerKo":"","jp":"館長がギャラリーにいる頃、アルテとサンソヴィーノは――","ko":"관장이 갤러리에 있는 동안, 아르테와 산소비노는――"},{"index":44,"command":"msgvoicesync","speakerJp":"アルテ","speakerKo":"아르테","jp":"「おぉ〜！」","ko":"「오오~!」"},{"index":45,"command":"msgvoicesync","speakerJp":"サンソヴィーノ","speakerKo":"산소비노","jp":"「わぁ……！」","ko":"「와……!」"},{"index":46,"command":"message","speakerJp":"","speakerKo":"","jp":"美しいビーチを前に、目を輝かせていた。","ko":"아름다운 해변을 앞에 두고 눈을 반짝이고 있었다."},{"index":47,"command":"msgvoicesync","speakerJp":"サンソヴィーノ","speakerKo":"산소비노","jp":"「とっても綺麗ですね！\\n　お天気にも恵まれて、本当に良かったです！」","ko":"「정말 아름답네요!<br>　날씨까지 좋아서 정말 다행이에요!」"},{"index":48,"command":"msgvoicesync","speakerJp":"アルテ","speakerKo":"아르테","jp":"「優雅なバカンスにぴったりですね！」","ko":"「우아한 휴양 여행에 딱이네요!」"},{"index":49,"command":"msgvoicesync","speakerJp":"サンソヴィーノ","speakerKo":"산소비노","jp":"「本当に。\\n　館長様がご一緒できなかったのは残念ですけど……」","ko":"「정말 그러네요.<br>　관장님께서 함께하지 못하신 건 아쉽지만요……」"},{"index":50,"command":"msgvoicesync","speakerJp":"サンソヴィーノ","speakerKo":"산소비노","jp":"「それにしても館長様、おひとりで大丈夫でしょうか。\\n　今ごろ、なにをなさっているのでしょう」","ko":"「그나저나 관장님은 혼자 계셔도 괜찮으실까요?<br>　지금쯤 뭘 하고 계실지 궁금하네요」"},{"index":51,"command":"msgvoicesync","speakerJp":"サンソヴィーノ","speakerKo":"산소비노","jp":"「私が管理しているものも多いですし、\\n　もしかしたら不便があるかもしれません」","ko":"「제가 관리하는 것도 많아서<br>　혹시 불편한 점이 있을지도 몰라요」"},{"index":52,"command":"msgvoicesync","speakerJp":"アルテ","speakerKo":"아르테","jp":"「心配しすぎですよ。\\n　いい大人なんですから、自分のことくらい自分でできるでしょう。\\n　それに、世話好きなイマージュたちも残ってましたし」","k Ko":"산소비노","jp":"「うふふ。\\n　先ほどは私に心配しすぎとおっしゃっていたのに、\\n　やっぱりアルテさんも館長様のことが気になるんですね」","ko":"「후후.<br>　아까는 저한테 너무 걱정한다고 하셨으면서<br>　역시 아르테 씨도 관장님이 신경 쓰이시는군요」"},{"index":106,"command":"msgvoicesync","speakerJp":"アルテ","speakerKo":"아르테","jp":"「そ、そういう訳じゃありませんよ。\\n　ただなんとなくそう思っただけです！」","ko":"「그, 그런 게 아니에요.<br>　그냥 문득 그런 생각이 들었을 뿐이라고요!」"}]},{"id":"10011203","titleKo":"도시를 거닐며","titleJp":"街を巡って","rows":[{"index":0,"command":"title","speakerJp":"","speakerKo":"","jp":"街を巡って","ko":"도시를 거닐며"},{"index":1,"command":"message","speakerJp":"","speakerKo":"","jp":"ゴッホとエリオントの引き止めをなだめすかし、\\nギャラリーを出ることができた頃には昼時をとうに過ぎていた。","ko":"고흐와 엘리온트를 달래 가며 만류를 뿌리치고<br>갤러리를 나왔을 때는 점심때가 한참 지난 뒤였다."},{"index":2,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「せっかくだし、昼食は贅沢してみるか」","ko":"「모처럼이니 점심은 좀 호사스럽게 먹어 볼까.」"},{"index":3,"command":"message","speakerJp":"","speakerKo":"","jp":"自分へのご褒美も、たまには良いだろう。\\nそう思い、手頃な店を探して街を歩いていると人だかりを見つける。","ko":"가끔은 나 자신에게 보상을 줘도 괜찮겠지.<br>그런 생각으로 적당한 식당을 찾아 거리를 걷다가 사람들이 모여 있는 곳을 발견했다."},{"index":4,"command":"message","speakerJp":"","speakerKo":"","jp":"その人だかりから聞こえる黄色い声援に、\\n誰がいるのかすぐに察しがついた。","ko":"그 사이에서 들려오는 열띤 환호만으로도<br>누가 있는지 금방 짐작할 수 있었다."},{"index":5,"command":"msgvoicesync","speakerJp":"ラファエロ","speakerKo":"라파엘로","jp":"「ここはもう大丈夫みたいだね。\\n　何か困ったことがあれば遠慮なく声をかけてくれ」","ko":"「여기는 이제 괜찮은 것 같네.<br>　곤란한 일이 있으면 언제든 부담 없이 불러 줘.」"},{"index":6,"command":"message","speakerJp":"ファンの女","speakerKo":"여성 팬","jp":"「ありがとうございます。\\n　本当に助かりました！」","ko":"「감사합니다.<br>　정말 큰 도움이 됐어요!」"},{"index":7,"command":"msgvoicesync","speakerJp":"ラファエロ","speakerKo":"라파엘로","jp":"「ふっ、天才藝術家として当然のことをしたまでさ」","ko":"「훗, 천재 예술가로서 당연한 일을 했을 뿐이야.」"},{"index":8,"command":"message","speakerJp":"ファンの男","speakerKo":"남성 팬","jp":"「ラファエロ様は本当に藝術家の鑑だ！」","ko":"「라파엘로 님은 정말 예술가의 귀감이야!」"},{"index":9,"command":"message","speakerJp":"ファンの女","speakerKo":"여성 팬","jp":"「今度、美術館にラファエロ様の作品を拝みに行きます！」","ko":"「다음에는 미술관에 라파엘로 님의 작품을 보러 갈게요!」"},{"index":10,"command":"msgvoicesync","speakerJp":"ラファエロ","speakerKo":"라파엘로","jp":"「ありがとう。\\n　美術館で待っているよ 　도시 상황도 이렇잖아.」"},{"index":23,"command":"message","speakerJp":"","speakerKo":"","jp":"戦いの余波で、多くの建物が大なり小なり被害を受けていた。\\nその後片付けや復興も、人手が足りない状況が続いている。\\nラファエロのファンの中に被害者がいても不思議ではない。","ko":"싸움의 여파로 수많은 건물이 크고 작은 피해를 입었다.<br>뒷정리와 복구 작업에도 계속 일손이 부족한 상황이다.<br>라파엘로의 팬 중에 피해자가 있어도 이상할 것은 없었다."},{"index":24,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「そうだったのか。\\n　俺にできることはあるか？」","ko":"「그랬구나.<br>　내가 도울 일은 없어?」"},{"index":25,"command":"msgvoicesync","speakerJp":"ラファエロ","speakerKo":"라파엘로","jp":"「いや、頼まれた分はもう終わったから大丈夫だよ。\\n　それに、館長は休みを満喫したほうがいい」","ko":"「아니, 부탁받은 일은 다 끝냈으니 괜찮아.<br>　관장은 쉬는 날을 마음껏 즐기는 게 좋겠어.」"},{"index":26,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「休んだほうが良いのはラファエロもだろう。\\n　……あぁ、もし良かったらランチでも一緒にどうだ？\\n　まだ食べていなくてな」","ko":"「쉬어야 하는 건 너도 마찬가지잖아.<br>　……아, 괜찮으면 같이 점심이나 먹을래?<br>　난 아직 못 먹었거든.」"},{"index":27,"command":"msgvoicesync","speakerJp":"ラファエロ","speakerKo":"라파엘로","jp":"「そういうことだったら喜んで。\\n　なら、エグゾティに行かないかい？\\n　セキエンから、いい東方料理の店を教えてもらったんだ」","ko":"「그런 거라면 기꺼이.<br>　그럼 에그조티로 가지 않을래?<br>　세키엔한테 괜찮은 동방 요릿집을 소개받았어.」"},{"index":28,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「いいじゃないか！\\n　せっかくだし、奢らせてくれ」","ko":"「좋지!<br>　모처럼이니 내가 살게.」"},{"index":29,"command":"msgvoicesync","speakerJp":"ラファエロ","speakerKo":"라파엘로","jp":"「ではお言葉に甘えて、デートと洒落込もう」","ko":"「그럼 호의를 받아들여서, 근사하게 데이트나 해 볼까.」"},{"index":30,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「デートって……。\\n　ラファエロのファンに刺されないことを祈るよ……」","ko":"「데이트라니…….<br>　네 팬한테 칼 맞는 일은 없길 빌어야겠네……」"},{"index":31,"command":"msgvoicesync","speakerJp":"ラファエロ","speakerKo":"라파엘로","jp":"「ごちそうさま、館長」","ko":"「잘 먹었어, 관장.」"},{"index":32,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「どういたしまして。\\n　俺もいい店を紹介してもらえて助かったよ」","ko":"「별말을 다 하네.<br>　나도 좋은 식당을 소개받아서 좋았어.」"},{"index":33,"command":"message","speakerJp":"","speakerKo":"","jp":"セキエンおすすめの店だけあって、かなり良質な料理の数々だった。\\nラファエロも満足だったようで、ごきげんな様子だ。","ko":"세키엔이 추천한 식당답게 요리 하나하나가 훌륭했다.<br>라파엘로도 만족한 듯 기분이 좋아 보였다."},{"index":34,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「ところで、ラファエロはこの後どうするんだ？」","ko":"「그런데 라파엘로, 이제 뭐 할 거야?」"},{"index":35,"command":"msgvoicesync","speakerJp":"ラファエロ","speakerKo":"라파엘로","jp":"「特に予定はないけど、館長さえ良ければ一緒にいてもいいかな？」","ko":"「딱히 계획은 없는데, 관장만 괜찮다면 같이 있어도 될까?」"},{"index":36,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「構わないが、本当にあてもなく散歩をするだけだぞ？」","ko":"「상관없지만, 정말 정처 없이 산책이나 할 생각인데?」"},{"index":37,"command":"msgvoicesync","speakerJp":"ラファエロ","speakerKo":"라파엘로","jp":"「それがいいんだよ。\\n　ぼくもたまにはのんびり散歩したいんだ」","ko":"「그게 좋아.<br>　나도 가끔은 느긋하게 산책하고 싶거든.」"},{"index":38,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「そうか、じゃあ行くか」","ko":"「그래? 그럼 가자.」"},{"index":39,"command":"msgvoicesync","speakerJp":"不審な男","speakerKo":"수상한 남자","jp":"「すまないっ！」","ko":"「미안합니다!」"},{"index":40,"command":"msgvoicesync","speakerJp":"ラファエロ","speakerKo":"라파엘로","jp":"「いたっ！？」","ko":"「아야!?」"},{"index":41,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「大丈夫か！？」","ko":"「괜찮아!?」"},{"index":42,"command":"msgvoicesync","speakerJp":"ラファエロ","speakerKo":"라파엘로","jp":"「う、うん……。\\n　大きな荷物を抱えて、ずいぶん急いでいたみたいだね……」","ko":"「으, 응…….<br>　커다란 짐을 안고 꽤 서두르고 있었던 것 같네……」"},{"index":43,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「あの人……さっきプランタンにもいたな」","ko":"「저 사람…… 아까 프랭탕에도 있었는데.」"},{"index":44,"command":"msgvoicesync","speakerJp":"ラファエロ","speakerKo":"라파엘로","jp":"「館長の知り合い……じゃなさそうだね」","ko":"「관장 아는 사람……은 아닌 것 같네.」"},{"index":45,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「あぁ、さっきも今みたいにぶつかって来たんだ……。\\n　具合が悪そうだから心配していたんだが……」","ko":"「그래. 아까도 지금처럼 내게 부딪혔어…….<br>　안색이 안 좋아 보여서 걱정하고 있었는데……」"},{"index":46,"command":"msgvoicesync","speakerJp":"ラファエロ","speakerKo":"라파엘로","jp":"「……嫌な予感がする」","ko":"「……안 좋은 예감이 들어.」"},{"index":47,"command":"msgvoicesync","speakerJp":"ラファエロ","speakerKo":"라파엘로","jp":"「あっ！」","ko":"「앗!」"},{"index":48,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「どうした？」","ko":"「왜 그래?」"},{"index":49,"command":"msgvoicesync","speakerJp":"ラファエロ","speakerKo":"라파엘로","jp":"「絵の具がついている……！」","ko":"「물감이 묻었어……!」"},{"index":50,"command":"message","speakerJp":"","speakerKo":"","jp":"彼女の服の肩に、かすかだが青いものが付着している。\\n確かに、これは絵の具のようだ。","ko":"그녀의 옷 어깨 부분에 희미하게 파란 것이 묻어 있었다.<br>확실히 물감인 것 같다."},{"index":51,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「さっきの人、画家だったのか？\\n　そういえば、あの荷物の形……」","ko":"「아까 그 사람, 화가였나?<br>　그러고 보니 짐 모양이……」"},{"index":52,"command":"msgvoicesync","speakerJp":"ラファエロ","speakerKo":"라파엘로","jp":"「絵の具なら服じゃなくて、キャンバスにつけてくれればいいのに……」","ko":"「물감이라면 옷이 아니라 캔버스에 묻혀 주면 좋겠는데……」"},{"index":53,"command":"message","speakerJp":"","speakerKo":"","jp":"本当にかすかとはいえ、これでは落とすのが大変だろう。\\n目に見えてテンションが下がったラファエロを慰めていると――","ko":"아주 조금 묻었어도 이걸 지우기는 쉽지 않을 것이다.<br>눈에 띄게 기운이 빠진 라파엘로를 위로하고 있는데――"},{"index":54,"command":"message","speakerJp":"住民女性","speakerKo":"여성 주민","jp":"「キャ――――！」","ko":"「꺄――――!」"},{"index":55,"command":"message","speakerJp":"","speakerKo":"","jp":"甲高い女性の悲鳴が響き渡った。\\nその悲鳴が伝播するように、周囲がざわめき始める。","ko":"날카로운 여성의 비명이 울려 퍼졌다.<br>비명이 번져 나가듯 주위가 술렁이기 시작했다."},{"index":56,"command":"message","speakerJp":"住民男性","speakerKo":"남성 주민","jp":"「し、死体だ！\\n　だれか警吏を呼んでくれ！」","ko":"「시, 시체다!<br>　누가 경찰 좀 불러 줘!」"},{"index":57,"command":"msgvoicesync","speakerJp":"ラファエロ","speakerKo":"라파엘로","jp":"「……！\\n　館長！」","ko":"「……!<br>　관장!」"},{"index":58,"command":"message","speakerJp":"","speakerKo":"","jp":"俺達はすぐに声の方向へと駆け出していた。","ko":"우리는 곧바로 소리가 난 쪽으로 달려갔다."},{"index":59,"command":"message","speakerJp":"","speakerKo":"","jp":"広場にはすでに人だかりができていた。\\n市警はまだ到着していないようで、パニックになっている住民もいる。","ko":"광장에는 이미 사람들이 모여 있었다.<br>시경은 아직 도착하지 않은 모양이고, 당황해서 어쩔 줄 모르는 주민들도 있었다."},{"index":60,"command":"msgvoicesync","speakerJp":"セキエン","speakerKo":"세키엔","jp":"「みんな落ち着いてくれ！\\n　遺体には触れないように！」","ko":"「다들 진정해!<br>　시신에는 손대지 말고!」"},{"index":61,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「あまり近付かないで！\\n　死の芸術が絡んでるかもだから！」","ko":"「너무 가까이 가지 마!<br>　죽음의 예술이 얽혀 있을지도 모르니까!」"},{"index":62,"command":"message","speakerJp":"","speakerKo":"","jp":"人混みの中心から、聞き覚えのある声がふたり分。\\nラファエロと人混みをかき分けて行くと、予想通りの人物がいた。","ko":"사람들 한가운데서 익숙한 두 사람의 목소리가 들려왔다.<br>라파엘로와 함께 인파를 헤치고 들어가자 예상한 사람들이 있었다."},{"index":63,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「セキエン！\\n　セッシュウ！」","ko":"「세키엔!<br>　셋슈!」"},{"index":64,"command":"msgvoicesync","speakerJp":"セキエン","speakerKo":"세키엔","jp":"「館長！\\n　ラファエロも！」","ko":"「관장!<br>　라파엘로도 왔구나!」"},{"index":65,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「館長さん！\\n　ちょうど良かった！\\n　呼びに行こうと思ってたんよ〜！」","ko":"「관장님!<br>　마침 잘 왔어!<br>　부르러 가려던 참이었는데~!」"},{"index":66,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「近くにいてよかった。\\n　それで、遺体っていうのは……？」","ko":"「근처에 있어서 다행이네.<br>　그래서, 시신이라는 건……?」"},{"index":67,"command":"message","speakerJp":"","speakerKo":"","jp":"問うと、セキエンとセッシュウが視線を向ける。","ko":"그렇게 묻자 세키엔과 셋슈가 시선을 돌렸다."},{"index":68,"command":"message","speakerJp":"","speakerKo":"","jp":"人だかりの中心には、男性が仰向けで横たわっていた。\\n服は血濡れで汚れており、胸には深々とナイフが突き刺さっている。\\nまぎれもない、刺殺死体だった。","ko":"사람들 한가운데에 한 남성이 얼굴을 위로 한 채 누워 있었다.<br>옷은 피로 더럽혀져 있었고, 가슴에는 칼이 깊숙이 꽂혀 있었다.<br>칼에 찔려 죽은 시신이 분명했다."}]},{"id":"10011204","titleKo":"파랗게 칠한 장미","titleJp":"青塗りのバラ","rows":[{"index":0,"command":"title","speakerJp":"","speakerKo":"","jp":"青塗りのバラ","ko":"파랗게 칠한 장미"},{"index":1,"command":"message","speakerJp":"","speakerKo":"","jp":"市警が到着してすぐ、野次馬を遠ざけて現場検証が始まった。","ko":"시경이 도착하자마자 구경꾼들을 멀리 물리고 현장 검증을 시작했다."},{"index":2,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「突然死体が落ちてきた……？」","ko":"「갑자기 시체가 떨어졌다고……?」"},{"index":3,"command":"message","speakerJp":"","speakerKo":"","jp":"そう証言したのは、最初に悲鳴を上げた女性だ。\\n今日広場では催し物があり、多くの人で賑わっている状態だった。","ko":"그렇게 증언한 사람은 처음 비명을 지른 여성이었다.<br>오늘 광장에는 행사가 열려 많은 사람들로 북적이고 있었다."},{"index":4,"command":"message","speakerJp":"","speakerKo":"","jp":"買い物中の女性が休憩をしていたら、\\n突然目の前に男性が落ちてきたのだという。","ko":"쇼핑하던 여성이 잠시 쉬고 있는데<br>갑자기 눈앞으로 남성이 떨어졌다고 한다."},{"index":5,"command":"message","speakerJp":"","speakerKo":"","jp":"男性の遺体は家屋の屋根に遺棄されていたようで、\\n時間経過で少しずつずり落ちて、落下したと見られている。","ko":"남성의 시신은 건물 지붕에 버려져 있었던 듯하다.<br>시간이 지나면서 조금씩 미끄러지다가 떨어진 것으로 보고 있다."},{"index":6,"command":"msgvoicesync","speakerJp":"警吏","speakerKo":"경찰","jp":"「遺体の胸部には刺殺痕があり、おそらく心臓に届いていたかと」","ko":"「시신의 가슴에 칼에 찔린 상처가 있습니다. 아마 심장까지 닿았을 것으로 보입니다.」"},{"index":7,"command":"msgvoicesync","speakerJp":"セキエン","speakerKo":"세키엔","jp":"「なら、死因は高所からの転落死ではなく、刺突による失血死かな」","ko":"「그럼 높은 곳에서 떨어져 죽은 게 아니라, 찔린 상처로 인한 과다 출혈이 사인일까?」"},{"index":8,"command":"msgvoicesync","speakerJp":"警吏","speakerKo":"경찰","jp":"「署に遺体を運び検死を行うまでは断定できませんが、\\n　現状そう見ていただいてもよろしいかと」","ko":"「시신을 경찰서로 옮겨 검시하기 전에는 단정할 수 없습니다만,<br>　현재로서는 그렇게 보셔도 될 것 같습니다.」"},{"index":9,"command":"msgvoicesync","speakerJp":"警吏","speakerKo":"경찰","jp":"「遺体の状態を見ると、\\n　少なくとも死後半日は経過しているのは間違いありません」","ko":"「시신의 상태로 봐서<br>　죽은 지 적어도 반나절은 지난 게 확실합니다.」"},{"index":10,"command":"msgvoicesync","speakerJp":"ラファエロ","speakerKo":"라파엘로","jp":"「――ってことは殺されたのは明け方より前。\\n　殺害現場はここじゃないんだろうね。\\n　別の場所から、なんらかの手段で運び込まれて、屋根に放置されたと」","ko":"「――그럼 새벽이 되기 전에 살해됐다는 거네.<br>　살해 현장은 여기가 아니겠지.<br>　다른 곳에서 어떤 수단으로 옮겨 와서 지붕에 버려 뒀다는 거야.」"},{"index":11,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「だが、この出血量だ。\\n　誰かが運んだにせよ、生きている間に自分で歩いたにせよ、\\n　血痕が残っていないのはおかしい」","ko":"「하지만 이 정도로 피가 나왔잖아.<br>　누가 옮겼든, 살아 있을 때 직접 걸어왔든,<br>　핏자국이 하나도 안 남아 있는 건 이상해.」"},{"index":12,"command":"msgvoicesync","speakerJp":"セキエン","speakerKo":"세키엔","jp":"「屋根の上とはいえ、\\n　長時間遺体があって誰も気付かなかったのも妙な話だ」","ko":"「지붕 위라고 해도<br>　시신이 오랫동안 있었는데 아무도 눈치채지 못했다는 것도 이상하지.」"},{"index":13,"command":"message","speakerJp":"","speakerKo":"","jp":"セキエンたちと市警立ち会いのもと、\\nすぐに家屋の内部や屋根を確認したが、凶器や不審な痕跡はなかった。\\n成人男性の遺体を、誰にも見つからずに白昼堂々と運べるだろうか……？","ko":"세키엔 일행과 시경이 입회한 가운데<br>곧바로 건물 내부와 지붕을 확인했지만, 흉기나 수상한 흔적은 없었다.<br>성인 남성의 시신을 대낮에 아무에게도 들키지 않고 옮길 수 있을까……?"},{"index":14,"command":"message","speakerJp":"","speakerKo":"","jp":"よしんば夜の内に運んだとしても、\\n落ちるまで誰も気付かないことはあり得るのか？","ko":"설령 밤중에 옮겼다고 해도<br>떨어질 때까지 아무도 눈치채지 못하는 게 가능한가?"},{"index":15,"command":"msgvoicesync","speakerJp":"セキエン","speakerKo":"세키엔","jp":"「人が人を殺して運んだという、簡単な話じゃないだろうね」","ko":"「사람이 사람을 죽이고 옮겼다는 단순한 이야기는 아닐 것 같네.」"},{"index":16,"command":"msgvoicesync","speakerJp":"警吏","speakerKo":"경찰","jp":"「もしや、死の芸術が関与しているってことですか？」","ko":"「혹시 죽음의 예술이 관여했다는 말씀이십니까?」"},{"index":17,"command":"msgvoicesync","speakerJp":"セキエン","speakerKo":"세키엔","jp":"「いいや！\\n　妖怪の可能性もある――」","ko":"「아니!<br>　요괴일 가능성도 있어――」"},{"index":18,"command":"msgvoicesync","speakerJp":"セキエン","speakerKo":"세키엔","jp":"「――と言いたいところだけど、\\n　死の芸術の力と考える方が自然だね」","ko":"「――라고 말하고 싶지만,<br>　죽음의 예술의 힘이라고 생각하는 편이 자연스럽겠네.」"},{"index":19,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「本気で妖怪だと言い出したら、怒ろうと思ってた」","ko":"「진짜 요괴라고 우겼으면 화내려고 했어.」"},{"index":20,"command":"msgvoicesync","speakerJp":"セキエン","speakerKo":"세키엔","jp":"「ふふ、すまないね。\\n　今回ばかりは、妖怪と断定して動いたりはしないよ」","ko":"「후후, 미안하네.<br>　이번만큼은 요괴라고 단정하고 행동하진 않을게.」"},{"index":21,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「妖怪の可能性も考えてるってこと！？」","ko":"「요괴일 가능성도 생각하고 있긴 하다는 거야!?」"},{"index":22,"command":"message","speakerJp":"","speakerKo":"","jp":"今のは、セッシュウへの気遣いだろう。\\n初めて遺体を見たせいでずっと黙り込んでいた彼女は、\\n少しばかり肩の力を抜いたように思える。","ko":"방금 말은 셋슈를 배려해서 한 농담일 것이다.<br>처음 시신을 본 탓에 내내 말이 없던 그녀가<br>조금은 긴장을 푼 것 같았다."},{"index":23,"command":"message","speakerJp":"","speakerKo":"","jp":"ラファエロもそれがわかっているのか、\\n不謹慎だと咎めることはしなかった。","ko":"라파엘로도 그걸 알고 있는지<br>경솔한 말이라며 나무라지는 않았다."},{"index":24,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「遺体を運ぶ際に、死の芸術が関与している可能性もある……か。\\n　ちなみに、セキエンとセッシュウも近くにいたんだよな？」","ko":"「시신을 옮기는 데 죽음의 예술이 관여했을 가능성도 있다……라.<br>　그러고 보니 세키엔이랑 셋슈도 근처에 있었던 거지?」"},{"index":25,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「うん。\\n　祭りだからセキエンと屋台巡りをしてて。\\n　悲鳴が聞こえたから振り返ったら、こうなってたんよ……」","ko":"「응.<br>　축제라서 세키엔이랑 노점들을 구경하고 있었어.<br>　비명이 들려서 돌아봤더니 이렇게 돼 있었고……」"},{"index":26,"command":"msgvoicesync","speakerJp":"セキエン","speakerKo":"세키엔","jp":"「少なくとも、現場から逃走する犯人は見ていないよ。\\n　もちろん、死の芸術の気配も感じなかった」","ko":"「적어도 현장에서 도망치는 범인은 못 봤어.<br>　물론 죽음의 예술의 기척도 느끼지 못했고.」"},{"index":27,"command":"msgvoicesync","speakerJp":"ラファエロ","speakerKo":"라파엘로","jp":"「ちなみにだけど、遺体の身元は……？」","ko":"「그런데 시신의 신원은……?」"},{"index":28,"command":"msgvoicesync","speakerJp":"警吏","speakerKo":"경찰","jp":"「それがなにも……。\\n　財布すら持っておらず……。\\n　ですが、唯一ポケットにこれが……」","ko":"「그게, 아무것도 없습니다…….<br>　지갑조차 없고…….<br>　다만 주머니에서 이것 하나가……」"},{"index":29,"command":"message","speakerJp":"","speakerKo":"","jp":"警吏が差し出したのは、独特な青色をした一輪の花だ。","ko":"경찰이 내민 것은 독특한 푸른빛을 띤 꽃 한 송이였다."},{"index":30,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「これは……青い、バラか……？」","ko":"「이건…… 파란 장미인가……?」"},{"index":31,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「これ、元々は白いバラだと思うんよね。\\n　絵の具で青く塗ってるだけ。\\n　ほら、ここに塗りムラがある。しかも乾ききってないし」","ko":"「이거, 원래는 흰 장미였을 것 같아.<br>　물감으로 파랗게 칠한 것뿐이야.<br>　봐, 여기는 색이 고르게 안 칠해졌잖아. 게다가 아직 다 마르지도 않았고.」"},{"index":32,"command":"msgvoicesync","speakerJp":"ラファエロ","speakerKo":"라파엘로","jp":"「本当だ。しかしなんでわざわざこんなものを……？\\n　しかも乾ききってないなら、\\n　犯人も実は近くにいたってことにならないかな」","ko":"「정말이네. 그런데 왜 굳이 이런 걸……?<br>　게다가 아직 다 안 말랐다면<br>　범인도 사실 근처에 있었을 수 있지 않을까?」"},{"index":33,"command":"msgvoicesync","speakerJp":"セキエン","speakerKo":"세키엔","jp":"「油絵の具は乾くまで時間がかかるからどうだろう。\\n　しかし……見たことのない青色だね。\\n　海の青や空の青、宝石の青とも違う……」","ko":"「유화 물감은 마르는 데 시간이 걸리니까 어떨지 모르겠네.<br>　그런데…… 처음 보는 파란색이야.<br>　바다의 파란색이나 하늘의 파란색, 보석의 파란색과도 달라……」"},{"index":34,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「あぁ、フェルメールが使う青とも違う」","ko":"「그래. 페르메르가 쓰는 파란색과도 달라.」"},{"index":35,"command":"msgvoicesync","speakerJp":"ラファエロ","speakerKo":"라파엘로","jp":"「うーん……こんなに特徴的な青い絵の具、\\n　話題になっていそうなものだけど」","ko":"「으음…… 이렇게 특징적인 파란 물감이라면<br>　소문이 났을 법도 한데.」"},{"index":36,"command":"message","speakerJp":"","speakerKo":"","jp":"青い絵の具といえば、先程ラファエロとぶつかった男性が思い浮かぶ。\\nただの偶然かそれとも……。","ko":"파란 물감이라는 말에 아까 라파엘로와 부딪힌 남성이 떠올랐다.<br>그저 우연일까, 아니면……."},{"index":37,"command":"message","speakerJp":"","speakerKo":"","jp":"ラファエロも気付いているのか、目配せをしてきた。\\n頷きをひとつ返しておくだけにとどめたのは、\\n話の腰を折らないように配慮してのことだ。","ko":"라파엘로도 떠올린 건지 내게 눈짓을 보냈다.<br>고개만 한 번 끄덕인 것은<br>이야기의 흐름을 끊지 않으려는 배려였다."},{"index":38,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「死体と花といえば、似たような事件があったと聞いたんだけど……」","ko":"「시체랑 꽃이라면, 비슷한 사건이 있었다고 들었는데……」"},{"index":39,"command":"msgvoicesync","speakerJp":"セキエン","speakerKo":"세키엔","jp":"「もしかして、フラワーマンのことかい？」","ko":"「혹시 플라워맨 말이야?」"},{"index":40,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「それ……その人……えっと、２代目？\\n　まだ捕まってないなら、その人ってことは？」","ko":"「그…… 그 사람…… 그러니까, 2대째?<br>　아직 안 잡혔다면 그 사람일 가능성은 없어?」"},{"index":41,"command":"msgvoicesync","speakerJp":"セキエン","speakerKo":"세키엔","jp":"「その可能性は低いと思うよ、セッシュウ。\\n　彼は初代の熱烈な信者だ。この遺体とは手口が違いすぎる。\\n　こんな生易しいものじゃないよ、フラワーマンは」","ko":"「그럴 가능성은 낮다고 생각해, 셋슈.<br>　그는 초대 플라워맨의 열렬한 추종자야. 이번 사건과는 수법이 너무 달라.<br>　플라워맨의 수법은 이렇게 얌전하지 않거든.」"},{"index":42,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「そんなに酷かったんだ……」","ko":"「그렇게 끔찍했구나……」"},{"index":43,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「とはいえ、可能性は捨てきれないな。\\n　関係者や模倣犯ではないとも断定ができないし、\\n　死の芸術絡みだったら市警だけでは荷が重すぎる」","ko":"「그래도 가능성을 완전히 배제할 수는 없어.<br>　관계자나 모방범이 아니라고도 단정할 수 없고,<br>　죽음의 예술이 얽혔다면 시경만으로는 감당하기 어려워.」"},{"index":44,"command":"message","speakerJp":"","speakerKo":"","jp":"フラワーマンが起こした凄惨な事件は、皆の記憶にも新しい。\\n警吏はその名前が出ただけで、顔色を少し青くしていた。","ko":"플라워맨이 일으킨 참혹한 사건은 아직 모두의 기억에 생생했다.<br>경찰은 그 이름을 듣기만 했는데도 낯빛이 조금 창백해졌다."},{"index":45,"command":"msgvoicesync","speakerJp":"警吏","speakerKo":"경찰","jp":"「そうですね……。\\n　できれば、藝術家の皆さんの手をお借りできれば……」","ko":"「그렇습니다…….<br>　가능하다면 예술가 여러분의 도움을 받을 수 있을지……」"},{"index":46,"command":"msgvoicesync","speakerJp":"ラファエロ","speakerKo":"라파엘로","jp":"「もとよりそのつもりだよ」","ko":"「처음부터 그럴 생각이었어.」"},{"index":47,"command":"msgvoicesync","speakerJp":"セキエン","speakerKo":"세키엔","jp":"「あぁ、ぜひ手伝わせてくれ」","ko":"「그래, 꼭 돕게 해 줘.」"},{"index":48,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「う、うちもがんばる……！」","ko":"「나, 나도 힘낼게……!」"},{"index":49,"command":"message","speakerJp":"","speakerKo":"","jp":"セキエンたちの頼もしい言葉に、警吏の表情が緩んだ。","ko":"세키엔 일행의 든든한 말에 경찰의 표정이 풀렸다."},{"index":50,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"（もし、フラワーマンが絡んでいるなら……）","ko":"（만약 플라워맨이 얽혀 있다면……）"},{"index":51,"command":"message","speakerJp":"","speakerKo":"","jp":"脳裏に浮かぶのは、今は亡き友人の顔だ。\\nきっとセキエンも、同じ人物を思い浮かべているだろう。","ko":"지금은 세상에 없는 친구의 얼굴이 떠올랐다.<br>분명 세키엔도 같은 사람을 떠올리고 있을 것이다."},{"index":52,"command":"message","speakerJp":"","speakerKo":"","jp":"フラワーマンが関わっていてもそうでなくとも、\\nこれ以上の被害者が出る前に解決しなければならない。","ko":"플라워맨이 관여했든 아니든<br>더 많은 희생자가 나오기 전에 해결해야 한다."},{"index":53,"command":"msgvoicesync","speakerJp":"フラワーマン","speakerKo":"플라워맨","jp":"「ふむ……」","ko":"「흐음……」"}]},{"id":"10011205","titleKo":"파랑을 찾아서","titleJp":"青を探して","rows":[{"index":0,"command":"title","speakerJp":"","speakerKo":"","jp":"青を探して","ko":"파랑을 찾아서"},{"index":1,"command":"message","speakerJp":"","speakerKo":"","jp":"遺体の身元や、死因についての捜査は市警に任せ、\\n俺達は別の角度から調査をするため現場を離れた。","ko":"시신의 신원과 사인 조사는 시경에 맡기고,<br>우리는 다른 각도에서 조사하기 위해 현장을 떠났다."},{"index":2,"command":"msgvoicesync","speakerJp":"セキエン","speakerKo":"세키엔","jp":"「ラファエロについた、青い絵の具？」","ko":"「라파엘로에게 묻은 파란 물감이라고?」"},{"index":3,"command":"msgvoicesync","speakerJp":"ラファエロ","speakerKo":"라파엘로","jp":"「これなんだけど」","ko":"「이건데.」"},{"index":4,"command":"msgvoicesync","speakerJp":"セキエン","speakerKo":"세키엔","jp":"「本当だ……。\\n　でもうっすらとだから、さっきのバラと同じ絵の具かはわからないね」","ko":"「정말이네…….<br>　하지만 희미하게 묻어 있어서, 아까 그 장미와 같은 물감인지는 모르겠어.」"},{"index":5,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「だが、先ほどの男を捜す価値はあると思う。\\n　彼の抱えていた荷物は、布にくるまれていたが形からして絵画だ。\\n　もしかしたら、あの絵の具が使われたものかもしれない」","ko":"「그래도 아까 그 남자를 찾아볼 가치는 있다고 생각해.<br>　그가 안고 있던 짐은 천에 싸여 있었지만, 모양으로 봐서는 그림이야.<br>　어쩌면 그 물감을 쓴 그림일지도 몰라.」"},{"index":6,"command":"msgvoicesync","speakerJp":"セキエン","speakerKo":"세키엔","jp":"「確かに、青い絵の具を探して画材屋を巡るより、いいかもしれないね！\\n　……とはいえ、街は広い。\\n　いったん二手に分かれるというのはどうだい？」","ko":"「확실히 파란 물감을 찾으러 화방을 돌아다니는 것보다 나을 수도 있겠네!<br>　……그렇지만 도시는 넓잖아.<br>　일단 두 팀으로 나누는 건 어때?」"},{"index":7,"command":"msgvoicesync","speakerJp":"ラファエロ","speakerKo":"라파엘로","jp":"「なら、あの男性の顔を見たぼくと、館長が分かれるべきかな」","ko":"「그렇다면 그 남자 얼굴을 본 나와 관장이 서로 다른 팀으로 가야겠네.」"},{"index":8,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「それがいい。\\n　セッシュウ、俺と来るか？」","ko":"「그게 좋겠어.<br>　셋슈, 나랑 갈래?」"},{"index":9,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「え、うちでいいん？」","ko":"「어, 나라도 괜찮아?」"},{"index":10,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「あぁ、頼りにしてるよ」","ko":"「그래, 네가 있어 든든해.」"},{"index":11,"command":"msgvoicesync","speakerJp":"セキエン","speakerKo":"세키엔","jp":"「じゃあ、わたしはラファエロと。\\n　夕方になる前にまたここに集まる、でいいかな？」","ko":"「그럼 나는 라파엘로랑 갈게.<br>　저녁이 되기 전에 여기서 다시 모이면 되겠지?」"},{"index":12,"command":"message","speakerJp":"","speakerKo":"","jp":"セキエンの言葉に全員が頷くと、早速二手に分かれて調査に向かった。","ko":"세키엔의 말에 모두 고개를 끄덕이고, 곧바로 두 팀으로 나뉘어 조사에 나섰다."},{"index":13,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「どこから捜してみるの？」","ko":"「어디부터 찾아볼까?」"},{"index":14,"command":"message","speakerJp":"","speakerKo":"","jp":"セキエンたちはおそらく、人相書きを手に聞き込みをするだろう。\\nなら、俺達は別角度から捜す方がいいだろう。","ko":"세키엔 일행은 아마 그 남자의 얼굴 그림을 들고 탐문할 것이다.<br>그렇다면 우리는 다른 각도에서 찾는 게 좋겠지."},{"index":15,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「うーん、そうだな。\\n　闇雲に探すよりは、やはり青い絵の具について足がかりが欲しい」","ko":"「음, 그러게.<br>　무작정 찾기보다는 역시 파란 물감에 관한 실마리가 있었으면 좋겠어.」"},{"index":16,"command":"message","speakerJp":"","speakerKo":"","jp":"俺の言葉に、セッシュウは首をかしげた。","ko":"내 말에 셋슈가 고개를 갸웃했다."},{"index":17,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「でも、青い絵の具を探すのは効率が悪いんじゃ？」","ko":"「하지만 파란 물감을 찾는 건 비효율적이라며?」"},{"index":18,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「ただ、なにも考えず画材屋を回るだけならな」","ko":"「그냥 아무 생각 없이 화방만 돌아다닌다면 그렇지.」"},{"index":19,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「……！\\n　わかったかも。\\n　フェルメールさんのところに行くんでしょ？」","ko":"「……!<br>　알 것 같아.<br>　페르메르 씨한테 가려는 거지?」"},{"index":20,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「その通りだ。\\n　フェルメールは青にこだわりのある画家。\\n　彼女なら、変わった絵の具のことを知っているかもしれない」","ko":"「맞아.<br>　페르메르는 파란색에 남다른 애착이 있는 화가잖아.<br>　그녀라면 특이한 물감에 대해 알고 있을지도 몰라.」"},{"index":21,"command":"message","speakerJp":"","speakerKo":"","jp":"ヨハンナ・フェルメール。\\nアテネスでも随一の起業家でもあり、美術館に所属する藝術家だ。","ko":"요한나 페르메르.<br>아테네스에서도 손꼽히는 사업가이자, 미술관 소속 예술가다."},{"index":22,"command":"message","speakerJp":"","speakerKo":"","jp":"フィーニスの事件の折、彼女は仕事でアテネスの外にいた。\\n戦いに協力できなかったからせめてもと、\\n復興のため様々な人脈を駆使して支援を繋いでくれている。","ko":"피니스 사건 당시 그녀는 업무 때문에 아테네스 밖에 있었다.<br>싸움에 힘을 보태지 못했으니 이것만이라도 하겠다며,<br>복구를 위해 폭넓은 인맥을 동원해 각종 지원을 연결해 주고 있다."},{"index":23,"command":"message","speakerJp":"","speakerKo":"","jp":"彼女の伝手がなければ、\\n美術館もこんなに早く立て直すことはできなかっただろう。","ko":"그녀의 연줄이 없었다면<br>미술관도 이렇게 빨리 정상으로 돌아오지는 못했을 것이다."},{"index":24,"command":"message","speakerJp":"","speakerKo":"","jp":"そのくらい、彼女の持つ人脈の力は絶大だ。\\n確証までいかずとも、なにかしらの噂は耳に届いているかもしれない。","ko":"그만큼 그녀가 가진 인맥의 힘은 막강하다.<br>확실한 정보까지는 아니더라도, 무슨 소문이라도 들었을지 모른다."},{"index":25,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「しかし、奇妙だよな」","ko":"「그런데 이상하긴 하네.」"},{"index":26,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「死んだ人のこと？」","ko":"「죽은 사람 말이야?」"},{"index":27,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「正確に言うと、あのバラだな」","ko":"「정확히는 그 장미 말이야.」"},{"index":28,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「……あれ、たぶん犯人が残したものだと思う。\\n　でも、なんでそんなことをしたんだろう。\\n　あんな特殊な色の絵の具、足がつきやすそうだし」","ko":"「……그건 아마 범인이 남긴 것 같아.<br>　하지만 왜 그런 짓을 했을까?<br>　그렇게 특이한 색의 물감이면 금방 꼬리가 잡힐 것 같은데.」"},{"index":29,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「犯人として逮捕されたくはない。\\n　しかし、あえて青いバラを残す必要があったのかもしれない」","ko":"「범인으로 체포되고 싶지는 않을 거야.<br>　하지만 일부러 파란 장미를 남겨야 할 이유가 있었을지도 몰라.」"},{"index":30,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「また、市警か美術館への挑発という可能性も捨てきれない。\\n　フラワーマン関係だった場合、セキエンを挑発する意図もありそうだ」","ko":"「시경이나 미술관을 도발하려는 걸 수도 있지.<br>　플라워맨과 관련된 사건이라면 세키엔을 도발하려는 의도도 있을 것 같아.」"},{"index":31,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「か、館長さん……。\\n　そのフラワーマンのことだけど、セキエンは大丈夫なん？」","ko":"「과, 관장님…….<br>　그 플라워맨 말인데, 세키엔은 괜찮을까?」"},{"index":32,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「大丈夫、とは？」","ko":"「괜찮냐니?」"},{"index":33,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「フラワーマンの事件のことは、記録とかで知っとるよ。\\n　まだ捕まってない人だし、セキエンに直接聞いたこともあって」","ko":"「플라워맨 사건은 기록 같은 걸로 알고 있어.<br>　아직 잡히지 않은 사람이고, 세키엔한테 직접 물어본 적도 있거든.」"},{"index":34,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「でもね、セキエンはその事件を話す時、いつもと様子が違うんよ。\\n　さっきもちょっとおかしかったというか……。\\n　事件が起こる前はいつも通りだったんだけど」","ko":"「그런데 세키엔은 그 사건 얘기만 하면 평소랑 달라져.<br>　아까도 조금 이상했달까…….<br>　사건이 일어나기 전에는 평소랑 똑같았는데.」"},{"index":35,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「あぁ。\\n　確かにいつもより……こう、妖怪のことは言わないな」","ko":"「그래.<br>　확실히 평소보다…… 뭐랄까, 요괴 얘기를 덜 하네.」"},{"index":36,"command":"message","speakerJp":"","speakerKo":"","jp":"自称、妖怪探偵。\\nいつもはなにかにつけて妖怪の関係を公言する彼女が、\\n今日はすこし落ち着いているように思える。","ko":"자칭 요괴 탐정.<br>평소에는 무슨 일에든 요괴가 관련되어 있다고 말하는 그녀가<br>오늘은 조금 차분해 보인다."},{"index":37,"command":"message","speakerJp":"","speakerKo":"","jp":"思えば、セッシュウの調子を元に戻すために妖怪と言ったきりだ。\\nまぁ、妖怪大好きな彼女からして、\\n明確な殺人を妖怪の仕業と断言するのは避けたいのもあるだろう。","ko":"생각해 보니 셋슈의 기운을 되찾아 주려 할 때 요괴 얘기를 한 게 전부다.<br>뭐, 요괴를 그렇게 좋아하는 그녀로서는<br>명백한 살인을 요괴 짓이라고 단정하고 싶지 않을 수도 있겠지."},{"index":38,"command":"message","speakerJp":"","speakerKo":"","jp":"加えてフワラーマンを連想できる事件だ。\\n彼女にも思うところはあるだろう。\\nもちろん、自分もだが……。","ko":"게다가 플라워맨을 떠올리게 하는 사건이다.<br>그녀도 여러 생각이 들 것이다.<br>물론 나도 그렇지만……."},{"index":39,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「こう、なんとなく心配。\\n　うまく言えないんだけど、とにかくもやもやする」","ko":"「뭐랄까, 왠지 걱정이 돼.<br>　잘 설명은 못 하겠는데, 아무튼 마음이 답답해.」"},{"index":40,"command":"message","speakerJp":"","speakerKo":"","jp":"もやもやするのは、セキエンのことが心配なだけではないだろう。","ko":"그렇게 마음이 답답한 건 세키엔이 걱정되기 때문만은 아닐 것이다."},{"index":41,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「……セッシュウも本当はしんどいだろう？\\n　普通、遺体を見るだけでも心は擦り切れるものだ。\\n　無理せず帰ってもいいんだぞ？」","ko":"「……셋슈도 사실은 힘들지?<br>　보통은 시신을 보는 것만으로도 마음이 지치는 법이야.<br>　무리하지 말고 돌아가도 괜찮아.」"},{"index":42,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「しんどいの、否定はせんよ。\\n　でも、留学生とはいえ、うちも美術館の藝術家。\\n　みんなを支えられるならがんばりたい！」","ko":"「힘든 건 맞아.<br>　하지만 유학생이라 해도 나도 미술관의 예술가잖아.<br>　모두에게 힘이 되어 줄 수 있다면 열심히 하고 싶어!」"},{"index":43,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「それに、館長さんが無茶しないか見張っとかないと！」","ko":"「그리고 관장님이 무리하지 않는지도 지켜봐야 하고!」"},{"index":44,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「おっと、だんだんサンソヴィーノに染まってきたか？」","ko":"「이런, 점점 산소비노를 닮아 가는 거야?」"},{"index":45,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「えへへ。\\n　館長さんもセキエンも他のみんなも、うちが守るからね！」","ko":"「에헤헤.<br>　관장님도 세키엔도, 다른 사람들도 모두 내가 지켜 줄게!」"},{"index":46,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"まだ無理をしていそうだが、少し調子を取り戻して来たようだ。\\n一歩前を跳ねるように歩く姿は、出会った頃より頼もしく思えた。","ko":"아직 무리하는 것 같지만, 조금은 기운을 되찾은 듯했다.<br>한발 앞에서 통통 뛰듯 걸어가는 모습이 처음 만났을 때보다 든든하게 느껴졌다."}]},{"id":"10011206","titleKo":"찾아야 할 것은","titleJp":"探すべきものは","rows":[{"index":0,"command":"title","speakerJp":"","speakerKo":"","jp":"探すべきものは","ko":"찾아야 할 것은"},{"index":1,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「でっかいお家……」","ko":"「엄청 큰 집이네……」"},{"index":2,"command":"message","speakerJp":"","speakerKo":"","jp":"フェルメールの屋敷に着き、\\n部屋に通されたセッシュウは感嘆の声を漏らす。\\n豪奢な内装で統一された光景に圧倒され、彼女は落ち着かない様子だ。","ko":"페르메르의 저택에 도착해<br>방으로 안내받은 셋슈가 감탄을 흘렸다.<br>호화로운 장식으로 꾸며진 실내에 압도되어 어쩔 줄 몰라 하는 모습이다."},{"index":3,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「やぁ、パルル。\\n　突然すまない」","ko":"「안녕, 파루루.<br>　갑자기 찾아와서 미안해.」"},{"index":4,"command":"msgvoicesync","speakerJp":"パルル","speakerKo":"파루루","jp":"「いらっしゃいませ、館長サマ。\\n　本来事前の連絡がない方はお通ししませんが、\\n　お姉様が館長サマなら……と」","ko":"「어서 오세요, 관장님.<br>　원래 미리 연락하지 않은 분은 들여보내 드리지 않지만,<br>　언니께서 관장님이라면 괜찮다고 하셔서요……」"},{"index":5,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「す、すまない。\\n　緊急だったものでな」","ko":"「미, 미안해.<br>　급한 일이 있어서.」"},{"index":6,"command":"message","speakerJp":"","speakerKo":"","jp":"相変わらず手厳しい……。","ko":"여전히 가차 없네……."},{"index":7,"command":"msgvoicesync","speakerJp":"パルル","speakerKo":"파루루","jp":"「そちらの方は……セッシュウ様ですね？」","ko":"「옆에 계신 분은…… 셋슈 님이시죠?」"},{"index":8,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「そ、そうです……！\\n　その……フェルメールさんの、イマージュですか？」","ko":"「그, 그래요……!<br>　저기…… 페르메르 씨의 이마쥬세요?」"},{"index":9,"command":"msgvoicesync","speakerJp":"パルル","speakerKo":"파루루","jp":"「はい、ワタクシはパルルと申します。\\n　藝術家の方でしたら、ワタクシに敬語は不要です」","ko":"「네, 저는 파루루라고 합니다.<br>　예술가이시라면 제게 존댓말을 쓰실 필요는 없어요.」"},{"index":10,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「あ、ありがとう」","ko":"「아, 고마워.」"},{"index":11,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「どうした、セッシュウ。\\n　珍しく緊張しているのか？」","ko":"「왜 그래, 셋슈?<br>　웬일로 긴장한 거야?」"},{"index":12,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「あ、その……パルルさんの青がすごくきれいで、\\n　心がうずうずして……！」","ko":"「아, 그게…… 파루루 씨의 파란색이 정말 예뻐서<br>　마음이 자꾸 들썩거려……!」"},{"index":13,"command":"msgvoicesync","speakerJp":"パルル","speakerKo":"파루루","jp":"「ふふっ、審美眼がお有りの方なのですね。\\n　お姉様からいただいた至極の肉体。\\n　宿した青は、お姉様の愛そのものでございます！」","ko":"「후훗, 심미안이 있으신 분이군요.<br>　언니께서 주신 지극히 아름다운 몸.<br>　그 안에 깃든 파랑은 바로 언니의 사랑이랍니다!」"},{"index":14,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「うん、うん……！\\n　空より色鮮やかで、南で見た海よりも澄み渡ってる青！」","ko":"「응, 응……!<br>　하늘보다 선명하고, 남쪽에서 본 바다보다도 맑은 파랑이야!」"},{"index":15,"command":"msgvoicesync","speakerJp":"パルル","speakerKo":"파루루","jp":"「ええっ！？」","ko":"「네에!?」"},{"index":16,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「フェルメールさんって、藍方石から絵の具を作っとるんよね！？」","ko":"「페르메르 씨는 남방석으로 물감을 만드는 거지!?」"},{"index":17,"command":"msgvoicesync","speakerJp":"パルル","speakerKo":"파루루","jp":"「その通りです！」","ko":"「그렇답니다!」"},{"index":18,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「あれで夜空とかを描いたら、すごくキレイだと思うんよ！」","ko":"「그걸로 밤하늘 같은 걸 그리면 정말 예쁠 것 같아!」"},{"index":19,"command":"msgvoicesync","speakerJp":"パルル","speakerKo":"파루루","jp":"「当然ですね！」","ko":"「당연하죠!」"},{"index":20,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「パルルさんの衣装も宝石みたいだし、\\n　衣装だけじゃなくて造形がすごく整ってるから、\\n　藍方石から生まれたお姫様みたい！」","ko":"「파루루 씨의 옷도 보석 같고,<br>　옷뿐 아니라 생김새도 정말 아름다워서<br>　남방석에서 태어난 공주님 같아!」"},{"index":21,"command":"msgvoicesync","speakerJp":"パルル","speakerKo":"파루루","jp":"「お、お姫様……！？」","ko":"「고, 공주님……!?」"},{"index":22,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「珍しく照れたな」","ko":"「웬일로 부끄러워하네.」"},{"index":23,"command":"message","speakerJp":"","speakerKo":"","jp":"目を輝かせて純粋に褒められたら、さしもの彼女も照れるらしい。","ko":"눈을 반짝이며 순수하게 칭찬하니, 천하의 그녀도 부끄러워하는 모양이다."},{"index":24,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「セッシュウ、申し訳ないが親交を深めるのはまた今度な。\\n　先に用事を済ませないと」","ko":"「셋슈, 미안하지만 친해지는 건 다음으로 미루자.<br>　먼저 볼일부터 봐야 해.」"},{"index":25,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「はっ！\\n　ごめん……あまりに素敵でつい……」","ko":"「앗!<br>　미안…… 너무 멋져서 그만……」"},{"index":26,"command":"msgvoicesync","speakerJp":"パルル","speakerKo":"파루루","jp":"「お、お気持ちは嬉しいです！\\n　では、お姉様のところに案内しますね」","ko":"「그, 그렇게 생각해 주시니 기뻐요!<br>　그럼 언니가 계신 곳으로 안내해 드릴게요.」"},{"index":27,"command":"message","speakerJp":"","speakerKo":"","jp":"パルルに案内され、フェルメールの執務室に足を踏み入れる。\\n彼女は穏やかな笑みを浮かべて、俺達を迎え入れてくれた。","ko":"파루루의 안내를 받아 페르메르의 집무실에 들어섰다.<br>그녀는 부드러운 미소를 띠며 우리를 맞아 주었다."},{"index":28,"command":"msgvoicesync","speakerJp":"フェルメール","speakerKo":"페르메르","jp":"「たいしたおもてなしもできなくてごめんなさいね」","ko":"「제대로 대접도 못 해서 미안해요.」"},{"index":29,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「いいや、忙しいところ急に訪ねてきてすまない」","ko":"「아니, 바쁜데 갑자기 찾아와서 미안해.」"},{"index":30,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「事前の連絡ができなくてごめんなさい……！」","ko":"「미리 연락을 못 해서 죄송해요……!」"},{"index":31,"command":"msgvoicesync","speakerJp":"フェルメール","speakerKo":"페르메르","jp":"「あらあら……いいのよ。\\n　要件は、美術館の仲間として力になれることかしら？」","ko":"「어머…… 괜찮아요.<br>　미술관 동료로서 내가 도와줄 수 있는 일로 온 건가요?」"},{"index":32,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「あぁ。\\n　藝術家としてのフェルメールに尋ねたい。\\n　つい先程、エグゾティ地区の広場で起きた事件の話は聞いているか？」","ko":"「그래.<br>　예술가인 페르메르에게 묻고 싶은 게 있어.<br>　조금 전 에그조티 지구 광장에서 일어난 사건 얘기는 들었어?」"},{"index":33,"command":"msgvoicesync","speakerJp":"フェルメール","speakerKo":"페르메르","jp":"「えぇ。\\n　その騒ぎは外出していた従業員から聞いたわ。\\n　あなたやセキエンさんたちが居合わせていたこともね」","ko":"「네.<br>　외출했던 직원에게 그 소동 얘기는 들었어요.<br>　당신과 세키엔 씨 일행이 거기 있었다는 것도요.」"},{"index":34,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「話が早くて助かる。\\n　芸術犯罪の可能性があって、俺達も捜査を手伝っているんだが……\\n　フェルメールは、珍しい青い絵の具について聞いたことがあるか？」","ko":"「얘기가 빨라서 다행이네.<br>　예술 범죄일 가능성이 있어서 우리도 수사를 돕고 있는데……<br>　페르메르, 혹시 희귀한 파란 물감에 대해 들어 본 적 있어?」"},{"index":35,"command":"message","speakerJp":"","speakerKo":"","jp":"俺は被害者のポケットに青い絵の具で塗られたバラがあったこと。\\nそれは非常に珍しい青い色だったこと。","ko":"나는 피해자의 주머니에 파란 물감으로 칠한 장미가 있었고,<br>그 파란색이 무척 희귀한 색이었다는 것부터 설명했다."},{"index":36,"command":"message","speakerJp":"","speakerKo":"","jp":"事件前に不審な男にぶつかったラファエロの服に、\\n青い絵の具がかすかに付着していたことをかいつまんで説明する。\\n説明を終えると、フェルメールは考え込む。","ko":"사건이 일어나기 전 수상한 남자와 부딪친 라파엘로의 옷에<br>파란 물감이 희미하게 묻어 있었다는 사실도 간추려 전했다.<br>설명을 마치자 페르메르가 생각에 잠겼다."},{"index":37,"command":"msgvoicesync","speakerJp":"フェルメール","speakerKo":"페르메르","jp":"「なるほどね……。\\n　パルル、あれを持ってきてくれるかしら？」","ko":"「그렇군요…….<br>　파루루, 그걸 가져다줄래요?」"},{"index":38,"command":"msgvoicesync","speakerJp":"パルル","speakerKo":"파루루","jp":"「はい、お姉様」","ko":"「네, 언니.」"},{"index":39,"command":"msgvoicesync","speakerJp":"パルル","speakerKo":"파루루","jp":"「こちらになります」","ko":"「여기 있습니다.」"},{"index":40,"command":"message","speakerJp":"","speakerKo":"","jp":"パルルが持ってきたのは、アルバムのような分厚い冊子だった。\\n開くと、様々な青い染料で塗られた紙がある。\\n染料の見本誌だろうか。","ko":"파루루가 가져온 건 앨범처럼 두꺼운 책자였다.<br>펼쳐 보니 여러 가지 파란 염료로 칠한 종이가 들어 있다.<br>염료 견본집일까."},{"index":41,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「わぁああ！\\n　これってフェルメールさんが使う青を吟味する時のサンプル！？」","ko":"「우와아아!<br>　이거 페르메르 씨가 쓸 파란색을 고를 때 보는 견본이야!?」"},{"index":42,"command":"msgvoicesync","speakerJp":"フェルメール","speakerKo":"페르메르","jp":"「えぇ。わたしだけの青を作り出すため、\\n　この街に売っているすべての青い染料の見本を作ったの。\\n　もうだいぶ前のものだから、ここにはない色も今はあるかもだけど」","ko":"「네. 나만의 파랑을 만들어 내려고<br>　이 도시에서 파는 파란 염료는 전부 견본으로 만들어 봤어요.<br>　벌써 꽤 오래전 거라, 여기에는 없는 색도 지금은 있을지 모르지만요.」"},{"index":43,"command":"msgvoicesync","speakerJp":"フェルメール","speakerKo":"페르메르","jp":"「この中に、塗られたバラと同じものがあってもなくても、\\n　少なくともあては絞れるんじゃないかしら？」","ko":"「그중에 그 장미에 칠한 것과 같은 색이 있든 없든,<br>　적어도 범위를 좁힐 수는 있지 않을까요?」"},{"index":44,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「あぁ、とても助かるよ。\\n　しかし、捜査じゃなくても個人的にじっくりみたいな……」","ko":"「그래, 정말 도움이 되겠어.<br>　그런데 수사 때문이 아니더라도 개인적으로 찬찬히 보고 싶네……」"},{"index":45,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「う、うちも……！\\n　水墨画以外は描かないけど気になる！」","ko":"「나, 나도……!<br>　수묵화 말고는 안 그리지만 그래도 궁금해!」"},{"index":46,"command":"msgvoicesync","speakerJp":"フェルメール","speakerKo":"페르메르","jp":"「うふふっ。\\n　落ち着いたらまたいらして？\\n　今度はいいお茶とお菓子も用意しておくわ」","ko":"「우후훗.<br>　한숨 돌리면 또 오실래요?<br>　그때는 좋은 차랑 과자도 준비해 둘게요.」"},{"index":47,"command":"message","speakerJp":"","speakerKo":"","jp":"彼女の言葉にセッシュウはよりやる気を出したのか、\\n真剣にサンプルを確認する。","ko":"그 말에 셋슈는 의욕이 더 생겼는지<br>진지하게 견본을 살펴보았다."},{"index":48,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「うーん……この中には無いようだな」","ko":"「음…… 여기에는 없는 것 같네.」"},{"index":49,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「あの独特の青はないね」","ko":"「그 특이한 파란색은 없네.」"},{"index":50,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「ということは、最近売られ始めた絵の具の可能性もあるのか」","ko":"「그럼 최근에 팔기 시작한 물감일 가능성도 있는 건가.」"},{"index":51,"command":"msgvoicesync","speakerJp":"フェルメール","speakerKo":"페르메르","jp":"「でも、館長さんが見たこと無い色味なら、相当珍しいはずだわ。\\n　それなら、わたしの耳に入ってもおかしくないと思うのだけれど」","ko":"「하지만 관장님도 본 적 없는 색이라면 상당히 희귀할 거예요.<br>　그 정도면 내 귀에도 들어왔을 법한데요.」"},{"index":52,"command":"msgvoicesync","speakerJp":"パルル","speakerKo":"파루루","jp":"「そのとおりです！\\n　青といえばお姉様の代名詞！\\n　真っ先にお姉様に売り込みに来るべきです！」","ko":"「맞아요!<br>　파랑 하면 바로 언니잖아요!<br>　가장 먼저 언니에게 팔러 와야 하는 게 당연해요!」"},{"index":53,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「だとしたら、独自で複数の原料を混ぜたかだな……」","ko":"「그렇다면 직접 여러 원료를 섞어서 만들었을 수도 있겠네……」"},{"index":54,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「でも、混ぜたとしてもベースはあるはずだから、\\n　それでわからないかな？\\n　警吏さんからバラを借りられるのが一番いいんだけど」","ko":"「하지만 섞었어도 바탕이 된 물감은 있을 테니까<br>　그걸로 알아볼 수 있지 않을까?<br>　경찰한테 장미를 빌릴 수 있으면 가장 좋겠는데.」"},{"index":55,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「うーん……証拠品を持ち出すのは難しいだろうな」","ko":"「음…… 증거품을 밖으로 가져오기는 어렵겠지.」"},{"index":56,"command":"message","speakerJp":"","speakerKo":"","jp":"なにせ、他の手がかりが皆無だ。\\n市警も美術館に頼り切りにならないよう頑張っているのなら、\\n邪魔をする真似は憚られる。","ko":"다른 단서가 전혀 없으니 말이다.<br>시경도 미술관에만 의존하지 않으려고 애쓰는 거라면,<br>그 일을 방해하기는 조심스럽다."},{"index":57,"command":"msgvoicesync","speakerJp":"フェルメール","speakerKo":"페르메르","jp":"「……なら、わたしが市警に行こうかしら？\\n　パルル、今日の他の予定は後日にずらしても良いものだったわよね」","ko":"「……그럼 내가 시경에 가 볼까요?<br>　파루루, 오늘 남은 일정은 나중으로 미뤄도 괜찮은 것들이었죠?」"},{"index":58,"command":"msgvoicesync","speakerJp":"パルル","speakerKo":"파루루","jp":"「はい、お姉様。\\n　店舗の視察のみだったはずなので、大丈夫かと」","ko":"「네, 언니.<br>　매장을 둘러보는 일정뿐이었던 걸로 기억하니, 괜찮을 것 같아요.」"},{"index":59,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「いやしかし、忙しいのに……」","ko":"「아니, 그래도 바쁜데……」"},{"index":60,"command":"msgvoicesync","speakerJp":"フェルメール","speakerKo":"페르메르","jp":"「このくらいさせて？　それに、青い絵の具についてなら、\\n　わたしが見た方がわかることもあると思うの。\\n　その代わり、館長さんたちはお花屋さんを当たったほうが良いわ」","ko":"「이 정도는 하게 해 줘요. 게다가 파란 물감이라면<br>　내가 직접 보고 알아낼 수 있는 것도 있을 것 같아요.<br>　대신 관장님 일행은 꽃집을 알아보는 게 좋겠어요.」"},{"index":61,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「なんでお花屋さんに？」","ko":"「왜 꽃집이야?」"},{"index":62,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「わかった。\\n　白バラを今取り扱っている花屋を探せば良いのか」","ko":"「알겠어.<br>　지금 흰 장미를 취급하는 꽃집을 찾으면 되겠구나.」"},{"index":63,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「なるほど！\\n　あの状態なら、少なくとも昨日の内に買われてるはず！」","ko":"「그렇구나!<br>　그 상태라면 적어도 어제 안에는 이미 샀을 거야!」"},{"index":64,"command":"message","speakerJp":"","speakerKo":"","jp":"アテネスは芸術都市ゆえに、花屋の客は画材屋より多くはない。\\nある程度、客の顔を覚えている可能性が高そうだ。","ko":"아테네스는 예술 도시인 만큼, 꽃집의 손님은 화방만큼 많지는 않다.<br>손님 얼굴을 어느 정도 기억하고 있을 가능성이 높아 보인다."}]},{"id":"10011207","titleKo":"꽃을 사랑하는 화가","titleJp":"花を愛する画家","rows":[{"index":0,"command":"title","speakerJp":"","speakerKo":"","jp":"花を愛する画家","ko":"꽃을 사랑하는 화가"},{"index":1,"command":"message","speakerJp":"","speakerKo":"","jp":"青い絵の具のことは、一旦フェルメールに任せることにした。\\nセッシュウとふたりで、今の時期に白いバラを扱っている花屋を当たる。","ko":"파란 물감에 관한 일은 일단 페르메르에게 맡기기로 했다.<br>셋슈와 둘이서 지금 이 시기에 흰 장미를 파는 꽃가게를 찾아다닌다."},{"index":2,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「ううーん、ここもはずれだったね」","ko":"「으음, 여기도 아니었네.」"},{"index":3,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「まぁ、まだ３軒目だからな」","ko":"「뭐, 아직 세 번째 가게니까.」"},{"index":4,"command":"message","speakerJp":"","speakerKo":"","jp":"フェルメールが各地区の商会に問い合わせてくれたお陰で、\\n白バラが売られている花屋の絞り込みはできている。\\n１０軒ほどであれば、片っ端から回れば良い。","ko":"페르메르가 각 지역 상회에 문의해 준 덕분에<br>흰 장미를 파는 꽃가게는 어느 정도 추릴 수 있었다.<br>열 군데 정도라면 차례로 전부 돌아보면 된다."},{"index":5,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「次はプランタンのお店だね」","ko":"「다음은 프랭탕에 있는 가게네.」"},{"index":6,"command":"message","speakerJp":"","speakerKo":"","jp":"メモ書きを見ながら先を行くセッシュウの後ろを歩きながら、\\nふとセキエンたちのことを思い出す。","ko":"메모를 보며 앞장서는 셋슈의 뒤를 따라 걷다가<br>문득 세키엔 일행이 떠올랐다."},{"index":7,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「……次の店を見た後、一度セキエンたちと合流したほうが良いかもな」","ko":"「……다음 가게까지 보고 나면, 일단 세키엔 일행과 합류하는 게 좋겠어.」"},{"index":8,"command":"message","speakerJp":"","speakerKo":"","jp":"あのふたりのことだ。\\nなにかしらの手がかりを見つけていても、おかしくはない。","ko":"그 두 사람이라면<br>뭔가 단서를 찾아냈다고 해도 이상하지 않다."},{"index":9,"command":"msgvoicesync","speakerJp":"警吏","speakerKo":"경찰","jp":"「あ、いたいた！\\n　館長さん！\\n　セッシュウさん！」","ko":"「아, 여기 계셨군요!<br>　관장님!<br>　셋슈 씨!」"},{"index":10,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「さっきの警吏さん！」","ko":"「아까 그 경찰분이네!」"},{"index":11,"command":"msgvoicesync","speakerJp":"警吏","speakerKo":"경찰","jp":"「先程はどうも……。\\n　捜査の方はいかがですか？」","ko":"「아까는 감사했습니다…….<br>　수사는 좀 어떠신가요?」"},{"index":12,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「絵の具の方から手がかりを探しているところです。\\n　そちらもなにかわかりましたか？」","ko":"「물감 쪽에서 단서를 찾고 있습니다.<br>　그쪽도 뭔가 알아내셨나요?」"},{"index":13,"command":"msgvoicesync","speakerJp":"警吏","speakerKo":"경찰","jp":"「はい。\\n　被害者について少し情報が出てきたので、お伝えしようかと」","ko":"「네.<br>　피해자에 관한 정보가 조금 나와서 전해 드리려고요.」"},{"index":14,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「助かります！」","ko":"「감사합니다!」"},{"index":15,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「なるほど……被害者はスラムの人間だったんですね」","ko":"「그렇군요…… 피해자가 빈민가 사람이었군요.」"},{"index":16,"command":"msgvoicesync","speakerJp":"警吏","speakerKo":"경찰","jp":"「はい。\\n　とはいえ、悪さをしている訳ではない、単なる貧民に過ぎません。\\n　恨みを買われるような生活は、していなかったということです」","ko":"「네.<br>　하지만 나쁜 짓을 하고 다니던 사람은 아니고, 그저 가난한 사람이었습니다.<br>　누군가의 원한을 살 만한 생활은 하지 않았다는 거죠.」"},{"index":17,"command":"msgvoicesync","speakerJp":"警吏","speakerKo":"경찰","jp":"「なお、最後の目撃証言はプランタン地区の方でした」","ko":"「그리고 마지막으로 목격된 곳은 프랭탕 지역이었습니다.」"},{"index":18,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「プランタンか……向こうにも該当する花屋はあるな。\\n　ありがとうございます、助かりました」","ko":"「프랭탕이라…… 그쪽에도 확인해 볼 꽃가게가 있네요.<br>　알려 주셔서 감사합니다. 큰 도움이 됐습니다.」"},{"index":19,"command":"msgvoicesync","speakerJp":"警吏","speakerKo":"경찰","jp":"「いいえ！\\n　館長さんたちも、なにかあったらご一報をお願いします！」","ko":"「별말씀을요!<br>　관장님 일행도 뭔가 알아내시면 꼭 알려 주세요!」"},{"index":20,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「てっきり怨恨かと思ってたけど、違うんかな」","ko":"「원한 때문인 줄로만 알았는데, 아닌 걸까?」"},{"index":21,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「しかし、スラムの住民が被害者なら強盗って線も薄そうだ。\\n　つくづく、犯人の動機が読めないな。\\n　突発的な犯行だったのか？」","ko":"「하지만 피해자가 빈민가 주민이라면 강도였을 가능성도 낮겠어.<br>　정말이지 범인의 동기를 모르겠군.<br>　우발적으로 저지른 범행이었나?」"},{"index":22,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「どちらにしても、正解は犯人に聞くしかないね。\\n　ひとまずお花屋さんに行く？」","ko":"「어느 쪽이든 답은 범인한테 물어봐야겠지.<br>　일단 꽃가게부터 갈까?」"},{"index":23,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「そうだな。\\n　セキエンたちとも合流したいし、探しつつ向かおうか」","ko":"「그러자.<br>　세키엔 일행과도 합류하고 싶으니, 가면서 찾아보자.」"},{"index":24,"command":"msgvoicesync","speakerJp":"花屋の店主","speakerKo":"꽃가게 주인","jp":"「あぁ、その人ね！\\n　知ってるよ。\\n　よく奥さんと花を買いに来てたから」","ko":"「아, 그 사람!<br>　알고 있지.<br>　부인하고 꽃을 사러 자주 왔거든.」"},{"index":25,"command":"message","speakerJp":"","speakerKo":"","jp":"ラファエロにぶつかった不審な男の特徴を伝えると、\\n店主はすぐにピンと来たようだった。","ko":"라파엘로와 부딪친 수상한 남자의 인상착의를 설명하자<br>주인은 곧바로 누구인지 알아챈 듯했다."},{"index":26,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「本当！？\\n　詳しく聞いてもいいん？」","ko":"「정말!?<br>　좀 더 자세히 물어봐도 돼?」"},{"index":27,"command":"msgvoicesync","speakerJp":"花屋の店主","speakerKo":"꽃가게 주인","jp":"「いいけど、美術館の方々が彼になんの用です？」","ko":"「그러셔도 되지만, 미술관 분들이 그 사람한테 무슨 볼일이 있으세요?」"},{"index":28,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「あっ、えっと……その人が珍しい絵の具を手に入れたって聞いて。\\n　だからお話を聞きに行きたいなって」","ko":"「아, 그게…… 그 사람이 희귀한 물감을 구했다는 얘기를 들어서.<br>　그래서 만나서 이야기를 좀 들어보고 싶거든.」"},{"index":29,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「もしかしたら、美術館に展示できる作品があるかもと。\\n　その前に、人柄も詳しく聞いておきたいと思いまして」","ko":"「어쩌면 미술관에 전시할 만한 작품이 있을지도 모르니까요.<br>　그전에 어떤 분인지도 자세히 알아 두고 싶어서요.」"},{"index":30,"command":"msgvoicesync","speakerJp":"花屋の店主","speakerKo":"꽃가게 주인","jp":"「あらあら……！\\n　それは喜ばしいことね！」","ko":"「어머나……!<br>　그거 정말 잘됐네요!」"},{"index":31,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「……まるで自分のことのように喜ぶんだね？」","ko":"「……꼭 자기 일처럼 기뻐하네?」"},{"index":32,"command":"msgvoicesync","speakerJp":"花屋の店主","speakerKo":"꽃가게 주인","jp":"「いやね、長いことあの夫婦を見てきたからさ。\\n　遠い田舎から奥さんと出てきて、がんばってたのよ」","ko":"「그야, 오랫동안 그 부부를 봐 왔으니까.<br>　부인하고 멀리 시골에서 올라와 열심히 살았거든.」"},{"index":33,"command":"message","speakerJp":"","speakerKo":"","jp":"いわく、その芸術家は花の絵画を主に描く画家で、名をヨーナスという。\\n無名というほどではないが、有名というほどでもない、\\n可もなく不可もなくといった立ち位置の画家だったようだ。","ko":"그 예술가는 주로 꽃 그림을 그리는 화가로, 이름은 요나스라고 한다.<br>무명이라고 할 정도는 아니지만, 유명하다고 할 정도도 아닌<br>그저 평범한 화가였던 모양이다."},{"index":34,"command":"message","speakerJp":"","speakerKo":"","jp":"題材にと、いつもこの花屋で多くの花を購入していたため、\\n夫婦共々店主とは懇意にしていたらしい。","ko":"그림의 소재로 쓸 꽃을 늘 이 가게에서 많이 사 갔기에<br>부부 모두 주인과 친하게 지냈다고 한다."},{"index":35,"command":"message","speakerJp":"","speakerKo":"","jp":"だが先週、奥さんが病で亡くなって引きこもるようになったようだ。\\n葬儀も挙げられないほどの憔悴ぶりで心配していたが、\\n昨日、花を買いに顔を出したという。","ko":"하지만 지난주에 부인이 병으로 세상을 떠난 뒤로 집에 틀어박히게 됐다고 한다.<br>장례도 치르지 못할 만큼 초췌해져 걱정하고 있었는데<br>어제는 꽃을 사러 얼굴을 내밀었다는 것이다."},{"index":36,"command":"msgvoicesync","speakerJp":"花屋の店主","speakerKo":"꽃가게 주인","jp":"「奥さん、バラが好きな方でね。\\n　だから白いバラを買って行ったよ。\\n　手向けてやるつもりだったんだろうね……」","ko":"「부인이 장미를 좋아했거든.<br>　그래서 흰 장미를 사 갔지.<br>　아마 부인에게 바치려던 거겠지……」"},{"index":37,"command":"msgvoicesync","speakerJp":"花屋の店主","speakerKo":"꽃가게 주인","jp":"「でも、館長さんがヨーナスさんに目をかけてくれそうなら嬉しいよ。\\n　夢幻美術館に絵を飾ることに、憧れていたようだし。\\n　亡くなった奥さんも浮かばれるってもんさ！」","ko":"「그래도 관장님이 요나스 씨를 눈여겨봐 주신다면 기쁘겠네.<br>　몽환 미술관에 자기 그림을 걸고 싶어 했던 모양이거든.<br>　세상을 떠난 부인의 넋도 위로받겠어!」"},{"index":38,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「そうだったんだ……」","ko":"「그랬구나……」"},{"index":39,"command":"message","speakerJp":"","speakerKo":"","jp":"店主の反応的に、殺人を犯すような人物像ではないようだ。\\nだが、ここまで喜ばれると、少し気まずい。","ko":"주인의 반응을 보니 살인을 저지를 만한 사람 같지는 않다.<br>하지만 이렇게까지 기뻐하니 조금 마음이 불편하다."},{"index":40,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「今のお話を聞いて、よりヨーナスさんに会いたくなりました。\\n　もし住まいかアトリエをご存知でしたら、教えていただけませんか？","ko":"「말씀을 들으니 요나스 씨를 더 만나 뵙고 싶어지네요.<br>　혹시 댁이나 작업실을 아시면 알려 주시겠어요?"},{"index":41,"command":"msgvoicesync","speakerJp":"花屋の店主","speakerKo":"꽃가게 주인","jp":"「ええ、もちろん。\\n　店を出て向かいの路地裏の角を曲がった階段のところに、\\n　アパートメントがあるよ。そこの２階の部屋にいるはずさ」","ko":"「네, 물론이죠.<br>　가게에서 나가 맞은편 뒷골목 모퉁이를 돌면 계단이 있는데<br>　거기에 공동주택이 있어요. 그 건물 2층 방에 있을 거예요.」"},{"index":42,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「ありがとうございます。\\n　それでは訪ねてみます」","ko":"「감사합니다.<br>　그럼 찾아가 보겠습니다.」"},{"index":43,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「ありがとう！\\n　今度はお花を買いに来るね！」","ko":"「고마워!<br>　다음에는 꽃 사러 올게!」"},{"index":44,"command":"msgvoicesync","speakerJp":"花屋の店主","speakerKo":"꽃가게 주인","jp":"「どうも〜。\\n　ヨーナスさんにもよろしくね！」","ko":"「고마워요~.<br>　요나스 씨한테도 안부 전해 줘요!」"},{"index":45,"command":"msgvoicesync","speakerJp":"セキエン","speakerKo":"세키엔","jp":"「おっと！\\n　館長とセッシュウじゃないか！」","ko":"「어라!<br>　관장이랑 셋슈 아닌가!」"},{"index":46,"command":"message","speakerJp":"","speakerKo":"","jp":"外に出ると、賑やかしい声が聞こえた。","ko":"밖으로 나오자 활기찬 목소리가 들렸다."},{"index":47,"command":"message","speakerJp":"","speakerKo":"","jp":"見ると、セキエンとラファエロがいる。\\nふたりもかなり驚いている様子だ。","ko":"보니 세키엔과 라파엘로가 있다.<br>두 사람도 꽤 놀란 눈치다."},{"index":48,"command":"msgvoicesync","speakerJp":"セキエン","speakerKo":"세키엔","jp":"「もしや、ふたりはヨーナスという画家のことを聞きに花屋へ？」","ko":"「혹시 두 사람도 요나스라는 화가에 관해 물으러 꽃가게에 온 건가?」"},{"index":49,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「いや、白バラの売っている花屋を当たっていたら\\n　ヨーナスさんの話を聞けたんだ」","ko":"「아니, 흰 장미를 파는 꽃가게를 알아보다가<br>　요나스 씨 이야기를 들었어.」"},{"index":50,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「人となりとか、昨日白バラを買ったことと、\\n　奥さんのことについて聞いたよ」","ko":"「어떤 사람인지랑 어제 흰 장미를 산 일,<br>　그리고 부인에 관한 이야기를 들었어.」"},{"index":51,"command":"msgvoicesync","speakerJp":"ラファエロ","speakerKo":"라파엘로","jp":"「一足先を越されてしまったみたいだね」","ko":"「우리가 한발 늦은 모양이네.」"},{"index":52,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「フェルメールさんの助言のおかげなんよ！」","ko":"「페르메르 씨가 조언해 준 덕분이야!」"},{"index":53,"command":"msgvoicesync","speakerJp":"ラファエロ","speakerKo":"라파엘로","jp":"「おや、彼女に会いに行ったのかい？」","ko":"「어라, 그녀를 만나러 갔던 거니?」"},{"index":54,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「青い絵の具について色々とな。\\n　結果的に、彼女が遺留品の青いバラを見に市警まで行ってくれた」","ko":"「파란 물감에 관해 이것저것 물으러 갔지.<br>　덕분에 그녀가 증거물인 파란 장미를 보러 시경까지 가 줬어.」"},{"index":55,"command":"msgvoicesync","speakerJp":"セキエン","speakerKo":"세키엔","jp":"「フェルメールであれば、なにかしら情報を得てくるかもしれないね」","ko":"「페르메르라면 뭔가 정보를 알아올지도 모르겠네.」"},{"index":56,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「俺達はこれから、ヨーナスさんの住むアパートメントに行こうと思う」","ko":"「우리는 이제 요나스 씨가 사는 공동주택으로 가려고 해.」"},{"index":57,"command":"msgvoicesync","speakerJp":"セキエン","speakerKo":"세키엔","jp":"「なら、ここから合流だね。\\n　わたしたちが花屋に行く理由はなくなったし」","ko":"「그럼 여기서 합류하자.<br>　우리가 꽃가게에 갈 이유도 없어졌으니.」"},{"index":58,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「う、うん……！」","ko":"「으, 응……!」"},{"index":59,"command":"msgvoicesync","speakerJp":"ラファエロ","speakerKo":"라파엘로","jp":"「セッシュウ、あまり肩に力を入れないほうがいい。\\n　警戒はしておいた方がいいけど、\\n　気を張りすぎるとすぐに疲れてしまうよ」","ko":"「셋슈, 너무 긴장하지 않는 게 좋아.<br>　경계는 해야겠지만<br>　너무 신경을 곤두세우면 금방 지치고 말 거야.」"},{"index":60,"command":"message","speakerJp":"","speakerKo":"","jp":"今から殺人犯かもしれない男の家に乗り込む。\\n緊張するのも当然だ。","ko":"이제 살인범일지도 모르는 남자의 집으로 들어간다.<br>긴장하는 것도 당연하다."},{"index":61,"command":"message","speakerJp":"","speakerKo":"","jp":"途中、警吏がいる駐在所に寄って情報を共有し、\\n俺達は裏路地へと足を進めた。","ko":"도중에 경찰이 있는 파출소에 들러 정보를 공유한 뒤<br>우리는 뒷골목으로 발걸음을 옮겼다."}]},{"id":"10011208","titleKo":"악연과의 조우","titleJp":"因縁との邂逅","rows":[{"index":0,"command":"title","speakerJp":"","speakerKo":"","jp":"因縁との邂逅","ko":"악연과의 조우"},{"index":1,"command":"message","speakerJp":"館長","spe
