akerKo":"관장","jp":"「ここがヨーナスさんの家か」","ko":"「여기가 요나스 씨 집인가.」"},{"index":2,"command":"message","speakerJp":"","speakerKo":"","jp":"路地裏の奥、階段に面した位置にアパートメントがあった。\\n表札にもヨーナスの名前があるため、ここで間違いないだろう。","ko":"뒷골목 깊숙한 곳, 계단을 마주한 자리에 공동주택이 있었다.<br>문패에도 요나스라는 이름이 있으니 여기가 맞을 것이다."},{"index":3,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「……嫌に静かだね」","ko":"「……이상할 만큼 조용하네.」"},{"index":4,"command":"msgvoicesync","speakerJp":"ラファエロ","speakerKo":"라파엘로","jp":"「確かに。\\n　人の気配も感じない。\\n　でも、嫌な予感だけはある」","ko":"「그러게.<br>　사람 기척도 느껴지지 않아.<br>　그런데 불길한 예감만은 드는군.」"},{"index":5,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「呼びかけてみるか？」","ko":"「한번 불러 볼까?」"},{"index":6,"command":"msgvoicesync","speakerJp":"ラファエロ","speakerKo":"라파엘로","jp":"「そうだね。\\n　いればなにかしらの反応があるはずだし」","ko":"「그러자.<br>　안에 있다면 뭔가 반응이 있겠지.」"},{"index":7,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「じゃあ、俺が。\\n　ヨーナスさん！」","ko":"「그럼 내가.<br>　요나스 씨!」"},{"index":8,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「…………反応はないな」","ko":"「…………반응이 없네.」"},{"index":9,"command":"message","speakerJp":"セキエン","speakerKo":"세키엔","jp":"「ちょっと失礼」","ko":"「잠깐 실례할게.」"},{"index":10,"command":"message","speakerJp":"","speakerKo":"","jp":"セキエンが横からノブを回し、ドアを押す。","ko":"세키엔이 옆에서 손잡이를 돌리고 문을 민다."},{"index":11,"command":"message","speakerJp":"","speakerKo":"","jp":"鍵はかかっていなかったようで、\\nキィ……と木製特有のきしみを響かせ扉が開いた。","ko":"잠겨 있지는 않았던 모양이다.<br>끼익…… 하고 나무가 삐걱거리는 소리를 내며 문이 열렸다."},{"index":12,"command":"message","speakerJp":"","speakerKo":"","jp":"中は一般的なアパートメントの一室だ。\\nふたりで住み、絵を描くには程良い広さと言ったところか。\\n白いバラだけでなく、他の花々も生けてあり、散らかっている。","ko":"안은 평범한 공동주택의 방이었다.<br>두 사람이 살면서 그림을 그리기에 적당한 넓이라고 해야 할까.<br>흰 장미뿐 아니라 다른 꽃들도 꽂혀 있고, 방은 어수선하다."},{"index":13,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「誰もいないね……」","ko":"「아무도 없네……」"},{"index":14,"command":"msgvoicesync","speakerJp":"セキエン","speakerKo":"세키엔","jp":"「みんな、武器を構えて」","ko":"「모두 무기를 들어.」"},{"index":15,"command":"message","speakerJp":"","speakerKo":"","jp":"一歩前に出ようとした面々を制して、セキエンが鋭く忠告する。","ko":"한 발 앞으로 나서려던 일행을 막으며 세키엔이 날카롭게 경고한다."},{"index":16,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「どうした？」","ko":"「왜 그래?」"},{"index":17,"command":"msgvoicesync","speakerJp":"セキエン","speakerKo":"세키엔","jp":"「ここが間違いなく犯人の根城だ。\\n　あれを見てくれ」","ko":"「여기가 분명 범인의 소굴이야.<br>　저걸 봐.」"},{"index":18,"command":"message","speakerJp":"","speakerKo":"","jp":"セキエンの言葉で部屋の隅に目を向けると、\\nイーゼルに立てかけられたキャンバスがある。\\nそのキャンバスには、青バラの花畑が件の青い絵の具で描かれていた。","ko":"세키엔의 말에 방구석으로 눈을 돌리니<br>이젤에 세워 놓은 캔버스가 있다.<br>캔버스에는 문제의 파란 물감으로 파란 장미 꽃밭이 그려져 있었다."},{"index":19,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「ねぇ……微かだけどこの絵って……」","ko":"「있잖아…… 희미하지만 이 그림……」"},{"index":20,"command":"msgvoicesync","speakerJp":"ラファエロ","speakerKo":"라파엘로","jp":"「ああ、死の芸術の気配がするね」","ko":"「그래, 죽음의 예술의 기운이 느껴지는군.」"},{"index":21,"command":"msgvoicesync","speakerJp":"セキエン","speakerKo":"세키엔","jp":"「動き出す気配もないから、なりかけか、なり損ないとみた」","ko":"「움직일 기색도 없으니, 아직 되어 가는 중이거나 되다 만 것 같아.」"},{"index":22,"command":"message","speakerJp":"","speakerKo":"","jp":"セキエンはそう言ってキャンバスを眺める。\\nすると不意に部屋の空気が重くなって、藝術家の3人が目を見開いた。","ko":"세키엔은 그렇게 말하며 캔버스를 바라본다.<br>그러자 갑자기 방 안의 공기가 무거워지고 예술가 세 사람이 눈을 크게 떴다."},{"index":23,"command":"msgvoicesync","speakerJp":"セキエン","speakerKo":"세키엔","jp":"「うわぁ！？」","ko":"「으아!?」"},{"index":24,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「セキエン……！\\n　ひゃわ！？」","ko":"「세키엔……!<br>　꺄앗!?」"},{"index":25,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「ふたり共！」","ko":"「둘 다!」"},{"index":26,"command":"msgvoicesync","speakerJp":"ラファエロ","speakerKo":"라파엘로","jp":"「館長、あぶない！」","ko":"「관장, 위험해!」"},{"index":27,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「うわぁ！？」","ko":"「으아!?」"},{"index":28,"command":"message","speakerJp":"","speakerKo":"","jp":"なにが起こったのか、確認する暇はなかった。\\nただ、自分を助けようとしたラファエロと共に、\\nなにか強い力に引きずり込まれた感覚だけを理解した。","ko":"무슨 일이 일어났는지 확인할 틈은 없었다.<br>다만 나를 도우려던 라파엘로와 함께<br>뭔가 강한 힘에 끌려 들어가는 감각만이 느껴졌다."},{"index":29,"command":"message","speakerJp":"","speakerKo":"","jp":"視界がひっくり返ったかと思った次の瞬間、\\n俺達は一面青く染まった空間に放り出された。","ko":"시야가 뒤집혔다 싶더니 다음 순간<br>우리는 온통 푸르게 물든 공간으로 내던져졌다."},{"index":30,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「なんだ、ここは……？」","ko":"「뭐지, 여긴……?」"},{"index":31,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「わ……あの絵の具と同じ青色だ……。\\n　地面も青い砂？」","ko":"「와…… 그 물감이랑 똑같은 파란색이야…….<br>　땅도 파란 모래인가?」"},{"index":32,"command":"msgvoicesync","speakerJp":"ラファエロ","speakerKo":"라파엘로","jp":"「死の芸術が作り出したもの、なのかな？」","ko":"「죽음의 예술이 만들어 낸 공간인 걸까?」"},{"index":33,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「だが、こんな事ができる死の芸術なんて聞いたことがない」","ko":"「하지만 이런 일을 할 수 있는 죽음의 예술은 들어 본 적이 없어.」"},{"index":34,"command":"message","speakerJp":"","speakerKo":"","jp":"美術館の館長に代々受け継がれている藝術空間や、\\nイマージュたちの精神空間とも異なる場所だ。\\nイマージュと同等の力を持つ死の芸術がいるということだろうか……？","ko":"미술관 관장에게 대대로 이어지는 예술 공간이나<br>이마쥬들의 정신 공간과도 다른 곳이다.<br>이마쥬와 동등한 힘을 지닌 죽음의 예술이 있다는 뜻일까……?"},{"index":35,"command":"msgvoicesync","speakerJp":"セキエン","speakerKo":"세키엔","jp":"「考察するのは後だよ、みんな。\\n　お出ましだ」","ko":"「생각은 나중에 하자, 다들.<br>　나타났어.」"},{"index":36,"command":"message","speakerJp":"","speakerKo":"","jp":"セキエンの鋭い声に、全員が彼女と同じ方向に目を向ける。\\n広い空間の奥に、忘れられない男の影があった。","ko":"세키엔의 날카로운 목소리에 모두가 그녀와 같은 방향을 바라본다.<br>넓은 공간 저편에 잊을 수 없는 남자의 모습이 있었다."},{"index":37,"command":"msgvoicesync","speakerJp":"フラワーマン","speakerKo":"플라워맨","jp":"「ふふふ、来たね」","ko":"「후후후, 왔군.」"},{"index":38,"command":"message","speakerJp":"","speakerKo":"","jp":"フラワーマンはゆったりとこちらへ振り向いた。\\n彼の服は血まみれで、背後にはバラで飾られた男女の死体がある。\\n男の方は、俺とラファエロが見た男……ヨーナスだ。","ko":"플라워맨은 느긋하게 이쪽을 돌아보았다.<br>그의 옷은 피투성이였고, 뒤에는 장미로 장식된 남녀의 시신이 있다.<br>남자는 나와 라파엘로가 봤던 그 남자…… 요나스다."},{"index":39,"command":"message","speakerJp":"","speakerKo":"","jp":"女性は死んだはずの妻だろう。\\nふたりの遺体はバラの茨で縫い合わせられている。\\nまるで、死んでも一緒だと言わんばかりの、悍ましい光景だった。","ko":"여자는 이미 세상을 떠났다는 그의 아내일 것이다.<br>두 사람의 시신은 장미 가시줄기로 꿰매져 있다.<br>마치 죽어서도 함께하겠다고 말하는 듯한 끔찍한 광경이었다."},{"index":40,"command":"message","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「ひっ……！」","ko":"「히익……!」"},{"index":41,"command":"message","speakerJp":"ラファエロ","speakerKo":"라파엘로","jp":"「本当にフラワーマンが犯人だったのか……！？」","ko":"「정말로 플라워맨이 범인이었던 건가……!?」"},{"index":42,"command":"message","speakerJp":"セキエン","speakerKo":"세키엔","jp":"「いや、違う。\\n　フラワーマンは本来、今回の事件とは無関係だった」","ko":"「아니, 달라.<br>　플라워맨은 원래 이번 사건과는 무관했어.」"},{"index":43,"command":"msgvoicesync","speakerJp":"フラワーマン","speakerKo":"플라워맨","jp":"「どうしてそう思うのかね？」","ko":"「어째서 그렇게 생각하나?」"},{"index":44,"command":"message","speakerJp":"セキエン","speakerKo":"세키엔","jp":"「手口が明らかに違う。\\n　それに、遺体を花瓶に見立てる君が、わざわざ遺棄する訳がない。\\n　大方、青く塗られたバラが気になって、独自で調べていたんだろうさ」","ko":"「수법이 명백히 달라.<br>　게다가 시신을 꽃병으로 쓰는 네가 굳이 내다 버릴 리가 없지.<br>　아마 파랗게 칠한 장미가 신경 쓰여서 따로 조사하고 있었겠지.」"},{"index":45,"command":"message","speakerJp":"セキエン","speakerKo":"세키엔","jp":"「そして、わたしたちと同じようにこの空間に入ってしまい、今に至る。\\n　ヨーナスさんはお前が殺したんだね、その様子だと」","ko":"「그러다 우리처럼 이 공간에 들어와서 지금에 이른 거야.<br>　그 꼴을 보니 요나스 씨는 네가 죽였겠네.」"},{"index":46,"command":"msgvoicesync","speakerJp":"フラワーマン","speakerKo":"플라워맨","jp":"「ふむ……ずいぶん冷静に推理するようになったようだね。\\n　成長、というやつか」","ko":"「흠…… 꽤 침착하게 추리하게 됐군.<br>　성장이라는 건가.」"},{"index":47,"command":"message","speakerJp":"セキエン","speakerKo":"세키엔","jp":"「まだまだだよ。\\n　現に、眼の前で犠牲者が増えてる訳だしね」","ko":"「아직 멀었어.<br>　실제로 눈앞에서 희생자가 늘고 있으니까.」"},{"index":48,"command":"message","speakerJp":"","speakerKo":"","jp":"話しながら、フラワーマンは素早く手を動かす。\\nヨーナスの見開いた右目に、青く塗られたバラが差し込まれた。","ko":"이야기를 나누는 동안 플라워맨은 재빨리 손을 움직인다.<br>요나스의 부릅뜬 오른쪽 눈에 파랗게 칠한 장미가 꽂혔다."},{"index":49,"command":"message","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「やめて！　\\n　そんな酷いこと！」","ko":"「그만해!　<br>　그런 끔찍한 짓을!」"},{"index":50,"command":"message","speakerJp":"ラファエロ","speakerKo":"라파엘로","jp":"「今すぐ彼らから離れろ！」","ko":"「당장 그들에게서 떨어져!」"},{"index":51,"command":"msgvoicesync","speakerJp":"花ゾンビ","speakerKo":"꽃 좀비","jp":"「ああああああああああ」","ko":"「아아아아아아아아아아」"},{"index":52,"command":"message","speakerJp":"ラファエロ","speakerKo":"라파엘로","jp":"「死の芸術が、フラワーマンをかばった！？」","ko":"「죽음의 예술이 플라워맨을 감쌌어!?」"},{"index":53,"command":"msgvoicesync","speakerJp":"フラワーマン","speakerKo":"플라워맨","jp":"「ふぅ……。\\n　彼らを弔うために花を供えていただけだというのに、\\n　美術館の皆さんは実に狭量だ」","ko":"「후우…….<br>　그들을 애도하려고 꽃을 바쳤을 뿐인데<br>　미술관 사람들은 참 속이 좁군.」"},{"index":54,"command":"message","speakerJp":"ラファエロ","speakerKo":"라파엘로","jp":"「なにが弔いだ……。\\n　お前は自分の欲望を満たすために、遺体を弄んだだけだろう！」","ko":"「뭐가 애도라는 거냐…….<br>　네 욕망을 채우려고 시신을 가지고 놀았을 뿐이잖아!」"},{"index":55,"command":"msgvoicesync","speakerJp":"フラワーマン","speakerKo":"플라워맨","jp":"「ふふふふふ、それは見解の違いというものだね」","ko":"「후후후후후, 그건 견해 차이라는 거지.」"},{"index":56,"command":"msgvoicesync","speakerJp":"花ゾンビ","speakerKo":"꽃 좀비","jp":"「あああああああああああああああああああああああああああああ」","ko":"「아아아아아아아아아아아아아아아아아아아아아아아아아아아아아」"},{"index":57,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「みんな、気をつけろ！\\n　来るぞ！」","ko":"「다들 조심해!<br>　온다!」"}]},{"id":"10011209","titleKo":"죽음의 예술은 꽃핀다","titleJp":"死の芸術は花開く","rows":[{"index":0,"command":"title","speakerJp":"","speakerKo":"","jp":"死の芸術は花開く","ko":"죽음의 예술은 꽃핀다"},{"index":1,"command":"msgvoicesync","speakerJp":"セキエン","speakerKo":"세키엔","jp":"「初代ほどの強さではなかったね」","ko":"「초대만큼 강하지는 않았네.」"},{"index":2,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「こ、怖かったけど、大したことはなかったね！」","ko":"「무, 무섭긴 했지만 별거 아니었어!」"},{"index":3,"command":"msgvoicesync","speakerJp":"ラファエロ","speakerKo":"라파엘로","jp":"「ふっ、この程度でぼくを倒そうなんて甘いんじゃないかな」","ko":"「훗, 이 정도로 나를 쓰러뜨리려 하다니 너무 안일한 거 아니야?」"},{"index":4,"command":"msgvoicesync","speakerJp":"フラワーマン","speakerKo":"플라워맨","jp":"「やはり君たちを花器にするには、この作品では力不足のようだね」","ko":"「역시 자네들을 꽃병으로 만들기에는 이 작품으로는 힘이 부족한 모양이군.」"},{"index":5,"command":"message","speakerJp":"","speakerKo":"","jp":"ヨーナス夫妻の遺体を背に、フラワーマンは肩を竦める。\\n作品を壊されたというのに、どこか冷静だった。","ko":"요나스 부부의 시신을 등지고 플라워맨이 어깨를 으쓱했다.<br>작품이 부서졌는데도 어딘지 태연해 보였다."},{"index":6,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「……なぜ、ヨーナスさんを殺した」","ko":"「……왜 요나스 씨를 죽였지?」"},{"index":7,"command":"msgvoicesync","speakerJp":"フラワーマン","speakerKo":"플라워맨","jp":"「私が悪意をもって彼を殺したと思っているようだが、それは間違いだ」","ko":"「내가 악의를 품고 그를 죽였다고 생각하는 모양인데, 그건 오해라네.」"},{"index":8,"command":"message","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「人殺しに善意も悪意もないんよ！？」","ko":"「살인에 선의니 악의니가 어딨어!?」"},{"index":9,"command":"msgvoicesync","speakerJp":"フラワーマン","speakerKo":"플라워맨","jp":"「私はヨーナス君に頼まれたのだよ。\\n　ひと思いに殺してくれと」","ko":"「요나스가 내게 부탁한 거라네.<br>　단숨에 죽여 달라고.」"},{"index":10,"command":"message","speakerJp":"セキエン","speakerKo":"세키엔","jp":"「……なぜ、彼はそう望んだ？」","ko":"「……그는 왜 그런 걸 바랐지?」"},{"index":11,"command":"msgvoicesync","speakerJp":"フラワーマン","speakerKo":"플라워맨","jp":"「殺人に、心が耐えられなかったと言っていた」","ko":"「살인을 저질렀다는 사실을 견딜 수 없었다고 하더군.」"},{"index":12,"command":"msgvoicesync","speakerJp":"フラワーマン","speakerKo":"플라워맨","jp":"「彼は、奥方が愛した花を、自分の作品と愛の軌跡を、\\n　身勝手な理由で死の芸術としたこと……。\\n　さらには奥方のために、愛した芸術で人を殺めたことに――」","ko":"「아내가 사랑한 꽃을, 자신의 작품과 사랑의 발자취를,<br>　이기적인 이유로 죽음의 예술로 만든 것…….<br>　그리고 아내를 위해, 자신이 사랑한 예술로 사람을 죽인 것까지――」"},{"index":13,"command":"msgvoicesync","speakerJp":"フラワーマン","speakerKo":"플라워맨","jp":"「すべてに、絶望してしまったのだよ」","ko":"「그 모든 것에 절망하고 만 거라네.」"},{"index":14,"command":"message","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「つまり、どういうこと……？\\n　そうだとしても、被害者の人が殺された理由が見えないんよ」","ko":"「그러니까, 무슨 말이야……?<br>　그렇다 해도 피해자가 살해당한 이유는 모르겠어.」"},{"index":15,"command":"msgvoicesync","speakerJp":"フラワーマン","speakerKo":"플라워맨","jp":"「被害者は、ただ単に運が悪かっただけのこと。\\n　殺されていたのは他の方かもしれない。\\n　それこそ、そこの館長君であったのかもしれない」","ko":"「피해자는 그저 운이 나빴을 뿐이네.<br>　다른 사람이 죽었을 수도 있었지.<br>　이를테면 거기 있는 관장 자네였을 수도 있고.」"},{"index":16,"command":"message","speakerJp":"セキエン","speakerKo":"세키엔","jp":"「誰でもいいから殺す必要があった……ということだね。\\n　だが、一体なぜだい？」","ko":"「누구든 상관없으니 죽일 필요가 있었다……는 거군.<br>　하지만 대체 왜지?」"},{"index":17,"command":"msgvoicesync","speakerJp":"フラワーマン","speakerKo":"플라워맨","jp":"「それを推理で解き明かすのが、君の使命ではないのかね？」","ko":"「그걸 추리로 밝혀내는 게 자네의 사명이 아닌가?」"},{"index":18,"command":"msgvoicesync","speakerJp":"フラワーマン","speakerKo":"플라워맨","jp":"「……いやしかし、実に残念。\\n　花そのものを愛している私とは少し違うが、\\n　それでも同好の士として楽しく交友できると思っていたよ」","ko":"「……아니, 그래도 참 안타깝군.<br>　꽃 자체를 사랑하는 나와는 조금 다르지만,<br>　그래도 같은 취향을 가진 사람끼리 즐겁게 어울릴 수 있으리라 생각했네.」"},{"index":19,"command":"msgvoicesync","speakerJp":"フラワーマン","speakerKo":"플라워맨","jp":"「せめてもの手向けとして花を飾っている時に、君たちがやって来た」","ko":"「추모의 뜻이라도 전하려고 꽃을 놓아 주던 참에, 자네들이 온 거네.」"},{"index":20,"command":"message","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「悪趣味すぎる……！」","ko":"「너무 끔찍한 취미야……!」"},{"index":21,"command":"msgvoicesync","speakerJp":"フラワーマン","speakerKo":"플라워맨","jp":"「お嬢さんはまだ幼い。\\n　この芸術がわからずとも、仕方あるまい」","ko":"「아가씨는 아직 어리군.<br>　이 예술을 이해하지 못해도 어쩔 수 없겠지.」"},{"index":22,"command":"message","speakerJp":"ラファエロ","speakerKo":"라파엘로","jp":"「誰も理解しないさ」","ko":"「누구도 이해하지 못할 거야.」"},{"index":23,"command":"msgvoicesync","speakerJp":"フラワーマン","speakerKo":"플라워맨","jp":"「芸術とは理解されにくいものでもある。\\n　――さて、頃合いだ」","ko":"「예술이란 좀처럼 이해받지 못하는 것이기도 하지.<br>　――자, 때가 됐군.」"},{"index":24,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「なに？」","ko":"「뭐?」"},{"index":25,"command":"msgvoicesync","speakerJp":"フラワーマン","speakerKo":"플라워맨","jp":"「時間稼ぎは十分できた、ということさ」","ko":"「시간을 충분히 벌었다는 뜻이라네.」"},{"index":26,"command":"message","speakerJp":"","speakerKo":"","jp":"フラワーマンが言うやいなや、ヨーナス夫妻の遺体に異変が起こる。","ko":"플라워맨이 그렇게 말하자마자 요나스 부부의 시신에 이상이 생겼다."},{"index":27,"command":"message","speakerJp":"ラファエロ","speakerKo":"라파엘로","jp":"「しょ、植物が遺体を覆っていく……！？」","ko":"「시, 식물이 시신을 뒤덮고 있어……!?」"},{"index":28,"command":"message","speakerJp":"","speakerKo":"","jp":"青い茨が、遺体に巻き付いた。\\n遺体は瞬く間に覆われ、茨は植物の塊となって肥大化していく。","ko":"파란 가시덩굴이 시신을 감쌌다.<br>시신은 순식간에 뒤덮였고, 가시덩굴은 거대한 식물 덩어리로 부풀어 갔다."},{"index":29,"command":"message","speakerJp":"セキエン","speakerKo":"세키엔","jp":"「青いバラの、死の芸術……！」","ko":"「파란 장미의 죽음의 예술……!」"},{"index":30,"command":"msgvoicesync","speakerJp":"フラワーマン","speakerKo":"플라워맨","jp":"「ヨーナスが描いたものを利用させてもらった。\\n　花に埋もれ、ふたりは永遠に添い遂げる。\\n　彼にとっても幸せな結末だろう」","ko":"「요나스가 그린 것을 이용했네.<br>　꽃에 파묻힌 채 두 사람은 영원히 함께할 테지.<br>　그에게도 행복한 결말이겠지.」"},{"index":31,"command":"message","speakerJp":"ラファエロ","speakerKo":"라파엘로","jp":"「しまった！」","ko":"「아차!」"},{"index":32,"command":"message","speakerJp":"セキエン","speakerKo":"세키엔","jp":"「うわっ……！」","ko":"「으앗……!」"},{"index":33,"command":"message","speakerJp":"","speakerKo":"","jp":"気付けば、我々４人の足には植物の蔓が巻き付いていた。\\nセキエンとラファエロは即座に対処したが、\\n俺とセッシュウは一気に縛り上げられ地面に転がされてしまう。","ko":"어느새 우리 네 사람의 다리에는 식물 덩굴이 감겨 있었다.<br>세키엔과 라파엘로는 즉각 대처했지만,<br>나와 셋슈는 순식간에 칭칭 묶여 바닥에 내동댕이쳐졌다."},{"index":34,"command":"message","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「きゃー！？」","ko":"「꺄아!?」"},{"index":35,"command":"msgvoicesync","speakerJp":"フラワーマン","speakerKo":"플라워맨","jp":"「本当に甘いな、君たちは……。\\n　安易な時間稼ぎにすら気が付かないなんて」","ko":"「자네들은 정말 안일하군…….<br>　그 뻔한 시간 끌기조차 눈치채지 못하다니.」"},{"index":36,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「くっ、ほどけない」","ko":"「큭, 풀리지 않아.」"},{"index":37,"command":"msgvoicesync","speakerJp":"フラワーマン","speakerKo":"플라워맨","jp":"「さぁ、ここで私は失礼させてもらうとしよう」","ko":"「자, 그럼 나는 이만 실례하겠네.」"},{"index":38,"command":"msgvoicesync","speakerJp":"フラワーマン","speakerKo":"플라워맨","jp":"「また会おう、セキエン君。\\n　次は完璧に打ち倒して、君を花器として使ってあげよう」","ko":"「또 만나세, 세키엔.<br>　다음에는 완전히 쓰러뜨려서 자네를 꽃병으로 써 주겠네.」"},{"index":39,"command":"message","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「卑怯者ー！　臆病者ー！\\n　セキエンがあんたみたいな紛い物に負ける訳ないんよ！」","ko":"「비겁한 놈! 겁쟁이!<br>　세키엔이 너 같은 가짜한테 질 리 없어!」"},{"index":40,"command":"msgvoicesync","speakerJp":"フラワーマン","speakerKo":"플라워맨","jp":"「私はいずれ本物になるのだよ。\\n　その時を楽しみにしていたまえ」","ko":"「나는 언젠가 진짜가 될 거라네.<br>　그때를 기대하고 있게.」"},{"index":41,"command":"msgvoicesync","speakerJp":"フラワーマン","speakerKo":"플라워맨","jp":"「さらばだ！」","ko":"「잘 있게!」"},{"index":42,"command":"msgvoicesync","speakerJp":"セキエン","speakerKo":"세키엔","jp":"「待て！」","ko":"「멈춰!」"},{"index":43,"command":"msgvoicesync","speakerJp":"ラファエロ","speakerKo":"라파엘로","jp":"「深追いするな、セキエン！\\n　館長たちを助けないと！」","ko":"「무리하게 쫓아가지 마, 세키엔!<br>　관장 일행을 구해야 해!」"},{"index":44,"command":"msgvoicesync","speakerJp":"バラの死の芸術","speakerKo":"장미 죽음의 예술","jp":"「――――――！」","ko":"「――――――！」"},{"index":45,"command":"message","speakerJp":"","speakerKo":"","jp":"死の芸術の茨が、\\nセキエンとラファエロを捕らえようと襲いかかってくる。","ko":"죽음의 예술의 가시덩굴이<br>세키엔과 라파엘로를 붙잡으려고 덮쳐 왔다."},{"index":46,"command":"message","speakerJp":"","speakerKo":"","jp":"彼女たちは武器で襲い来る茨を退けているが、\\n絶え間ない攻撃の波に、こちらを助ける余力はない。\\nイマージュたちを連れて来なかったのは判断ミスだった。","ko":"두 사람은 무기로 덮쳐 오는 가시덩굴을 쳐내고 있었지만,<br>쉴 새 없는 공격에 우리를 도울 여유는 없었다.<br>이마쥬들을 데려오지 않은 것은 판단 착오였다."},{"index":47,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「んーーー！\\n　館長さん、これどんどんキツくなっとるー！」","ko":"「으으으!<br>　관장님, 이거 점점 더 꽉 조여 와!」"},{"index":48,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「くっ……もはや猶予はなさそうだな……！\\n　早く茨から脱出しないと……」","ko":"「크윽…… 이제 시간이 없을 것 같군……!<br>　빨리 가시덩굴에서 빠져나와야……」"},{"index":49,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「痛いよ……！\\n　苦しいよ」","ko":"「아파……!<br>　숨 막혀.」"},{"index":50,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「セッシュウ！\\n　無理をして動くんじゃない！」","ko":"「셋슈!<br>　무리해서 움직이지 마!」"},{"index":51,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「う……うぅ、う……うわーん！」","ko":"「으…… 으으, 으…… 으아앙!」"},{"index":52,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「セッシュウ！？」","ko":"「셋슈!?」"},{"index":53,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「うぇえええええん！」","ko":"「으에에에에엥!」"},{"index":54,"command":"message","speakerJp":"","speakerKo":"","jp":"どこか体に傷を負ってしまったのだろうか。\\n足をばたばたさせて泣きじゃくるセッシュウに、焦りが募る。","ko":"어딘가 다친 걸까.<br>다리를 버둥거리며 울어 대는 셋슈를 보니 점점 초조해졌다."},{"index":55,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「セッシュウ、落ち着け！\\n　暴れても痛いだ、け……？」","ko":"「셋슈, 진정해!<br>　몸부림쳐 봐야 아프기만 할…… 텐데……?」"},{"index":56,"command":"message","speakerJp":"","speakerKo":"","jp":"彼女はふと体勢を変えた。\\nその拍子に頬を伝う涙が地面に落ちる。\\nつい涙の雫を目で追ってしまった俺は、青い砂の地面を見て驚いた。","ko":"그녀가 문득 자세를 바꿨다.<br>그 바람에 뺨을 타고 흐르던 눈물이 땅에 떨어졌다.<br>무심코 눈물방울을 눈으로 좇던 나는 파란 모래로 된 바닥을 보고 놀랐다."},{"index":57,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「ふぅ……このくらいで良いかな」","ko":"「후우…… 이 정도면 되려나.」"},{"index":58,"command":"message","speakerJp":"","speakerKo":"","jp":"呟いた彼女は、もう泣いていない。\\nだが、涙は地面に落ちた。\\n縛られても足先だけで描ききった、精緻なネズミの絵に――","ko":"중얼거린 그녀는 더 이상 울지 않았다.<br>하지만 눈물은 땅에 떨어졌다.<br>묶인 상태에서도 발끝만으로 그려 낸 정교한 쥐 그림 위로――"},{"index":59,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「来て、チューコ！」","ko":"「와 줘, 추코!」"},{"index":60,"command":"message","speakerJp":"チューコ","speakerKo":"추코","jp":"「チューコ、参上しました」","ko":"「추코, 대령했습니다.」"},{"index":61,"command":"message","speakerJp":"","speakerKo":"","jp":"ネズミの絵から優雅に現れたのは、\\nセッシュウのイマージュであるチューコだった。","ko":"쥐 그림에서 우아하게 나타난 것은<br>셋슈의 이마쥬인 추코였다."},{"index":62,"command":"message","speakerJp":"","speakerKo":"","jp":"チューコは名乗るやいなや、すぐに俺とセッシュウを縛る茨を断ち切る。","ko":"추코는 이름을 밝히자마자 나와 셋슈를 묶고 있던 가시덩굴을 잘라 냈다."},{"index":63,"command":"message","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「痛たた……。\\n　ありがとうね、チューコ」","ko":"「아야야…….<br>　고마워, 추코.」"},{"index":64,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「助かったよ……。\\n　しかし今のは？」","ko":"「덕분에 살았어…….<br>　그런데 방금 그건?」"},{"index":65,"command":"message","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「うちが編み出した魔法だよ。\\n　ネズミを描いた絵をうちの涙で濡らすと、\\n　どんなに離れていてもチューコが来てくれるんよ」","ko":"「내가 만들어 낸 마법이야.<br>　쥐를 그린 그림을 내 눈물로 적시면,<br>　아무리 멀리 있어도 추코가 와 주거든.」"},{"index":66,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「だから泣いていたのか……」","ko":"「그래서 울고 있었던 거구나……」"},{"index":67,"command":"message","speakerJp":"チューコ","speakerKo":"추코","jp":"「これも、セッシュウ様がわたちを\\n　正式なイマージュとして認めてくださったがゆえです」","ko":"「이것도 셋슈 님께서 저를<br>　정식 이마쥬로 인정해 주신 덕분입니다.」"},{"index":68,"command":"message","speakerJp":"","speakerKo":"","jp":"チューコはセッシュウの腕に触れ、\\n茨のせいで小さなキズができていることを確認した。\\nそうして険しい表情で刀を抜き、死の芸術に向き直ると――","ko":"추코는 셋슈의 팔을 만져 보고,<br>가시덩굴 때문에 작은 상처가 생긴 것을 확인했다.<br>그러고는 굳은 표정으로 칼을 뽑아 죽음의 예술을 향해 돌아서더니――"},{"index":69,"command":"msgvoicesync","speakerJp":"チューコ","speakerKo":"추코","jp":"「だからこそ、許せません」","ko":"「그러니 용서할 수 없습니다.」"},{"index":70,"command":"msgvoicesync","speakerJp":"バラの死の芸術","speakerKo":"장미 죽음의 예술","jp":"「――――――！」","ko":"「――――――！」"},{"index":71,"command":"msgvoicesync","speakerJp":"ラファエロ","speakerKo":"라파엘로","jp":"「うわっ！？\\n　茨が！？」","ko":"「우왓!?<br>　가시덩굴이!?」"},{"index":72,"command":"msgvoicesync","speakerJp":"セキエン","speakerKo":"세키엔","jp":"「この斬撃……チューコか！」","ko":"「이 참격은…… 추코인가!」"},{"index":73,"command":"msgvoicesync","speakerJp":"チューコ","speakerKo":"추코","jp":"「助太刀いたします。\\n　この雑草、根っこまで斬り刻んでくれましょう」","ko":"「도와드리겠습니다.<br>　이 잡초는 뿌리까지 잘게 베어 버리겠습니다.」"},{"index":74,"command":"msgvoicesync","speakerJp":"ラファエロ","speakerKo":"라파엘로","jp":"「お、怒ってるね……」","ko":"「화, 화가 났네……」"},{"index":75,"command":"message","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「うちも戦うからね！\\n　背中は任せて！」","ko":"「나도 싸울 거야!<br>　등 뒤는 나한테 맡겨!」"},{"index":76,"command":"msgvoicesync","speakerJp":"チューコ","speakerKo":"추코","jp":"「セッシュウ様……」","ko":"「셋슈 님……」"},{"index":77,"command":"msgvoicesync","speakerJp":"チューコ","speakerKo":"추코","jp":"「承知いたしました。\\n　あなた様には茨１本近付けさせません」","ko":"「알겠습니다.<br>　셋슈 님께는 가시덩굴 한 줄기도 다가가지 못하게 하겠습니다.」"},{"index":78,"command":"msgvoicesync","speakerJp":"ラファエロ","speakerKo":"라파엘로","jp":"「ははっ、これは疲れたなんて言ってる場合じゃないね。\\n　いくよ、セキエン！」","ko":"「하핫, 피곤하다고 할 때가 아니네.<br>　가자, 세키엔!」"},{"index":79,"command":"msgvoicesync","speakerJp":"セキエン","speakerKo":"세키엔","jp":"「もちろん！\\n　こいつを倒してここを出る！」","ko":"「물론이지!<br>　이 녀석을 쓰러뜨리고 여길 나가자!」"}]},{"id":"10011210","titleKo":"남은 수수께끼는 어둠 속에","titleJp":"残る謎は闇の中に","rows":[{"index":0,"command":"title","speakerJp":"","speakerKo":"","jp":"残る謎は闇の中に","ko":"남은 수수께끼는 어둠 속에"},{"index":1,"command":"msgvoicesync","speakerJp":"バラの死の芸術","speakerKo":"장미 죽음의 예술","jp":"「――…………！」","ko":"「――…………！」"},{"index":2,"command":"message","speakerJp":"","speakerKo":"","jp":"死の芸術は花弁を散らし、青い砂となって消えていく。","ko":"죽음의 예술은 꽃잎을 흩뿌리며 파란 모래가 되어 사라져 갔다."},{"index":3,"command":"message","speakerJp":"","speakerKo":"","jp":"――と同時に視界は暗くなり、\\n俺達はなにかに引っ張られるような感覚を覚えた。","ko":"――그와 동시에 시야가 어두워졌고,<br>우리는 무언가에 끌려가는 듯한 감각을 느꼈다."},{"index":4,"command":"msgvoicesync","speakerJp":"セキエン","speakerKo":"세키엔","jp":"「わーー！？」","ko":"「와아아!?」"},{"index":5,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「きゃー！」","ko":"「꺄아!」"},{"index":6,"command":"msgvoicesync","speakerJp":"チューコ","speakerKo":"추코","jp":"「セッシュウ様！\\n　大丈夫ですか！？」","ko":"「셋슈 님!<br>　괜찮으십니까!?」"},{"index":7,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「大丈夫〜……」","ko":"「괜찮아~……」"},{"index":8,"command":"msgvoicesync","speakerJp":"セキエン","speakerKo":"세키엔","jp":"「わたしの心配は！？」","ko":"「내 걱정은 안 해!?」"},{"index":9,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「いてて……。\\n　戻って来られたのか……？」","ko":"「아야야…….<br>　돌아온 건가……?」"},{"index":10,"command":"msgvoicesync","speakerJp":"ラファエロ","speakerKo":"라파엘로","jp":"「そのようだね。\\n　見て、館長。\\n　あの絵が……」","ko":"「그런 모양이네.<br>　봐, 관장.<br>　저 그림이……」"},{"index":11,"command":"message","speakerJp":"","speakerKo":"","jp":"ラファエロの言葉で振り返ると、\\nあの青バラの花畑の絵は、花が枯れるように色褪せている。","ko":"라파엘로의 말에 뒤를 돌아보니,<br>그 파란 장미 꽃밭을 그린 그림은 꽃이 시들듯 색이 바래 가고 있었다."},{"index":12,"command":"msgvoicesync","speakerJp":"セキエン","speakerKo":"세키엔","jp":"「これが、あの異様な空間の入口だったんだ」","ko":"「이게 그 기묘한 공간의 입구였던 거야.」"},{"index":13,"command":"msgvoicesync","speakerJp":"ラファエロ","speakerKo":"라파엘로","jp":"「大元の死の芸術を倒したことで、空間自体が崩壊したってことかな？」","ko":"「근원이 된 죽음의 예술을 쓰러뜨려서 공간 자체가 무너진 건가?」"},{"index":14,"command":"msgvoicesync","speakerJp":"セキエン","speakerKo":"세키엔","jp":"「おそらく。\\n　そして、これで最初の殺人もあらかた理解できたね」","ko":"「아마도.<br>　그리고 이제 첫 살인도 거의 이해가 됐네.」"},{"index":15,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「どういうこと？」","ko":"「무슨 말이야?」"},{"index":16,"command":"msgvoicesync","speakerJp":"セキエン","speakerKo":"세키엔","jp":"「あの異空間で殺人を行ったんだろう。\\n　そして絵画を運んで、異空間から遺体を出して建物の屋上に遺棄した」","ko":"「그 이공간에서 살인을 저질렀겠지.<br>　그런 다음 그림을 옮겨서 이공간에서 시신을 꺼내 건물 옥상에 버린 거야.」"},{"index":17,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「なるほど。\\n　それなら人目にも付かないし、痕跡も残りにくいね」","ko":"「그렇구나.<br>　그러면 사람 눈에도 띄지 않고 흔적도 남기 어렵겠네.」"},{"index":18,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「やはり、抱えていた荷物もこの絵だったんだな……」","ko":"「역시 안고 있던 짐도 이 그림이었구나……」"},{"index":19,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「よし、ひとまず市警を呼ぼう。\\n　ここに来る前に情報を伝えたから、近くには来ているはずだ」","ko":"「좋아, 일단 시경을 부르자.<br>　여기 오기 전에 정보를 전했으니 근처까지는 와 있을 거야.」"},{"index":20,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「死の芸術を片付けて、フラワーマンを退けたし、\\n　後は警吏さんたちの仕事だもんね」","ko":"「죽음의 예술도 처리했고 플라워맨도 물리쳤으니,<br>　나머지는 경찰분들이 할 일이네.」"},{"index":21,"command":"message","speakerJp":"","speakerKo":"","jp":"警吏から事情聴取を受けて様々な後処理を行い、\\nすべてが終わった頃には、陽はすっかり暮れていた。","ko":"경찰에게 조사를 받고 여러 뒷일을 정리했다.<br>모든 것이 끝났을 때는 해가 완전히 저물어 있었다."},{"index":22,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「みんな、休日なのに長々と付き合わせてしまってすまないな」","ko":"「다들 휴일인데도 이렇게 오래 붙잡아 둬서 미안해.」"},{"index":23,"command":"msgvoicesync","speakerJp":"ラファエロ","speakerKo":"라파엘로","jp":"「それは館長もだよ。\\n　せっかくの休みが、いつもの１日だ」","ko":"「그건 관장도 마찬가지야.<br>　모처럼 쉬는 날이 평소와 똑같은 하루가 됐네.」"},{"index":24,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「そうだな。\\n　だが、今日はまだ終わった訳じゃない。\\n　みんなで夕ご飯でも食べて終わろうじゃないか」","ko":"「그렇네.<br>　하지만 오늘이 아직 끝난 건 아니지.<br>　다 같이 저녁이라도 먹고 마무리하지 않을래?」"},{"index":25,"command":"msgvoicesync","speakerJp":"セッシュウ","speakerKo":"셋슈","jp":"「みんなでご飯！\\n　行きたい！」","ko":"「다 같이 밥이라니!<br>　가고 싶어!」"},{"index":26,"command":"msgvoicesync","speakerJp":"ラファエロ","speakerKo":"라파엘로","jp":"「そうだね。\\n　みんなでがんばったのだから、ご褒美があったっていい」","ko":"「그러자.<br>　다 같이 힘냈으니 보상이 있어도 좋지.」"},{"index":27,"command":"msgvoicesync","speakerJp":"チューコ","speakerKo":"추코","jp":"「わたち、チーズが置いてある店だと嬉しいです」","ko":"「저는 치즈가 있는 가게면 좋겠습니다.」"},{"index":28,"command":"message","speakerJp":"","speakerKo":"","jp":"和やかな空気の中、皆と共に店の方へと歩く。\\nだが、セキエンは一歩後ろからついて行きながら、考え込んでいた。","ko":"화기애애한 분위기 속에서 모두와 함께 식당을 향해 걸었다.<br>하지만 세키엔은 한발 뒤에서 따라오며 생각에 잠겨 있었다."},{"index":29,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「まだ気がかりなことがあるのか？」","ko":"「아직 마음에 걸리는 게 있어?」"},{"index":30,"command":"msgvoicesync","speakerJp":"セキエン","speakerKo":"세키엔","jp":"「……解けていない謎があるからね」","ko":"「……아직 풀리지 않은 수수께끼가 있으니까.」"},{"index":31,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「……なぜヨーナスさんが人を殺したか、だな」","ko":"「……요나스 씨가 왜 사람을 죽였는지 말이지.」"},{"index":32,"command":"msgvoicesync","speakerJp":"セキエン","speakerKo":"세키엔","jp":"「彼は善人だと思う。\\n　そんな彼が、愛した花の死の芸術を作り人を殺した」","ko":"「그는 선한 사람이라고 생각해.<br>　그런 그가 사랑하던 꽃으로 죽음의 예술을 만들어 사람을 죽였지.」"},{"index":33,"command":"msgvoicesync","speakerJp":"セキエン","speakerKo":"세키엔","jp":"「そうなるに至った動機はわからないまま。\\n　この謎を残しておくのは、まずい気がするんだ……」","ko":"「그렇게 된 동기는 여전히 모르겠어.<br>　이 수수께끼를 남겨 두면 안 될 것 같은데……」"},{"index":34,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「同感だ。\\n　あの青い絵の具のことも、まだなにもわかっていない」","ko":"「나도 같은 생각이야.<br>　그 파란 물감에 대해서도 아직 아무것도 밝혀지지 않았어.」"},{"index":35,"command":"msgvoicesync","speakerJp":"セキエン","speakerKo":"세키엔","jp":"「先ほど事情聴取で話した警吏によると、\\n　残念ながらフェルメールは遺留品のバラを見ても、\\n　なにもわからなかったようだね」","ko":"「아까 조사할 때 얘기한 경찰에 따르면,<br>　안타깝게도 페르메르는 증거물인 장미를 보고도<br>　아무것도 알아내지 못한 모양이야.」"},{"index":36,"command":"message","speakerJp":"館長","speakerKo":"관장","jp":"「あぁ。\\n　だが、フェルメールも引き続き調べてみるとのことだったな」","ko":"「그래.<br>　그래도 페르메르가 계속 알아보겠다고 했지.」"},{"index":37,"command":"message","speakerJp":"","speakerKo":"","jp":"今回は一応の解決となったが、多くの謎が残った上、\\nフラワーマンの逮捕はできていない。\\nこの事件が、別の大きな事件を呼び込むことがなければいいが――","ko":"이번 사건은 일단락되었지만, 수수께끼는 많이 남았고<br>플라워맨을 체포하지도 못했다.<br>이 사건이 또 다른 큰 사건을 불러오는 일이 없었으면 좋겠는데――"},{"index":38,"command":"message","speakerJp":"","speakerKo":"","jp":"市警も撤収した、深夜のこと。\\n闇に紛れる女は、空っぽになった画家の家を見上げた。","ko":"시경도 철수한 깊은 밤.<br>어둠에 숨어든 여자가 텅 빈 화가의 집을 올려다봤다."},{"index":39,"command":"msgvoicesync","speakerJp":"黒服の女","speakerKo":"검은 옷을 입은 여자","jp":"「あー……あのおっさん、死んじゃったんだぁ。\\n　せっかくあたしが絵の具あげたのにさ、\\n　２人分しか集められてないじゃん」","ko":"「아아…… 그 아저씨, 죽어 버렸구나.<br>　모처럼 내가 물감을 줬는데,<br>　겨우 두 사람 몫밖에 못 모았잖아.」"},{"index":40,"command":"msgvoicesync","speakerJp":"黒服の女","speakerKo":"검은 옷을 입은 여자","jp":"「まぁ、いいか。\\n　足しにはなっただろうし」","ko":"「뭐, 됐어.<br>　보탬은 됐을 테니까.」"},{"index":41,"command":"msgvoicesync","speakerJp":"黒服の女","speakerKo":"검은 옷을 입은 여자","jp":"「ねぇ？　■■■？」","ko":"「그렇지? ■■■?」"},{"index":42,"command":"msgvoicesync","speakerJp":"謎の少女","speakerKo":"수수께끼의 소녀","jp":"「………………」","ko":"「………………」"},{"index":43,"command":"message","speakerJp":"","speakerKo":"","jp":"ゆるりと暗闇から顔をのぞかせた少女は、虚ろな瞳に女をうつすだけ。","ko":"어둠 속에서 느릿하게 얼굴을 내민 소녀는 공허한 눈에 여자를 비출 뿐이었다."},{"index":44,"command":"msgvoicesync","speakerJp":"黒服の女","speakerKo":"검은 옷을 입은 여자","jp":"「大丈夫、すぐに元通りにしてあげる。\\n　全部忘れちゃってるあいつにもお仕置きして、連れて来るから」","ko":"「괜찮아, 금방 원래대로 되돌려 줄게.<br>　전부 잊어 버린 그 녀석도 혼내 주고 데려올 테니까.」"},{"index":45,"command":"msgvoicesync","speakerJp":"黒服の女","speakerKo":"검은 옷을 입은 여자","jp":"「だって、あたしはあんたたちの親友なんだもの」","ko":"「그야 난 너희의 둘도 없는 친구인걸.」"},{"index":46,"command":"message","speakerJp":"黒服の女","speakerKo":"검은 옷을 입은 여자","jp":"「あはっ……あははははは！」","ko":"「아핫…… 아하하하하하!」"},{"index":47,"command":"message","speakerJp":"","speakerKo":"","jp":"狂気を孕んだ女の笑い声は、月の光すら届かない闇に溶けていった。","ko":"광기가 서린 여자의 웃음소리가 달빛조차 닿지 않는 어둠 속으로 녹아들었다."}]},{"id":"10011211","titleKo":"편지에 담긴 감정은……","titleJp":"手紙にこめられた感情は……","rows":[{"index":0,"command":"title","speakerJp":"","speakerKo":"","jp":"手紙にこめられた感情は……","ko":"편지에 담긴 감정은……"},{"index":1,"command":"message","speakerJp":"","speakerKo":"","jp":"時は少し遡り――","ko":"시간을 조금 거슬러 올라가――"},{"index":2,"command":"msgvoicesync","speakerJp":"サンソヴィーノ","speakerKo":"산소비노","jp":"「館長様、ただいま戻りました」","ko":"「관장님, 다녀왔습니다.」"},{"index":3,"command":"msgvoicesync","speakerJp":"アルテ","speakerKo":"아르테","jp":"「ただいまです、館長。\\n　私がいなくて、さぞ寂しかったことでしょう！\\n　お土産を――」","ko":"「다녀왔어요, 관장.<br>　제가 없어서 무척 외로우셨겠죠!<br>　선물을――」"},{"index":4,"command":"msgvoicesync","speakerJp":"アルテ","speakerKo":"아르테","jp":"「って、あれ？\\n　いないですね」","ko":"「어라?<br>　안 계시네요.」"},{"index":5,"command":"msgvoicesync","speakerJp":"サンソヴィーノ","speakerKo":"산소비노","jp":"「お休みですし、街に出ているんでしょうか」","ko":"「쉬는 날이니 시내에 나가신 걸까요?」"},{"index":6,"command":"msgvoicesync","speakerJp":"エトラ","speakerKo":"에트라","jp":"「あ、アルテ様、サンソヴィーノ様、おかえりなさい」","ko":"「아, 아르테 님, 산소비노 님, 다녀오셨어요?」"},{"index":7,"command":"msgvoicesync","speakerJp":"サンソヴィーノ","speakerKo":"산소비노","jp":"「ただいま戻りました、エトラさん」","ko":"「다녀왔어요, 에트라 씨.」"},{"index":8,"command":"msgvoicesync","speakerJp":"アルテ","speakerKo":"아르테","jp":"「エトラじゃないですか。\\n　お土産ありますよ」","ko":"「에트라잖아요.<br>　선물 있어요.」"},{"index":9,"command":"msgvoicesync","speakerJp":"エトラ","speakerKo":"에트라","jp":"「ありがとうございます……！」","ko":"「감사합니다……!」"},{"index":10,"command":"msgvoicesync","speakerJp":"アルテ","speakerKo":"아르테","jp":"「ところで、その手にあるのは手紙ですか？」","ko":"「그런데 손에 든 건 편지인가요?」"},{"index":11,"command":"msgvoicesync","speakerJp":"エトラ","speakerKo":"에트라","jp":"「はい、いっぱい届いていたので。\\n　あ、アルテ様宛てのもありましたよ。\\n　はい、どうぞ」","ko":"「네, 많이 와 있어서요.<br>　아, 아르테 님 앞으로 온 것도 있었어요.<br>　여기, 받으세요.」"},{"index":12,"command":"msgvoicesync","speakerJp":"アルテ","speakerKo":"아르테","jp":"「ふむふむ、差出人の記載がありませんね。\\n　青いバラの封蝋とは、またいいセンスですね。\\n　私のファンの方からでしょうか？」","ko":"「흠흠, 보낸 사람은 적혀 있지 않네요.<br>　파란 장미 문양의 밀랍 봉인이라니, 제법 감각이 있네요.<br>　제 팬이 보낸 걸까요?」"},{"index":13,"command":"message","speakerJp":"","speakerKo":"","jp":"機嫌よくアルテは封を開けて、中身を取り出す。\\n１枚の便箋と一緒に出てきたのは、１輪の青く塗られたバラだった。","ko":"아르테는 기분 좋게 봉투를 열어 내용물을 꺼낸다.<br>편지지 한 장과 함께 나온 것은 파랗게 칠한 장미 한 송이였다."},{"index":14,"command":"msgvoicesync","speakerJp":"アルテ","speakerKo":"아르테","jp":"「…………」","ko":"「…………」"},{"index":15,"command":"msgvoicesync","speakerJp":"エトラ","speakerKo":"에트라","jp":"「アルテ様……？」","ko":"「아르테 님……?」"},{"index":16,"command":"message","speakerJp":"","speakerKo":"","jp":"青バラを見たアルテは糸の切れた人形のように無表情になり、\\n無言になった。","ko":"파란 장미를 본 아르테는 실이 끊어진 인형처럼 표정이 사라졌고<br>아무 말도 하지 않았다."},{"index":17,"command":"message","speakerJp":"","speakerKo":"","jp":"困惑するエトラとサンソヴィーノを尻目に、\\nアルテはおもむろに青バラを拾い上げ、\\n便箋と一緒にぐしゃと握りつぶしてしまう。","ko":"당황한 에트라와 산소비노를 아랑곳하지 않고<br>아르테는 천천히 파란 장미를 집어 들어<br>편지지와 함께 와락 구겨 버린다."},{"index":18,"command":"message","speakerJp":"","speakerKo":"","jp":"そうして無言で執務室のゴミ箱にそれらを放り込んで、\\n他のゴミに紛れるように押し込んだ。","ko":"그러고는 말없이 그것들을 집무실 쓰레기통에 던져 넣고<br>다른 쓰레기에 섞이도록 밀어 넣었다."},{"index":19,"command":"msgvoicesync","speakerJp":"サンソヴィーノ","speakerKo":"산소비노","jp":"「アルテさん？\\n　どうしたんですか……？」","ko":"「아르테 씨?<br>　왜 그러세요……?」"},{"index":20,"command":"message","speakerJp":"","speakerKo":"","jp":"サンソヴィーノが不安げな表情で、アルテの肩に触れると――","ko":"산소비노가 불안한 표정으로 아르테의 어깨에 손을 대자――"},{"index":21,"command":"msgvoicesync","speakerJp":"アルテ","speakerKo":"아르테","jp":"「……？　あれ？\\n　どうしたんです、ふたり共。\\n　そんな暗い顔をして」","ko":"「……? 어라?<br>　왜 그래요, 두 분 다.<br>　그렇게 어두운 표정을 짓고.」"},{"index":22,"command":"message","speakerJp":"","speakerKo":"","jp":"アルテはまるで何事もなかったかのように、逆に困惑の表情を浮かべる。","ko":"아르테는 마치 아무 일도 없었던 것처럼 오히려 당혹스러운 표정을 짓는다."},{"index":23,"command":"msgvoicesync","speakerJp":"サンソヴィーノ","speakerKo":"산소비노","jp":"「……」","ko":"「……」"},{"index":24,"command":"msgvoicesync","speakerJp":"エトラ","speakerKo":"에트라","jp":"「……」","ko":"「……」"},{"index":25,"command":"msgvoicesync","speakerJp":"サンソヴィーノ","speakerKo":"산소비노","jp":"「えっと、アルテさん。\\n　その手紙は……」","ko":"「저기, 아르테 씨.<br>　그 편지는……」"},{"index":26,"command":"msgvoicesync","speakerJp":"アルテ","speakerKo":"아르테","jp":"「手紙？\\n　なんのことですか？」","ko":"「편지요?<br>　무슨 말씀이세요?」"},{"index":27,"command":"msgvoicesync","speakerJp":"サンソヴィーノ","speakerKo":"산소비노","jp":"「い、いえ。\\n　なんでもありません」","ko":"「아, 아니에요.<br>　아무것도 아니에요.」"},{"index":28,"command":"msgvoicesync","speakerJp":"アルテ","speakerKo":"아르테","jp":"「おかしなサンソヴィーノですね？\\n　バカンス疲れですか？」","ko":"「산소비노도 참 이상하네요?<br>　휴가 다녀오느라 피곤한가요?」"},{"index":29,"command":"msgvoicesync","speakerJp":"アルテ","speakerKo":"아르테","jp":"「今日は早く晩ごはんを食べて休みましょう。\\n　私は先に食堂に行きますね」","ko":"「오늘은 저녁을 일찍 먹고 쉬어요.<br>　저는 먼저 식당에 갈게요.」"},{"index":30,"command":"msgvoicesync","speakerJp":"サンソヴィーノ","speakerKo":"산소비노","jp":"「……」","ko":"「……」"},{"index":31,"command":"msgvoicesync","speakerJp":"エトラ","speakerKo":"에트라","jp":"「……」","ko":"「……」"},{"index":32,"command":"msgvoicesync","speakerJp":"サンソヴィーノ","speakerKo":"산소비노","jp":"「なんでしょうか、今の様子……。\\n　わからないふりをしているようにも見えませんでした」","ko":"「방금 그 모습은 대체 뭐였을까요…….<br>　모르는 척하는 것 같지도 않았어요.」"},{"index":33,"command":"msgvoicesync","speakerJp":"エトラ","speakerKo":"에트라","jp":"「流石に様子が不自然過ぎます。\\n　これは死の芸術の仕業かもしれません……！」","ko":"「아무리 봐도 너무 부자연스러워요.<br>　죽음의 예술이 한 짓일지도 몰라요……!」"},{"index":34,"command":"message","speakerJp":"","speakerKo":"","jp":"エトラはそう言って、ゴミ箱からアルテが握りつぶしたものを取り出す。\\n出てきた青いバラは、独特な青い色味を帯びたものだ。","ko":"그렇게 말하며 에트라는 쓰레기통에서 아르테가 구겨 버린 것을 꺼낸다.<br>꺼낸 파란 장미는 독특한 푸른빛을 띠고 있었다."},{"index":35,"command":"message","speakerJp":"エトラ","speakerKo":"에트라","jp":"「私と違うようで似てる、青いバラ……」","ko":"「나와는 다른 듯하면서도 닮은 파란 장미……」"},{"index":36,"command":"message","speakerJp":"サンソヴィーノ","speakerKo":"산소비노","jp":"「お手紙も青いインクで書かれていますね」","ko":"「편지도 파란 잉크로 쓰여 있네요.」"},{"index":37,"command":"message","speakerJp":"","speakerKo":"","jp":"丁寧に広げた便箋には“逃さない”と、ただ一言だけ書かれていた。","ko":"조심스럽게 펼친 편지지에는 “놓치지 않겠다”라는 단 한마디만 적혀 있었다."}]}],"totalRows":722};</script>
<script>
const DB = window.TRANSLATION_DATA;
let currentId = location.hash.replace("#","") || DB.episodes[0].id;
if (!DB.episodes.some(e => e.id === currentId)) currentId = DB.episodes[0].id;
let showJp = localStorage.getItem("gc-view-jp") === "1";
let dark = localStorage.getItem("gc-view-theme") === "dark";
let readerSize = Number(localStorage.getItem("gc-view-size") || "16");

const $ = s => document.querySelector(s);
const epList = $("#epList"), content = $("#content"), search = $("#search");
const jpBtn = $("#jpBtn"), themeBtn = $("#themeBtn"), size = $("#size");

function setTheme() {
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  themeBtn.textContent = dark ? "☀️ 밝게" : "🌙 어둡게";
}
function setJp() {
  content.classList.toggle("show-jp", showJp);
  jpBtn.classList.toggle("active", showJp);
  jpBtn.textContent = showJp ? "JP 원문 숨기기" : "JP 원문 보기";
}
function setSize() {
  document.documentElement.style.setProperty("--reader-size", readerSize + "px");
  size.value = readerSize;
}
function addMultiline(el, text, kind) {
  const parts = kind === "ko" ? text.split("<br>") : text.split("\\n");
  parts.forEach((part,i) => {
    if (i) el.appendChild(document.createElement("br"));
    el.appendChild(document.createTextNode(part));
  });
}
function normalized(text) {
  return (text || "").toLocaleLowerCase("ko-KR");
}
function rowMatches(row, q) {
  if (!q) return true;
  return [row.ko,row.jp,row.speakerKo,row.speakerJp,row.command,String(row.index)]
    .some(v => normalized(v).includes(q));
}
function renderSidebar() {
  epList.replaceChildren();
  for (const ep of DB.episodes) {
    const b = document.createElement("button");
    b.className = "ep-btn" + (ep.id === currentId ? " active" : "");
    b.innerHTML = `<span class="ep-id">${ep.id}</span><span class="ep-title"></span>`;
    b.querySelector(".ep-title").textContent = ep.titleKo;
    b.onclick = () => {
      currentId = ep.id;
      history.replaceState(null,"","#"+ep.id);
      search.value = "";
      render();
      window.scrollTo({top:0,behavior:"smooth"});
    };
    epList.appendChild(b);
  }
}
function render() {
  renderSidebar();
  const ep = DB.episodes.find(e => e.id === currentId);
  const q = normalized(search.value.trim());
  const matched = ep.rows.filter(r => rowMatches(r,q));
  content.replaceChildren();

  const head = document.createElement("section");
  head.className = "episode-head";
  const h2 = document.createElement("h2");
  h2.textContent = ep.titleKo;
  const meta = document.createElement("div");
  meta.className = "episode-meta";
  meta.textContent = `${ep.id} · ${ep.rows.length}행` + (q ? ` · 검색 결과 ${matched.length}행` : "");
  const jpTitle = document.createElement("div");
  jpTitle.className = "small-note jp-block";
  jpTitle.textContent = ep.titleJp;
  head.append(h2,meta,jpTitle);
  content.appendChild(head);

  if (!matched.length) {
    const n = document.createElement("div");
    n.className = "no-results";
    n.textContent = "검색 결과가 없습니다.";
    content.appendChild(n);
    setJp();
    return;
  }

  for (const row of matched) {
    const card = document.createElement("article");
    card.className = "row-card" + (row.command === "title" ? " title-row" : "") + (q ? " search-hit" : "");
    const top = document.createElement("div");
    top.className = "row-top";
    const sp = document.createElement("span");
    sp.className = "speaker";
    sp.textContent = row.command === "title" ? "제목" : (row.speakerKo || "내레이션");
    top.appendChild(sp);
    if (showJp && row.speakerJp && row.speakerJp !== row.speakerKo) {
      const sj = document.createElement("span");
      sj.className = "speaker-jp";
      sj.textContent = `(${row.speakerJp})`;
      top.appendChild(sj);
    }
    const cmd = document.createElement("span");
    cmd.className = "command";
    cmd.textContent = row.command;
    const idx = document.createElement("span");
    idx.className = "row-index";
    idx.textContent = `#${String(row.index).padStart(3,"0")}`;
    const hint = document.createElement("span");
    hint.className = "jp-toggle-hint";
    hint.textContent = "· 클릭하면 JP";
    top.append(cmd,idx,hint);

    const ko = document.createElement("div");
    ko.className = "ko";
    addMultiline(ko,row.ko,"ko");

    const jp = document.createElement("div");
    jp.className = "jp-block";
    addMultiline(jp,row.jp,"jp");

    card.append(top,ko,jp);
    card.tabIndex = 0;
    card.setAttribute("role", "button");
    card.setAttribute("aria-expanded", "false");
    const toggleRowJp = () => {
      if (showJp) return;
      const opened = card.classList.toggle("open");
      card.setAttribute("aria-expanded", opened ? "true" : "false");
    };
    card.addEventListener("click", toggleRowJp);
    card.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter" || ev.key === " ") {
        ev.preventDefault();
        toggleRowJp();
      }
    });
    content.appendChild(card);
  }
  setJp();
}
jpBtn.onclick = () => {
  showJp = !showJp;
  localStorage.setItem("gc-view-jp",showJp?"1":"0");
  render();
};
themeBtn.onclick = () => {
  dark = !dark;
  localStorage.setItem("gc-view-theme",dark?"dark":"light");
  setTheme();
};
size.oninput = () => {
  readerSize = Number(size.value);
  localStorage.setItem("gc-view-size",String(readerSize));
  setSize();
};
search.addEventListener("input", render);
window.addEventListener("hashchange", () => {
  const id = location.hash.replace("#","");
  if (DB.episodes.some(e => e.id === id)) {
    currentId = id; search.value=""; render();
  }
});
setTheme(); setSize(); render();
</script>
